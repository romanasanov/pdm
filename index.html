и рассказы о прошлых успехах (стр. 943). Ловушки: трудно отличить реальную болезнь от психологического усиления; диссоциативные состояния теряются при оценке когнитивного снижения; обычная возрастная сосредоточенность на себе — ещё не гистрионность (стр. 942–943).","olderP":"POA, стр. 942–944","cross":{"dsm":"гистрионное РЛ; на пограничном уровне — значительная часть того, что DSM называет пограничным РЛ (стр. 656, 686)","ampd":"отдельного типа нет → PD-TS (эмоциональная лабильность, поиск внимания)","icd":"РЛ по тяжести + негативная аффективность, расторможенность; на пограничном уровне — возможен «пограничный паттерн»"},"crossTxt":"DSM-5-TR — гистрионное РЛ; на пограничном уровне — значительная часть того, что DSM называет пограничным РЛ (стр. 656, 686). AMPD — отдельного типа нет → PD-TS (эмоциональная лабильность, поиск внимания). ICD-11 — РЛ по тяжести + негативная аффективность, расторможенность; на пограничном уровне — возможен «пограничный паттерн».","quiz":[{"q":"Руководитель отдела продаж держится как герой голливудского фильма: эффектен, флиртует с влиятельными клиентками и с женщиной-директором, о сделках рассказывает как о драмах, путает цифры. Когда директор хвалит коллегу-мужчину, он раздавлен и старается «вернуть» её внимание; с давним другом по отделу у него тёплые ровные отношения.","a":"hyst","sub":"демонстративный","o":["narc","hypom","dysreg"],"why":"соревнование за внимание ограничено сферой пола и власти, а вне её он способен к тёплой устойчивой связи (стр. 686) — у нарциссического потребность в восхищении глобальна, у дисрегулированного нестабильны все отношения."},{"q":"Бухгалтер из консервативной семьи подчёркнуто скромна и «правильна», краснеет от любых разговоров о внешности, но копирует манеры харизматичного финдиректора и пересказывает о нём почти сказочные истории. Перед его визитами у неё немеют руки — врачи причины не находят; в отчётах «проваливаются» детали.","a":"hyst","sub":"сдержанный","o":["somat","anxav","depend"],"why":"за скромностью — тема пола и власти, идеализирующее подражание, мышление «по впечатлению» и конверсия (стр. 686–687); соматизирующего отличают алекситимия и бедность воображения (стр. 685)."}],"mv":{"p":[2,7,8],"s":[4]},"teenN":"Истерический / импульсивно-истероидный","pa":{"n":"**Истерические и импульсивно-истероидные**","pg":"507–510","d":"Разделение: истерические — скорее невротический уровень, импульсивно-истероидные — пограничный. Пик импульсивности, незрелость префронтальной коры. Демонстративность ограничена сферой сексуальности и гендера, в отличие от нарциссизма"},"oa":{"d":"Сильная зависимость от культуры. Временная регрессия и жалобы в норме быстро проходят","pg":"942–943"}},{"id":"narc","n":"Нарциссический","full":"Нарциссический","en":"Narcissistic","m":"Нр","sp":"ext","typ":[2,3,3,2],"line":"Самооценка: восхищение против стыда и пустоты","subl":"явный, скрытый, злокачественный","theme":"Самооценка: внутренняя пустота требует постоянных «вливаний» восхищения, статуса и успеха; главное — не столкнуться со стыдом (стр. 688).","affects":"Стыд, зависть, пустота, скука; подъём и высокомерие, когда признание есть, подавленность и зависть, когда его нет; ярость при задетом самолюбии (стр. 688, 690).","relations":"Постоянное сравнение своего статуса с чужим; идеализация «особенных» (рядом с ними чувствует себя значимее) и обесценивание остальных (стр. 689). Другой нужен как зеркало.","self":"Качели «грандиозность — ничтожность»: явный вариант — «я лучший», скрытый — «мне недодали того, что я заслуживаю» (стр. 688).","counter":"Скука, рассеянность, раздражение, чувство невидимости; либо незаслуженная идеализация или обесценивание. Если рана видна — родительские чувства (стр. 689).","org":"Лидеры-визионеры и «звёзды»; болезненно воспринимают обратную связь; окружение делится на гениев и бездарей. ◆ Скрытый вариант — «непризнанный эксперт», который не выступает, но копит обиду на «выскочек».","help":"Интегрированный подход: тактично конфронтировать защиты, когда они на виду, и эмпатически настраиваться на боль и уязвимость, когда к ним есть доступ (стр. 689). Признание реальных заслуг без унижения; терпение — прогресс медленный, легче помочь с середины жизни, когда фантазии о безграничном успехе не сбылись (стр. 690).","avoid":"Слишком быстро разрушать идеализацию (стр. 689); унижать при обратной связи; соревноваться «в блеске» — давление быть блестящим, но не затмить клиента (стр. 689–690); ждать благодарности: зависть мешает признать, что помощь нужна (стр. 689).","proto":"Чувство собственной исключительности и права на особое отношение; другие — публика или соперники, сочувствия мало, много критики, зависти и борьбы за власть. На пренебрежение и критику — ярость и унижение. За фасадом силы — неуверенность, а у заметной части — постоянное чувство неполноценности, бессмысленности и беспощадные требования к себе.","basis":"эмпирический прототип SWAP (Box 12.8, стр. 690).","typicalTxt":"здоровый — встречается («лидер или визионер», стр. 652); невротический — типично (стр. 688); пограничный — типично (стр. 656, 688); психотический — встречается (стр. 656; ◆ в главе подробно не описан).","mvulnTxt":"6 — центральная, регуляция самооценки (стр. 688; M-ось стр. 722); 7 — эмпатия и близость (стр. 688, 690); 5 — поляризованный образ себя при неинтегрированном образе других, пример из M-оси (стр. 721); 11 — при злокачественном варианте (стр. 722).","vulnTxt":"crit — ярость и унижение в ответ на критику (стр. 690); mistake — разоблачение изъянов, у подростков — насмешка и разоблачение (стр. 502); dependency — нужда в помощи обнажает неполноту и включает зависть (стр. 689; у пожилых стр. 945); illness — у пожилых упадок тела и внешности (стр. 945).","pages":"652, 656, 667, 688–690, 721–722; PA 501–504; POA 944–946; PDC-3 1025.","spectrumTxt":"экстернализирующий (стр. 667); возможно глубокое внутреннее страдание (стр. 667).","sub":[{"n":"явный (overt)","d":"грандиозный, «толстокожий», высокомерный; именно его описывает DSM (стр. 688; PDC-3 стр. 1025)."},{"n":"скрытый (covert)","d":"застенчивый, стыдящийся, «истощённый жизнью»; грандиозность спрятана в фантазиях о заслуженном, но недоданном статусе (стр. 688–689)."},{"n":"злокачественный (malignant)","d":"нарциссизм, пропитанный садистической агрессией; по Кернбергу — на одном континууме с психопатией (стр. 688; M-ось стр. 722)."},{"n":null,"d":"Эмпирические подтипы (Russ et al.): грандиозный/злокачественный, хрупкий, высокофункциональный/эксгибиционистский — последний с заметными психологическими ресурсами (стр. 688; у подростков стр. 501–502)."}],"core":["idealself","idealization","devaluation","omnipotent"],"lv":[["честолюбие","Здоровое честолюбие и стремление к качеству; выдерживает критику и умеет восхищаться другими (◆; ср. «лидер или визионер», стр. 652)."],["ранимость","Социально успешен и обаятелен, но с бедной близостью; успехи переживаются ярко, неудачи — как стыд и пустота (стр. 688)."],["качели «гений — ноль»","Диффузная идентичность за грандиозным фасадом, нет внутренней морали, разрушительное для других поведение; злокачественный вариант — с садизмом (стр. 688)."],["бред величия","◆ Грандиозность до бредовой или переживание полного уничтожения себя (уровень назван на стр. 656, в главе не описан)."]],"bands":[["humor","sublimation","selfassert"],["idealself","idealization","rationalization"],["splitting","devaluation","omnipotent"],["distortion","delproj"]],"teen":"три подтипа — грандиозный, уязвимый (скрытый) и высокофункциональный/эксгибиционистский (стр. 501–502). Подростковый возраст — критический период для нормального и патологического нарциссизма; соцсети могут усиливать озабоченность собой (стр. 502). Уязвимым помогает эмпатическая настройка, высокофункциональным — интерпретации (стр. 504).","teenP":"PA, стр. 501–504","older":"ловушка — гордость своим возрастом, памятью, силой не означает РЛ, если раньше этого не было (стр. 944). Высокомерие может стать упрямством, возможен сдвиг к «истощённому» варианту, зависть к молодым, горечь и сожаления; риск суицида при депрессии (стр. 945). В учреждениях — частые смены персонала (стр. 946).","olderP":"POA, стр. 944–946","cross":{"dsm":"нарциссическое РЛ (описан только грандиозный вариант, стр. 688)","ampd":"нарциссическое РЛ (грандиозность, поиск внимания)","icd":"РЛ по тяжести + диссоциальность (эгоцентризм); скрытый вариант — плюс негативная аффективность"},"crossTxt":"DSM-5-TR — нарциссическое РЛ (описан только грандиозный вариант, стр. 688). AMPD — нарциссическое РЛ (грандиозность, поиск внимания). ICD-11 — РЛ по тяжести + диссоциальность (эгоцентризм); скрытый вариант — плюс негативная аффективность.","quiz":[{"q":"Коммерческий директор требует отдельный кабинет и «особые» бонусы, при всех называет подчинённых бездарями, а на критику совета директоров отвечает стыдом и яростью и потом неделями ходит подавленный. Финансовых злоупотреблений нет, сделки чистые.","a":"narc","sub":"явный","o":["psychop","para","hypom"],"why":"мотив — удержать самооценку через восхищение и статус, с провалом в стыд и подавленность (стр. 688–690), а не власть ради власти и удовольствие от обмана, как у психопатического (стр. 692)."},{"q":"Тихий аналитик избегает выступлений и называет себя неудачником. На коуч-сессии выясняется: он уверен, что коллег повысили незаслуженно, а сам он «умнее всех в отделе»; просит научить его быть «как эти успешные».","a":"narc","sub":"скрытый","o":["dep_r","anxav","masoch"],"why":"за подавленностью — грандиозные фантазии о заслуженном статусе, который мир недодал (стр. 688–689); у депрессивного самокритика без скрытой грандиозности (стр. 667)."}],"mv":{"p":[5,6,7],"s":[4,11]},"pa":{"n":"Нарциссические","pg":"501–504","d":"Грандиозный, уязвимый и высокофункциональный варианты. Подростковый возраст критичен для нарциссизма; соцсети могут усиливать"},"oa":{"d":"Гордость возрастом, памятью, силой — не РЛ, если раньше этого не было. Потребность в подтверждении ценности реалистично растёт","pg":"944"}},{"id":"para","n":"Параноидный","full":"Параноидный","en":"Paranoid","m":"Пр","sp":"ext","typ":[1,2,3,3],"line":"Угроза извне: лучше ударить первым","subl":"","theme":"Угроза извне: невыносимые чувства и импульсы отщепляются и приписываются другим; лучше ударить первым, чем ждать неизбежного унижения (стр. 690–691).","affects":"Страх, гнев, стыд и унижение; ненависть, зависть, презрение переживаются как ответ на чужое (стр. 690–691).","relations":"Недоверие, проверки на лояльность, поиск скрытых мотивов; одному страшно, в близости — тоже («используют»). Подозрительность провоцирует ту самую враждебность, которой он боится (стр. 691–692).","self":"Уязвимость и одновременно всемогущество: либо преследующая сила других, либо мегаломанская сила себя (стр. 691).","counter":"Страх, бессилие, злость — отражение отщеплённых чувств клиента; ощущение, что тебя постоянно критикуют (стр. 692). Тянет переубеждать (стр. 506).","org":"Охранители, аудиторы, специалисты по рискам. При регрессе — «охота на ведьм», поиск предателей; ◆ жалобы и тяжбы (сутяжничество у подростков, стр. 505).","help":"Деловое уважение без сюсюканья; ощущение спокойной силы, чтобы его злость не казалась разрушительной для собеседника; готовность прямо отвечать на вопросы (стр. 692). ◆ Прозрачность и предсказуемость решений.","avoid":"Быть слишком тёплым и заботливым — это будит страх регрессии и подозрение «зачем он так мил?» (стр. 692); уходить от ответов (стр. 692); спорить и переубеждать (стр. 506); ◆ ирония.","proto":"Хроническая подозрительность: другие навредят, обманут, предадут. Свои трудности объясняет чужими действиями, свою роль в конфликтах не видит; злость, обиды, споры, стремление контролировать, мало близких связей. При сильных эмоциях мышление становится странным, вплоть до почти бредового.","basis":"эмпирический прототип SWAP (Box 12.9, стр. 691).","typicalTxt":"здоровый — нетипично (стиль без расстройства возможен, стр. 654; ◆ в главе не описан); невротический — встречается ◆; пограничный — типично (стр. 690); психотический — типично (стр. 655, 690).","mvulnTxt":"3 — трудно встать на место другого (стр. 692); 7 — доверие, включая эпистемическое (стр. 691; у подростков стр. 505); 9 — проекция и элементы нарушения мышления (стр. 691); 2 ◆ — вспышки ярости (стр. 691).","vulnTxt":"secret — закрытость читается как заговор (стр. 691); crit — ожидание унижения (стр. 691; у подростков стр. 506); dependency — зависимость как нарочитое унижение (стр. 690; у пожилых стр. 946); intrude — страх быть использованным в чужих целях (стр. 692), персонал как вторгающийся (стр. 946).","pages":"654–655, 659, 661, 665, 667, 690–692; PA 504–507; POA 946–947; PDC-3 1025.","spectrumTxt":"экстернализирующий (стр. 667).","sub":[{"n":null,"d":"в PDC-3 нет (стр. 1025). ◆ Для обучения полезно различать, что именно проецируется: враждебность (преследование), зависимость (меня нарочно делают зависимым и унижают), влечение (ревность, эротомания) (стр. 690–691). Это варианты темы, не подтипы."}],"core":["projection","projid","denial","splitting"],"lv":[["бдительность","◆ Бдительный, видит риски, ценит справедливость и прямоту; проверяет, но может довериться."],["подозрительность","◆ Под стрессом обидчив и ищет скрытый смысл, но способен перепроверить и признать ошибку: проекция без «непоколебимой уверенности» (ср. стр. 659)."],["поиск врагов","Устойчивое недоверие, обиды, атака на опережение; приписанное другому переживается как факт (стр. 659, 691)."],["бред преследования","Повторяющиеся тяжёлые параноидные реакции, близкие к бреду, даже без галлюцинаций (стр. 661)."]],"bands":[["anticipation","humor"],["projection","displacement","reaction"],["projection","projid","splitting"],["delproj","distortion"]],"teen":"в детстве редок, в подростковом возрасте чаще и нередко связан с формирующимся антисоциальным или пограничным РЛ (стр. 504). Ловушка: отличить от продрома психоза — оценить, насколько убеждения непроницаемы для проверки (стр. 505). В анамнезе часто буллинг и высмеивание; помогает уважительная недефенсивная позиция, а не заверения (стр. 505–506).","teenP":"PA, стр. 504–507","older":"некоторая недоверчивость с возрастом нормальна из-за сенсорного и когнитивного ослабления (стр. 946). Ловушки: сначала проверить реальное жестокое обращение (стр. 946–947); поздно возникшая паранойя бывает симптомом нейрокогнитивного расстройства (стр. 946); в отличие от шизоидного, уходит в изоляцию из ожидания злого умысла (стр. 946).","olderP":"POA, стр. 946–947","cross":{"dsm":"параноидное РЛ","ampd":"отдельного типа нет → PD-TS (подозрительность, враждебность)","icd":"РЛ по тяжести + негативная аффективность (недоверчивость), диссоциальность или отстранённость"},"crossTxt":"DSM-5-TR — параноидное РЛ. AMPD — отдельного типа нет → PD-TS (подозрительность, враждебность). ICD-11 — РЛ по тяжести + негативная аффективность (недоверчивость), диссоциальность или отстранённость.","quiz":[{"q":"Начальник службы безопасности после реорганизации уверен, что закрытые встречи HR — заговор против него; объяснения воспринимает как попытку «держать его за дурака» и заранее пишет жалобы. В компании держится особняком и ни с кем не дружит.","a":"para","sub":"","o":["schiz","obs","narc"],"why":"дистанция — из ожидания злого умысла и с атакой на опережение (стр. 691), а не из амбивалентности к близости, как у шизоидного (стр. 946)."},{"q":"Финансовый контролёр годами одинаково подозрителен, держит обиды и объясняет любые сбои чужими интригами; эмоционально ровен, без качелей и самоповреждений. Когда новый руководитель начал подчёркнуто тепло его опекать, подозрительность резко выросла: «Зачем он так мил?»","a":"para","sub":"","o":["dysreg","psychop","obs"],"why":"стабильная проекция и рост подозрений в ответ на излишнее тепло (стр. 692); у дисрегулированного подозрительность вспыхивает ситуативно на фоне нестабильных отношений и аффекта (стр. 697)."}],"mv":{"p":[3,7,9],"s":[5]},"pa":{"n":"Параноидные","pg":"504–507","d":"В детстве редки, у подростков чаще, нередко на фоне антисоциальных или пограничных черт. Отличать от продрома психоза; в анамнезе часто травля"},"oa":{"d":"Недоверие часто следует из сенсорных и когнитивных потерь. Проверить жестокое обращение","pg":"946"}},{"id":"psychop","n":"Психопатический","full":"Психопатический","en":"Psychopathic","m":"Пп","sp":"ext","typ":[1,2,3,3],"line":"Власть ради власти: переиграть, не зависеть","subl":"пассивно-паразитический и агрессивный","theme":"Власть ради власти: «переиграть», обмануть, контролировать; важна сама победа, а не то, что выиграно (стр. 692).","affects":"Низкая тревожность, тяга к стимуляции, скука; бедная эмоциональная жизнь, неискренний «инструментальный» аффект; неосознаваемый стыд (стр. 693).","relations":"Другие — средства и соперники; интерес пропадает, когда человек больше не полезен. Точно считывает чужие состояния и пользуется этим (стр. 693).","self":"«Я сильнее и умнее правил»; ◆ за этим — непереносимость беспомощности и зависимости (ср. стр. 499, 694).","counter":"Сначала очарованность, потом глубокая тревога: нет эмоциональной связи, настороженность, ощущение «под каблуком», чувство, что тебя критикуют и подавляют. При истории насилия — в первую очередь собственная безопасность (стр. 694).","org":"Харизматичные «рейдеры», игра на грани правил; в некоторых профессиях такое поведение вознаграждается, а ответственность ловко уходит на других (стр. 692). Реагируют на силу и ясные последствия, а не на морализаторство.","help":"Позиция силы и неподкупной честности; рычаг — прямой собственный интерес человека, а не желание «стать лучше» (стр. 694). Ясные последовательные правила и ожидания (стр. 948). Шансы выше с середины жизни, когда сила убывает и всемогущество упирается в пределы (стр. 694).","avoid":"Сочувственно «тянуться» — доброта читается как слабость, которую можно использовать (стр. 694); делать для него исключения и нарушать правила (стр. 500–501); поддаваться обаянию; ◆ морализировать.","proto":"Использует других, лжёт и манипулирует, почти не раскаивается в причинённом вреде; импульсивен, ищет острых ощущений, ненадёжен в обязательствах. Угрозы и последствия мало меняют поведение, а убедительные обещания «измениться» не выполняются. Возможны удовольствие от агрессии и подавление близких запугиванием.","basis":"эмпирический прототип SWAP (Box 12.10, стр. 693).","typicalTxt":"здоровый — нетипично (◆ в PDM-3 не описан); невротический — встречается (описан у подростков, стр. 500; ◆ у взрослых — «социально одобряемая» психопатия в профессиях, где она вознаграждается, стр. 692); пограничный — типично (стр. 655, 665, 692); психотический — типично (стр. 665, 692).","mvulnTxt":"7 — эмпатии и связи нет (стр. 693); 11 — нет «морального центра тяжести» (стр. 693; M-ось стр. 729–730); 8 — импульсивность, тяга к стимуляции (стр. 693); 12 — не может описать свою эмоциональную жизнь (стр. 693). ◆ Когнитивная сторона ментализации (3) может быть сохранна и служить манипуляции (стр. 693, 501).","vulnTxt":"control ◆ — ограничения и правила (конфликты из-за правил учреждения, стр. 948; бунт против авторитетов у подростков, стр. 500); helpless — упадок силы и пределы всемогущества (стр. 694, 947); dependency ◆ — потребность утвердить власть, когда она утрачивается (стр. 947); alcohol — вещества и тяга к стимуляции (стр. 693).","pages":"655, 665, 667, 692–694, 729–730; PA 498–501; POA 947–948; PDC-3 1025.","spectrumTxt":"экстернализирующий (стр. 667).","sub":[{"n":"пассивно-паразитический («мошенник», con artist)","d":"эксплуатирует через обман и манипуляцию, без открытой злости: аферы, финансовые пирамиды (стр. 692; у подростков стр. 500; PDC-3 стр. 1025)."},{"n":"агрессивный","d":"гнев, запугивание, насилие (стр. 692; у подростков стр. 500; PDC-3 стр. 1025)."}],"core":["omnipotent","actingout","devaluation","denial","projection"],"lv":[["азарт и власть","◆ В PDM-3 не описан; условно — черты без расстройства: прагматичный игрок, любит конкуренцию, риск и власть, правила соблюдает, потому что так выгоднее."],["срезает углы","Прячет принуждающие намерения и обходит других умом и манипуляцией; может быть успешен в учёбе и работе (у подростков, стр. 500)."],["манипуляции","Ложь, эксплуатация и импульсивность — основной способ жить; раскаяния нет, последствия не учат (стр. 692–693)."],["хищник","Нарушения мышления и тестирования реальности, высокая склонность к опасной агрессии (у подростков, стр. 500); ◆ мир делится на хищников и жертв."]],"bands":[["suppression","selfassert"],["rationalization","omnipotent"],["omnipotent","actingout","devaluation"],["delproj","psydenial"]],"teen":"«антисоциально-психопатический». DSM переоценивает внешние антисоциальные поступки (пересечение с расстройством поведения); важнее внутренние качества — бессердечие, манипулятивность, удовольствие от всемогущего контроля (стр. 498–499). Ловушка: плохое поведение — не диагноз: подросток может быть глубоко привязан к своей группе или разыгрывать диссоциированную травму (стр. 500). Альянс возможен через уважение к силе и уму терапевта; у младших исходы лечения иногда положительны (стр. 500–501).","teenP":"PA, стр. 498–501","older":"встречается реже, обман менее осуществим, но потребность во власти остаётся — например, в бизнесе и финансах (стр. 947). Ловушки: возрастная свобода от чужих мнений — не психопатия; импульсивность и агрессия бывают ранним признаком нейрокогнитивного расстройства; проверять, тянется ли поведение с детства (стр. 947).","olderP":"POA, стр. 947–948","cross":{"dsm":"антисоциальное РЛ","ampd":"антисоциальное РЛ, со спецификатором «психопатические черты»","icd":"РЛ по тяжести + диссоциальность и расторможенность"},"crossTxt":"DSM-5-TR — антисоциальное РЛ. AMPD — антисоциальное РЛ, со спецификатором «психопатические черты». ICD-11 — РЛ по тяжести + диссоциальность и расторможенность.","quiz":[{"q":"Обаятельный менеджер по партнёрствам годами «занимает» у коллег деньги под трогательные истории и выдаёт чужие идеи за свои. Пойманный, спокойно меняет легенду и извиняется так убедительно, что ему снова верят; поражает, насколько точно он считывает настроение собеседника.","a":"psychop","sub":"пассивно-паразитический","o":["narc","hyst","hypom"],"why":"удовольствие от обмана, отсутствие раскаяния и точное чтение чужих состояний ради выгоды (стр. 692–693); нарциссическому нужно восхищение, а не выигрыш обманом."},{"q":"Директор по закупкам давит на поставщиков угрозами и запугивает подчинённых ради нужных условий. Когда сделка закрыта, интерес к людям у него пропадает: «добивать» проигравших он не возвращается и о них не вспоминает.","a":"psychop","sub":"агрессивный","o":["sadist","narc","para"],"why":"жестокость инструментальна — цель власть и выигрыш, люди интересны, пока полезны (стр. 692–693); садист унижает ради самого удовольствия от господства над слабым (стр. 694–695)."}],"mv":{"p":[7,8,11],"s":[12]},"teenN":"Антисоциально-психопатический","pa":{"n":"**Антисоциально-психопатические**","pg":"498–501","d":"Другое название. DSM переоценивает внешние поступки; одного «плохого поведения» мало, ключ — неспособность к привязанности. Подтипы пассивно-паразитический и агрессивный. **Садизм — при тяжёлых вариантах** (стр. 499)"},"oa":{"d":"Встречается реже. Свобода от чужого мнения и фокус на себе — не психопатия. Импульсивность и агрессия бывают при ранней деменции","pg":"947"}},{"id":"sadist","n":"Садистический","full":"Садистический","en":"Sadistic","m":"Сд","sp":"ext","typ":[1,1,3,3],"line":"Господство: бессилие превращается во власть над другим","subl":"","theme":"Господство: превратить собственное бессилие во всемогущество через полный контроль над другим (стр. 694).","affects":"Мертвенность и эмоциональная стерильность; холодное удовольствие или азарт без вины при доминировании; ненависть и презрение (стр. 694–695, 949).","relations":"Другие — объекты для забавы, а не субъекты; мишени — всегда подчинённые, более слабые и беззащитные (стр. 695).","self":"◆ «Я выше; сила — в том, чтобы другой корчился»; за этим — непереносимое бессилие (ср. стр. 694, 948).","counter":"Висцеральная тревога, жуть, запуганность, «мурашки» — как у добычи рядом с хищником; клиент может мучить интервьюера ложью, умолчаниями или смакованием деталей. Такой контрперенос — сигнал оценить опасность (стр. 695).","org":"◆ Мишени — стажёры, подчинённые, зависимые; с равными и вышестоящими корректен. Методичные «проверки» и публичные унижения без вспышек гнева. Важно: большинство агрессоров садистами характерологически не являются (стр. 695).","help":"Реалистичные цели: ограничить возможности для вреда, защитить потенциальные мишени и уже пострадавших, трезво распределить ресурсы, защитить себя (стр. 696); в учреждениях — сдерживать крайние формы поведения (стр. 949). Сообщений об успешной терапии характерологического садизма нет (стр. 695).","avoid":"Игнорировать собственное чувство жути (стр. 695); оставлять уязвимых в его власти (стр. 949; ◆ для организаций); ◆ полагаться только на эмпатию — раскрытая уязвимость становится материалом для господства; ◆ давать бурную эмоциональную реакцию — она подкрепляет.","proto":"Внутренняя мертвенность и пустота, которые снимаются причинением боли и унижения — в фантазии и часто в реальности. Цель — подчинить и контролировать, причём спокойно и отстранённо, иногда по заранее продуманному сценарию, превращающему другого в вещь. Лжив, может полностью скрывать свои садистические интересы.","basis":"клиническое описание (Box 12.11, стр. 695). Эмпирического прототипа SWAP нет; исследований почти нет, кроме криминального сексуального садизма (стр. 694).","typicalTxt":"здоровый — нетипично (◆ не описан); невротический — нетипично (◆ не описан); пограничный — типично (стр. 694); психотический — типично (стр. 694).","mvulnTxt":"7 — привязанность серьёзно нарушена (стр. 695); 11 — без вины (стр. 695; M-ось стр. 729–730); 2 — мертвенность и отстранённое спокойствие, ◆ возможно, защита от ярости (стр. 695); 12 — ограниченный инсайт (стр. 949).","vulnTxt":"helpless — бессилие превращается во всемогущество (стр. 694); dependency — у пожилых зависимость встречается обидой и попытками доминировать (стр. 948–949); crit — страх унижения запускает упреждающее обесценивание (стр. 948); novelty — незнакомая среда (больница, учреждение) (стр. 948).","pages":"656, 667, 694–696, 729–730; PA 499; POA 948–949; PDC-3 1025.","spectrumTxt":"экстернализирующий (стр. 667).","sub":[{"n":null,"d":"нет (PDC-3, стр. 1025)."}],"core":["omnipotent","devaluation","rationalization","idaggressor"],"lv":[["не описан","Нетипично; в PDM-3 не описан. ◆ Здесь уместно говорить лишь о садистических фантазиях или отдельных чертах в рамках другого стиля."],["не описан","Нетипично; в PDM-3 не описан. ◆ Жестокость, ограниченная одной сферой, при сохранной способности к вине — скорее черта при другом стиле."],["холодное господство","Методичное подчинение и унижение слабых с отстранённым удовольствием и без вины (стр. 694–695)."],["хищник-мучитель","◆ Уровень назван (стр. 694), но не описан: садистические сценарии без опоры на реальность другого."]],"bands":[["sublimation","suppression"],["rationalization","displacement"],["omnipotent","devaluation","idaggressor"],["delproj","distortion"]],"teen":"в PA-оси стиля нет. Садизм упомянут лишь как черта тяжёлых вариантов антисоциально-психопатической личности (стр. 499).","teenP":"PA","older":"частота неизвестна; явная жестокость менее вероятна, поэтому садизм легко пропустить (стр. 948). Ловушка: зависимость и незнакомая среда могут вызвать у обычного пожилого человека короткие эпизоды унижающей агрессии — без анамнеза это не черта (стр. 948). Устойчивый садизм — презрение к тем, от кого зависит; иногда семья оставляет за бывшим «главой» власть, и он продолжает её использовать (стр. 949).","olderP":"POA, стр. 948–949","cross":{"ampd":"PD-TS (бессердечие, враждебность, манипулятивность)","icd":"РЛ по тяжести + диссоциальность"},"crossTxt":"DSM — садистическое РЛ было провизорным в DSM-III-R и исключено из следующей редакции (стр. 694); в DSM-5-TR нет; парафилия «сексуальный садизм» не тождественна стилю (стр. 695). AMPD — PD-TS (бессердечие, враждебность, манипулятивность). ICD-11 — РЛ по тяжести + диссоциальность.","quiz":[{"q":"Старший смены без вспышек гнева, с улыбкой выстраивает для самой неопытной сотрудницы многоходовые «проверки», затем при всех разбирает её ошибки и заметно наслаждается её растерянностью. Выгоды ему это не приносит; с равными и начальством он безупречно корректен.","a":"sadist","sub":"","o":["psychop","para","obs"],"why":"холодное удовольствие от подчинения слабого, продуманный сценарий и выбор беззащитной мишени (стр. 694–695); выгоды нет (не психопатический), страха нападения нет (не параноидный)."},{"q":"Основатель семейной компании после инсульта формально отошёл от дел, но семья оставила за ним право вето. Он язвительно высмеивает ошибки младших родственников-сотрудников и сиделок, смакует их смущение и считает это нормальным «воспитанием»; такие сцены были всю его жизнь.","a":"sadist","sub":"","o":["narc","obs","para"],"why":"давнее удовольствие от унижения зависимых и уверенность в нормальности этого (стр. 948–949); у пожилого нарциссического — горечь, зависть и сожаления об утраченном (стр. 945)."}],"mv":{"p":[2,7,11],"k":[8]},"pa":{"n":"—","pg":"—","d":"**Отдельной карточки в PA нет.** Садизм упомянут при тяжёлых антисоциально-психопатических (стр. 499). ◆ Серая карточка"},"oa":{"d":"Данных почти нет. Эпизоды унижения других при вынужденной зависимости в учреждении, если раньше такого не было, кратковременны","pg":"948"}},{"id":"dysreg","n":"Эмоционально дисрегулированный","full":"Эмоционально дисрегулированный","en":"Emotionally Dysregulated","m":"ЭД","sp":"dys","typ":[0,0,3,0],"line":"Привязанность как дилемма: без другого нельзя, рядом страшно","subl":"","theme":"Привязанность как неразрешимая дилемма: без другого не успокоиться, но близость поглощает. Отсюда раскачка между цеплянием, атакой и отстранением (стр. 696–697).","affects":"Интенсивные, быстро раскручивающиеся эмоции, катастрофизация; хроническая внутренняя пустота; трансоподобные, диссоциативные состояния (стр. 697).","relations":"Гипербдительность к признакам отвержения, нейтральное читается как отвергающее; одновременно — чувство контроля и поглощения, нужда сбежать. Другие то идеальны, то плохи (стр. 697).","self":"Нет связного чувства себя: переходы между состояниями «я» без ощущения непрерывности, растерянность от собственных реакций (стр. 697).","counter":"Страх, растерянность, бессилие, желание наказать или, наоборот, спасти и «вылечить любовью» (стр. 660). Втягивание в чужие для себя роли — жестокого или героического спасателя (стр. 698).","org":"◆ Восторженное начало и бурные разрывы; руководитель — то «единственный, кто понимает», то «предатель». Вокруг него ссорятся коллеги (стр. 698); трудовая история нестабильна (стр. 697).","help":"Чётко определённая рамка и границы; рабочий альянс и разбор неизбежных разрывов; готовность выдерживать гнев и обиду, когда границы сохраняются; не поощрять регрессию; быть эмоционально настоящим; развивать ментализацию; работать «здесь и сейчас»; супервизия для помогающего (стр. 662–663, 697–698).","avoid":"Отступать от рамки из-за страдания: продлевать встречи, добавлять внеплановые, быть «на связи» круглосуточно — это ведёт к регрессии и истощению помогающего (стр. 663). Долгое молчание и «непроницаемость» читаются как неискренность (стр. 662, 664); уход в детские истории как в оправдание (стр. 663).","proto":"Эмоции быстро раскручиваются до крайностей — отчаяние, тревога, ярость; катастрофизация и неспособность успокоиться без другого человека. Нестабильный образ себя и чёрно-белое восприятие других делают отношения бурными; привязывается быстро и боится отвержения. Импульсивен, включая самоповреждение и суицидальность, — особенно когда привязанность под угрозой.","basis":"эмпирический прототип SWAP (Box 12.12, стр. 698).","typicalTxt":"здоровый — невозможно; невротический — невозможно; пограничный — типично, единственно возможный: все с этим стилем — на пограничном уровне, но не все на пограничном уровне имеют этот стиль (стр. 665, 696); психотический — невозможно (◆ транзиторные психотические эпизоды под стрессом допустимы — стр. 510, 949, — но уровень остаётся пограничным).","mvulnTxt":"2 — ядро стиля (стр. 697); 3 — ментализация (стр. 697); 5 — интеграция, диффузия идентичности (стр. 697); 8 — импульсы (стр. 697); 7 — доверие: эпистемическая гипербдительность (у подростков, стр. 511).","vulnTxt":"attach — дистресс запускает угроза или разрыв привязанности (стр. 658, 698); reject — нейтральное читается как отвержение (стр. 697); alone — не может успокоиться без другого (стр. 697); intrude — близость переживается как контроль и поглощение (стр. 697). trauma ◆ — диссоциативные и трансоподобные состояния при напоминании о травме (стр. 697; перенесено из справочной карточки «Диссоциативный»).","pages":"656, 658, 660, 662–665, 667, 696–698; PA 480–481, 510–512; POA 949–950; PDC-3 1025.","spectrumTxt":"дисрегулированный: ни интернализирующий, ни экстернализирующий — «стабильно нестабильные», колеблются между двумя режимами (стр. 667). У подростков — отдельный, третий спектр (стр. 481).","sub":[{"n":null,"d":"нет (PDC-3, стр. 1025). ◆ Важнее различать высокий (ближе к неврозу) и низкий (ближе к психозу) пограничный уровень: от этого зависит баланс исследования и поддержки (стр. 658)."}],"core":["splitting","projid","projection","actingout","dissociation"],"lv":[["невозможно","По PDM-3 стиль связан только с пограничным уровнем (стр. 665, 696)."],["невозможно","То же (стр. 665, 696)."],["буря привязанности","Эмоции захлёстывают, отношения рвутся и возобновляются, самоповреждение — чтобы успокоиться или «почувствовать себя живым»; на высоком пограничном уровне возможна работа с инсайтом, на низком — поддержка и наращивание способностей (стр. 658, 697)."],["невозможно","◆ Кратковременные психотические эпизоды возможны (стр. 510, 949), но уровень организации не меняют."]],"bands":[["selfobs","affiliation"],["repression","displacement"],["splitting","projid","actingout"],["splitting","projid","fragmentation"]],"teen":"«формирующаяся эмоционально дисрегулированная личность», отдельный спектр (стр. 481). Ловушка: кризис идентичности у подростков нормален, а диффузия указывает на патологию (стр. 469); при этом показатели диффузии в подростковом возрасте в целом растут, следуя за пограничными чертами (стр. 480, сноска 4). Под стрессом — дереализация, деперсонализация, транзиторные психотические симптомы (стр. 510); у помогающих — желание спасти и «перевоспитать», трудности с рамкой (стр. 512).","teenP":"PA, стр. 510–512","older":"самоповреждения и бурные отношения реже, диагностировать труднее; вместо них — саботаж лечения, вещества, соматические синдромы, диссоциация (стр. 949). Через 20 лет полную картину сохраняет лишь около четверти, но пустота, страх покинутости и защиты устойчивы — неясно, улучшение ли это (стр. 950). Полезна команда с практической помощью (стр. 950).","olderP":"POA, стр. 949–950","cross":{"dsm":"пограничное РЛ (стр. 696)","ampd":"пограничное РЛ","icd":"РЛ по тяжести + спецификатор «пограничный паттерн»"},"crossTxt":"DSM-5-TR — пограничное РЛ (стр. 696). AMPD — пограничное РЛ. ICD-11 — РЛ по тяжести + спецификатор «пограничный паттерн».","quiz":[{"q":"Специалист по маркетингу после того, как руководительница перенесла встречу, ночью пишет ей десяток сообщений — от «вы единственная, кто меня понимает» до «вы такая же, как все». Утром говорит о пустоте и о том, что «не понимает, кто она»; в прошлом были самоповреждения.","a":"dysreg","sub":"","o":["hyst","depend","narc"],"why":"угроза привязанности запускает раскачку от идеализации к обесцениванию, пустоту и импульсивные действия (стр. 697–698); у истерического в центре тема пола и власти, а вне её возможны стабильные связи (стр. 686)."},{"q":"Новый сотрудник две недели восхищается командой, потом после нейтрального замечания коллеги решает, что его «выживают», и пишет заявление; на следующий день со слезами забирает. Говорит, что то хочет быть ближе к людям, то задыхается g":{"t":["separation_home","instab","adultroles","exams","context"],"s":["moratorium","optimism","prosocial","therapy"]},"older":{"t":["retire","widow","emptynest","sensory","cognitive","institution","ageism","maltreat","finitude","dependency","illness","loss"],"s":["partner","disengage","pruning","meaning","autonomy","kin","validate","territory"]},"adult":{"t":["crit","loss","reject","intrude","chaos","control","trauma","secret","mistake","success","fatigue","alcohol","alone","attach","dependency","illness","novelty","helpless","context"],"s":["holding","sleep","structure","mentalize","reality","space","recognition","grounding","therapy","confront","autonomy","realperson","mourning","validate"]}},"SUPPORT":[{"v":0,"n":"Нет","d":"Нет устойчивой поддерживающей среды."},{"v":33,"n":"Минимальная","d":"Редкие встречи, нестабильная поддержка близких."},{"v":66,"n":"Устойчивая","d":"Регулярная терапия, поддерживающие близкие с низким уровнем критики, ясная структура работы."},{"v":100,"n":"Интенсивная","d":"Терапевтическое сообщество, дневной стационар, плотная структура дня."}],"PC":[{"id":"pc_high","n":"Высокофункциональный","en":"Emerging high-functioning","pages":"стр. 238–239","m":"Вф","line":"Энергичный, ответственный, с ясными внутренними правилами","d":"Энергичный, ответственный, творческий ребёнок с ясными внутренними правилами, хорошей регуляцией, вниманием и речью. Чувства соразмерны ситуации; умеет и соревноваться, и дружить на равных.","signs":"в школе охотно берёт трудное, конкурирует без распада, шутит к месту; дома, когда обижен, позволяет родителям себя утешить.","risk":"если возникает клиническая проблема, при адекватной поддержке обычно справляется (стр. 239). О взрослых исходах в PDM-3 не сказано.","help":"поддержка при серьёзных стрессах и травмах (стр. 239). ◆ Не делать «сильного» ребёнка опорой для взрослых.","defs":[],"linkTxt":"маркер здорового уровня, а не стиль.","link":[],"sim":null,"mv":{"p":[],"s":[]}},{"id":"pc_inhib","n":"Тормозимый / замкнутый","en":"Emerging inhibited/withdrawn","pages":"стр. 239–240","m":"Тз","line":"Всё вокруг страха критики, отвержения и разлуки","d":"Всё организовано вокруг страха критики, неодобрения, отвержения и разлуки. Ребёнок стыдлив, пассивен, сомневается в себе, мало радуется и с трудом выражает несогласие и злость.","signs":"в школе молчит, избегает новых занятий, болезненно реагирует на замечания; учителя часто не видят проблемы. Дома цепляется за родителя, боится расставаний, в дружбе ищет безусловного принятия.","risk":"может сочетаться с депрессией, тревогой, социальным торможением, низкой самооценкой (стр. 240). О взрослом исходе в PDM-3 не сказано. ◆ Возможные траектории — anxav, depend.","help":"в PDM-3 не описано. ◆ Постепенная поддержка самостоятельности и самоутверждения. Работа с родителями: в семейном фоне часто доминирующие, вторгающиеся взрослые, для которых взросление ребёнка — «предательство» (стр. 240).","defs":[],"linkTxt":"anxav, depend.","link":["anxav","depend"],"sim":"anxav","mv":{"p":[1,2,10],"s":[4]}},{"id":"pc_depr","n":"Депрессивный","en":"Emerging depressive","pages":"стр. 240–241","m":"Дп","line":"Вина и самокритика: «я плохой»","d":"В центре — вина и самокритика, тогда как у тормозимого — страх. Ребёнок объясняет беды собственной «плохостью», и это парадоксально даёт ему чувство контроля.","signs":"в школе боится насмешки, не берётся за задание сам, жалуется на тело, пропускает «по болезни», старается быть «хорошим». Под стрессом теряет уже освоенные навыки. Дома остро реагирует на утраты и отвержение и винит себя.","risk":"гомотипическая непрерывность, может продолжаться в подростковом и взрослом возрасте (стр. 241). При сопутствующей дисрегуляции функционирование ниже (стр. 241).","help":"помочь проявить спрятанные негативные чувства, включая обычную критику в адрес специалиста. Помочь понять, что «я плохой» защищает от другой правды: жизнь не всегда под контролем (стр. 240).","defs":[],"linkTxt":"dep_r.","link":["dep_r"],"sim":"dep_r","mv":{"p":[6,11,13],"s":[2]}},{"id":"pc_obs","n":"Обсессивный","en":"Emerging obsessive","pages":"стр. 241–242","m":"Об","line":"Детали, порядок и правила; злость под запретом","d":"Чрезмерное внимание к деталям, правилам, порядку и чистоте, руминации не по возрасту. Злость под запретом; агрессия выходит косвенно; ребёнок колеблется между зависимостью и показной независимостью.","signs":"в школе вежлив и ответственен, его хвалят, но ритуалы и перфекционизм съедают время; друзей мало. Дома упрямится, боится грязи, не может выбросить ненужное.","risk":"черты обычно сохраняются во взрослости (гомотипическая непрерывность); компульсивной части в детстве может не быть (стр. 242). Континуум от адаптивной старательности до утраты контроля над тревогой (стр. 242).","help":"в PDM-3 не описано. ◆ Не подкреплять «идеальность»; давать опыт допустимой ошибки и безопасного выражения злости.","defs":["isolation","compartmentalization","intellectualization"],"linkTxt":"obs.","link":["obs"],"sim":"obs","mv":{"p":[2,8,11],"s":[7,12]}},{"id":"pc_dysreg","n":"Дисрегулированный","en":"Emerging dysregulated","pages":"стр. 242–243","m":"Дс","line":"Внезапные бури чувств и страх покинутости","d":"Внезапные интенсивные смены настроения, импульсивность, гнев, нестабильный образ себя и примитивные защиты. Отношения бурные, но поверхностные, с отчаянными попытками избежать покинутости.","signs":"в школе функционирование может быть сильно нарушено, есть проблемы внимания и памяти. Дома театральные вспышки, контроль и манипуляции, чуткость к невысказанному настроению взрослых, проблемы сна и еды.","risk":"именно эмоциональная дисрегуляция, а не импульсивность, — сильный предиктор пограничных симптомов во взрослости (стр. 242). Часто дезорганизованная привязанность и травма (стр. 242–243).","help":"в PC прямо не описано. ◆ Устойчивая ко-регуляция; работа с родителями над теплом, отзывчивостью и последовательностью (общий принцип главы, стр. 217).","defs":[],"linkTxt":"dysreg.","link":["dysreg"],"sim":"dysreg","mv":{"p":[2,3,5],"s":[4,8]}},{"id":"pc_impuls","n":"Импульсивный","en":"Emerging impulsive","pages":"стр. 243–244","m":"Им","line":"Действие без оглядки; гнев вместо печали","d":"Действует без оглядки на последствия, использует других; переживает в основном гнев, а не печаль; опирается на расщепление и обесценивание. За «избалованностью» обычно прячутся низкая самооценка и избегание стыда.","signs":"в школе — борьба за власть со взрослыми, нарушение правил, ложь, мало друзей. Дома родители истощены и боятся его поведения. Две подгруппы: с чёрствостью и безэмоциональностью (CU-черты) и без них (стр. 243).","risk":"на дезадаптивном полюсе — риск криминальности (стр. 243). Отвержение сверстниками связано с последующей агрессией и делинквентностью (стр. 244). Расстройства поведения с CU-чертами считаются предшественником психопатии (стр. 470).","help":"ясные границы плюс эмпатический отклик, помощь в регуляции аффекта и сдерживании поведения; связать самооценку с самоконтролем (стр. 244).","defs":[],"linkTxt":"psychop, narc (в главе отдельно описаны нарциссические проблемы, стр. 243).","link":["psychop","narc"],"sim":"psychop","mv":{"p":[7,8,11],"s":[12]}},{"id":"pc_susp","n":"Подозрительный","en":"Emerging suspicious","pages":"стр. 244–245","m":"Пд","line":"Ждёт злого умысла, остро чувствует унижение","d":"Ждёт злого умысла; ревнив, злопамятен, остро чувствителен к стыду и унижению. Внутри два образа: идеальное «я» и преследующие другие.","signs":"в школе заранее нападает или избегает, не делится ни вещами, ни чувствами. Дома не принимает зависимость, «слишком самостоятелен» для возраста, юмора мало.","risk":"по клиническому опыту, взрослые с параноидным РЛ в детстве часто имели этот паттерн; исследований мало (стр. 244).","help":"в PDM-3 не описано. ◆ Прозрачность, предсказуемость, защита от травли, никаких насмешек. Фон: унижения, дразнилки, травля, садистичные взрослые (стр. 245).","defs":[],"linkTxt":"para.","link":["para"],"sim":"para","mv":{"p":[3,7,9],"s":[5]}},{"id":"pc_schiz","n":"Шизоидный","en":"Emerging schizoid","pages":"стр. 245–246","m":"Шз","line":"Своеобразный, уходит «внутрь»; близость переполняет","d":"Своеобразные мысли и поведение. Чувства либо узкие, либо такие сильные, что ребёнок уходит «внутрь». Хроническая дилемма: близость переполняет, а в фантазиях живёт идеальная близость.","signs":"в школе сверстники его игнорируют, речь размыта, магическое мышление, неуспеваемость. Дома ритуалы вокруг сна, еды и туалета, моторная неловкость, иногда поздно пошёл или заговорил.","risk":"паттерн неоднороден. Часть детей улучшается, у части появляются шизотипические или психотические симптомы; возможна генетическая связь с шизофренией (стр. 246).","help":"в PDM-3 не описано. ◆ Уважение дистанции, контакт через интересы, бережное «приглашение».","defs":[],"linkTxt":"schiz. ◆ Отличать от РАС по критерию из PA: при РАС социальные сигналы не считываются, при шизоидности считываются, но отношения отвергаются (стр. 491).","link":["schiz"],"sim":"schiz","mv":{"p":[3,5,7],"k":[12]}}],"AGEB":{"iec":{"tasks":["Регуляция состояний и совместное внимание (0–3 мес. и далее), затем вовлечённость и отношения (3–6 мес.) (стр. 98).","Двусторонний целенаправленный эмоциональный обмен (6–9 мес.), затем совместное решение социальных задач длинными цепочками сигналов (9–18 мес.) (стр. 98).","Символы и идеи в игре «понарошку» (18–30 мес.), затем логические мосты между идеями (30–48 мес.) (стр. 98, 146).","Привязанность как стратегия регуляции аффекта. Надёжность означает уверенность в эмоциональной доступности взрослого (стр. 146–147).","Сенсорная регуляция: из её профиля вырастают внимание, обучение и контроль импульсов (стр. 144–145, 147)."],"levelsText":"Шкалы уровней организации личности для 0–3 нет. Вместо четырёх уровней атлас показывает три континуума:\n1. **Функциональный уровень оси II** (1–6) с возрастными ориентирами (стр. 98).\n2. **Профиль сенсорной регуляции (ось III):** от нормальной вариации до расстройства. Расстройством профиль становится, когда мешает повседневным и возрастным эмоциональным, социальным и учебным задачам (стр. 24).\n3. **Качество отношений (ось IV):** от хорошо регулируемого взаимодействия до расстройства отношений (стр. 24).\n◆ В интерфейсе селектор «здоровый — психотический» заменить этими тремя шкалами.","levelsTable":null,"setText":"","setTable":null,"traps":["Читать симптом двухлетнего как черту характера. В этом возрасте значение симптома понимают через первичные отношения и регуляцию (стр. 144).","Ставить основной диагноз по одному симптому. Нарушение питания может быть сенсорным, медицинским или отношенческим, поэтому сначала оцениваются все оси (стр. 24–25).","Делать прогноз по гендерно-нетипичным интересам с 2 лет: устойчивость таких интересов обычно предсказать невозможно (стр. 26–27).","Путать возрастные рамки диагнозов. Регуляторно-сенсорные расстройства обычно диагностируют в младенчестве, ОКР и СДВГ — только в детстве. РАС в PDM-3 привязано к возрасту после 3 лет, но предвестники нужно замечать как можно раньше (стр. 26, 143–144)."],"sub":null,"iec":{"axes":[["I","Основной диагноз","14 групп: от нарушений развития отношений и коммуникации до травматического стресса и оппозиционных расстройств (IEC01–IEC14, стр. 26)"],["II","Функциональные эмоциональные способности","6 уровней развития с возрастными ориентирами (стр. 98)"],["III","Регуляторно-сенсорная обработка","Профиль регуляции: от нормальной вариации до расстройства (стр. 24, 26)"],["IV","Паттерны и расстройства отношений","Качество отношений с взрослыми: от хорошо регулируемого взаимодействия до расстройства (стр. 24)"],["V","Медицинские и неврологические диагнозы","Телесные причины симптома — например, рефлюкс при нарушении питания (стр. 24)"]],"fl":[["1","Регуляция и совместное внимание","0–3 мес. и далее"],["2","Вовлечённость и отношения","3–6 мес."],["3","Двусторонний целенаправленный эмоциональный обмен","6–9 мес."],["4","Совместное решение социальных задач длинными цепочками сигналов","9–18 мес."],["5","Символы и идеи в игре «понарошку»","18–30 мес."],["6","Логические мосты между идеями","30–48 мес."]],"sens":["Гиперчувствительный: тревожно-пугливый или негативистично-упрямый","Гипочувствительный, погружённый в себя: A — трудно вовлечь; B — творческий","Активный, ищущий ощущений","Невнимательный, дезорганизованный","Смешанные"],"bridge":[["Оси II и III","M1 — внимание и обучение"],["Оси II и IV","M2 — аффект"],["Символизация (ось II) и ментализация родителя (ось IV)","M3 — ментализация"],["Ось III","M4 — тело и M8 — импульсы"],["Привязанность (ось IV)","M5–M7, M9 и M10"],["—","у M11–M13 предшественников в осях IEC нет"]],"transition":"Переход 3–4 года: систему выбирает клиницист. Если речь и символизация пока не позволяют оценить ментальное функционирование, остаются оси IEC. Если ребёнок играет символически и рассказывает, подходит MC-ось (стр. 144, 148).","why":"Оси IEC устроены иначе, чем оси для детей постарше. Сенсорная обработка и отношения влияют на формирующуюся личность, но напрямую на PC-ось не переносятся (стр. 22–23)."}},"child":{"tasks":["Готовность к школе: внимание, удержание последовательности инструкций, длительное усилие (стр. 226). Исполнительные функции дают гибкость в трудностях (стр. 218–219).","Символическая функция: играть, рисовать, сочинять, рассказывать о себе и о том, чего сейчас нет перед глазами (стр. 226).","Теория психического и зачатки рефлексивной функции. Дружба без помощи взрослых, умение чинить ссоры (стр. 227).","Начатки морали: правила игры, вина за обман, способность прощать себя и других (стр. 228).","Пережить события-вехи: рождение сиблинга, начало школы, новые когнитивные и социальные задачи, телесное созревание, переезды, утраты близких и питомцев (стр. 214)."],"levelsText":"Главное правило: уровни описывают *текущее* функционирование. Черты раннего и среднего детства не обязательно предсказывают будущие расстройства (стр. 213). Термины уровней — общие рамки психодинамической традиции, а не ярлыки (стр. 225). Сначала оценивается MC-ось (стр. 215).","levelsTable":{"h":["Уровень","Я и самооценка","Регуляция","Отношения и доверие","Защиты (id)","Реальность, игра, школа","Специалист рядом","Стр."],"r":[["**Здоровый**","Цельный, реалистично позитивный образ себя; критика его не обрушивает","Расстроившись, быстро утешается взрослым; восстанавливается и может подумать о случившемся","Дружит сам, видит в людях и хорошее, и плохое; чинит разрывы","affiliation, altruism, selfobs, sublimation, humor","Отличает фантазию от реальности; творческая игра; готов к школе","Лёгкость, партнёрство","225–228"],["**Невротический** (лёгкая дисфункция)","Устойчив, но излишне самосознателен; самооценка падает в оценке, соревновании и на переходах","Срывается, но при чутком обращении возвращает контроль","Есть друзья; мешают стыд и страх близости; ревность к сиблингам, излишняя зависимость от родителей; под стрессом доверие искажается","repression, displacement, undoing, intellectualization","Реальность сохранна, кроме сильного стресса; ритуалы и тревога снижают внимание; мораль жёсткая","Альянс складывается, работать приятно, чувство эффективности","228–231"],["**Пограничный** (умеренная)","Фрагментирован; образы себя и других скачут между полюсами; самооценка нестабильна","Трудно успокоить: истерики и рыдания долго длятся, несмотря на утешение; телесные регрессии, возможно самоповреждение","Видит людей «только хорошими / только плохими»; эмпатия то есть, то нет; то подозрительность, то некритичное доверие; часто травма и дезорганизованная привязанность","actingout, passiveagg, splitting, projid","Под стрессом краткие разрывы с реальностью, восстанавливается с помощью; игра «понарошку» страдает","«Американские горки», чувство некомпетентности","232–235"],["**Психотический** (тяжёлая)","Нет ясного чувства себя и границы «я — другой»; знает, что он «другой», но не понимает почему","Легко дезорганизуется, и помощь взрослых не возвращает равновесие","Мало интереса к отношениям; боится предательства и унижения; сверстники считают «странным» и травят","delproj, psydenial, distortion, apwithdraw","Повторяющиеся неисправимые разрывы с реальностью, возможны бред и галлюцинации; игра странная, граница с реальностью теряется","Невозможно уловить логику; ощущение ужаса; но ребёнок может прийти за помощью","235–238"]]},"setText":"Паттерны используются как помощь в узнавании, а не как категории. Ребёнок может не походить ни на один, умеренно походить на несколько или точно совпадать с одним (стр. 238). ◆ Шкала соответствия для PC: «нет / умеренное / близкое» (по стр. 238), а не 1–5.\n\n#### pc_high · Высокофункциональный (Emerging high-functioning) — стр. 238–239\n- **Описание:** Энергичный, ответственный, творческий ребёнок с ясными внутренними правилами, хорошей регуляцией, вниманием и речью. Чувства соразмерны ситуации; умеет и соревноваться, и дружить на равных.\n- **Признаки:** в школе охотно берёт трудное, конкурирует без распада, шутит к месту; дома, когда обижен, позволяет родителям себя утешить.\n- **Непрерывность и риск:** если возникает клиническая проблема, при адекватной поддержке обычно справляется (стр. 239). О взрослых исходах в PDM-3 не сказано.\n- **Что помогает:** поддержка при серьёзных стрессах и травмах (стр. 239). ◆ Не делать «сильного» ребёнка опорой для взрослых.\n- **Связь со взрослой картой ◆:** маркер здорового уровня, а не стиль.\n\n#### pc_inhib · Тормозимый / замкнутый (Emerging inhibited/withdrawn) — стр. 239–240\n- **Описание:** Всё организовано вокруг страха критики, неодобрения, отвержения и разлуки. Ребёнок стыдлив, пассивен, сомневается в себе, мало радуется и с трудом выражает несогласие и злость.\n- **Признаки:** в школе молчит, избегает новых занятий, болезненно реагирует на замечания; учителя часто не видят проблемы. Дома цепляется за родителя, боится расставаний, в дружбе ищет безусловного принятия.\n- **Непрерывность и риск:** может сочетаться с депрессией, тревогой, социальным торможением, низкой самооценкой (стр. 240). О взрослом исходе в PDM-3 не сказано. ◆ Возможные траектории — anxav, depend.\n- **Что помогает:** в PDM-3 не описано. ◆ Постепенная поддержка самостоятельности и самоутверждения. Работа с родителями: в семейном фоне часто доминирующие, вторгающиеся взрослые, для которых взросление ребёнка — «предательство» (стр. 240).\n- **Связь ◆:** anxav, depend.\n\n#### pc_depr · Депрессивный (Emerging depressive) — стр. 240–241\n- **Описание:** В центре — вина и самокритика, тогда как у тормозимого — страх. Ребёнок объясняет беды собственной «плохостью», и это парадоксально даёт ему чувство контроля.\n- **Признаки:** в школе боится насмешки, не берётся за задание сам, жалуется на тело, пропускает «по болезни», старается быть «хорошим». Под стрессом теряет уже освоенные навыки. Дома остро реагирует на утраты и отвержение и винит себя.\n- **Непрерывность и риск:** гомотипическая непрерывность, может продолжаться в подростковом и взрослом возрасте (стр. 241). При сопутствующей дисрегуляции функционирование ниже (стр. 241).\n- **Что помогает:** помочь проявить спрятанные негативные чувства, включая обычную критику в адрес специалиста. Помочь понять, что «я плохой» защищает от другой правды: жизнь не всегда под контролем (стр. 240).\n- **Связь ◆:** dep_r.\n\n#### pc_obs · Обсессивный (Emerging obsessive) — стр. 241–242\n- **Описание:** Чрезмерное внимание к деталям, правилам, порядку и чистоте, руминации не по возрасту. Злость под запретом; агрессия выходит косвенно; ребёнок колеблется между зависимостью и показной независимостью.\n- **Признаки:** в школе вежлив и ответственен, его хвалят, но ритуалы и перфекционизм съедают время; друзей мало. Дома упрямится, боится грязи, не может выбросить ненужное.\n- **Непрерывность и риск:** черты обычно сохраняются во взрослости (гомотипическая непрерывность); компульсивной части в детстве может не быть (стр. 242). Континуум от адаптивной старательности до утраты контроля над тревогой (стр. 242).\n- **Что помогает:** в PDM-3 не описано. ◆ Не подкреплять «идеальность»; давать опыт допустимой ошибки и безопасного выражения злости.\n- **Защиты:** isolation, compartmentalization, intellectualization (стр. 242). **Связь ◆:** obs.\n\n#### pc_dysreg · Дисрегулированный (Emerging dysregulated) — стр. 242–243\n- **Описание:** Внезапные интенсивные смены настроения, импульсивность, гнев, нестабильный образ себя и примитивные защиты. Отношения бурные, но поверхностные, с отчаянными попытками избежать покинутости.\n- **Признаки:** в школе функционирование может быть сильно нарушено, есть проблемы внимания и памяти. Дома театральные вспышки, контроль и манипуляции, чуткость к невысказанному настроению взрослых, проблемы сна и еды.\n- **Непрерывность и риск:** именно эмоциональная дисрегуляция, а не импульсивность, — сильный предиктор пограничных симптомов во взрослости (стр. 242). Часто дезорганизованная привязанность и травма (стр. 242–243).\n- **Что помогает:** в PC прямо не описано. ◆ Устойчивая ко-регуляция; работа с родителями над теплом, отзывчивостью и последовательностью (общий принцип главы, стр. 217).\n- **Связь ◆:** dysreg.\n\n#### pc_impuls · Импульсивный (Emerging impulsive) — стр. 243–244\n- **Описание:** Действует без оглядки на последствия, использует других; переживает в основном гнев, а не печаль; опирается на расщепление и обесценивание. За «избалованностью» обычно прячутся низкая самооценка и избегание стыда.\n- **Признаки:** в школе — борьба за власть со взрослыми, нарушение правил, ложь, мало друзей. Дома родители истощены и боятся его поведения. Две подгруппы: с чёрствостью и безэмоциональностью (CU-черты) и без них (стр. 243).\n- **Непрерывность и риск:** на дезадаптивном полюсе — риск криминальности (стр. 243). Отвержение сверстниками связано с последующей агрессией и делинквентностью (стр. 244). Расстройства поведения с CU-чертами считаются предшественником психопатии (стр. 470).\n- **Что помогает:** ясные границы плюс эмпатический отклик, помощь в регуляции аффекта и сдерживании поведения; связать самооценку с самоконтролем (стр. 244).\n- **Связь ◆:** psychop, narc (в главе отдельно описаны нарциссические проблемы, стр. 243).\n\n#### pc_susp · Подозрительный (Emerging suspicious) — стр. 244–245\n- **Описание:** Ждёт злого умысла; ревнив, злопамятен, остро чувствителен к стыду и унижению. Внутри два образа: идеальное «я» и преследующие другие.\n- **Признаки:** в школе заранее нападает или избегает, не делится ни вещами, ни чувствами. Дома не принимает зависимость, «слишком самостоятелен» для возраста, юмора мало.\n- **Непрерывность и риск:** по клиническому опыту, взрослые с параноидным РЛ в детстве часто имели этот паттерн; исследований мало (стр. 244).\n- **Что помогает:** в PDM-3 не описано. ◆ Прозрачность, предсказуемость, защита от травли, никаких насмешек. Фон: унижения, дразнилки, травля, садистичные взрослые (стр. 245).\n- **Связь ◆:** para.\n\n#### pc_schiz · Шизоидный (Emerging schizoid) — стр. 245–246\n- **Описание:** Своеобразные мысли и поведение. Чувства либо узкие, либо такие сильные, что ребёнок уходит «внутрь». Хроническая дилемма: близость переполняет, а в фантазиях живёт идеальная близость.\n- **Признаки:** в школе сверстники его игнорируют, речь размыта, магическое мышление, неуспеваемость. Дома ритуалы вокруг сна, еды и туалета, моторная неловкость, иногда поздно пошёл или заговорил.\n- **Непрерывность и риск:** паттерн неоднороден. Часть детей улучшается, у части появляются шизотипические или психотические симптомы; возможна генетическая связь с шизофренией (стр. 246).\n- **Что помогает:** в PDM-3 не описано. ◆ Уважение дистанции, контакт через интересы, бережное «приглашение».\n- **Связь ◆:** schiz. ◆ Отличать от РАС по критерию из PA: при РАС социальные сигналы не считываются, при шизоидности считываются, но отношения отвергаются (стр. 491).","setTable":null,"traps":["«Тихий значит в порядке». Замкнутость не выглядит опасной, поэтому учителя часто не тревожатся (стр. 240).","«Отличник значит здоров». Школа поощряет обсессивные черты: аккуратность, точность, самоконтроль (стр. 241).","Принимать нейрокогнитивные трудности за характер. Трудности регуляции внимания и сенсорики делают ребёнка внешне оппозиционным, зависимым или замкнутым (стр. 219). В лечение импульсивных детей часто приводят именно с поведенческими и исполнительными дефицитами (стр. 243).","Не учитывать культуру и контекст. Культурная предвзятость патологизирует норму или скрывает проблему (стр. 221). Замкнутость или раздражительность больного ребёнка может быть адаптивной (стр. 222). У приёмного ребёнка реакцию на утрату трудно отличить от давнего паттерна (стр. 223)."],"sub":null},"teen":{"tasks":["Три большие задачи: принять гормональные и телесные изменения; начать переносить привязанность из семьи на других; научиться реалистично оценивать опыт внутри усложняющегося «я» (стр. 471).","Кризис идентичности — норма, связанная с отделением от семьи и сексуальностью (стр. 469).","«Вторая индивидуация»: ранние трудности могут проявиться только сейчас (стр. 476, 511).","Сексуальная и гендерная идентичность становится отчётливее (стр. 472–473).","К концу периода — способность откладывать удовольствие, инсайт, более устойчивая идентичность и эмоциональная стабильность (стр. 473)."],"levelsText":"Критерии: интеграция идентичности или её диффузия, примитивные или зрелые защиты, тестирование реальности, качество объектных отношений и 13 способностей MA-оси (стр. 479). 13-летний и 19-летний — очень разные пациенты (стр. 471).\nВажно: диффузия идентичности *нормативно* нарастает в подростковом возрасте и идёт параллельно пограничным чертам (стр. 480, сноска 4).","levelsTable":{"h":["Уровень","Как выглядит у подростка (своими словами)","Возрастные маркеры ◆","Стр."],"r":[["**Здоровый**","Связная организация; с темпераментом справляется в возрастных отношениях; «я» всё более организовано; эмпатичен и добросовестен","Ссоры с родителями есть, но отношения восстанавливаются; есть друзья и свои интересы","480"],["**Невротический** (лёгкая)","Меньше связности; отношения в семье и со сверстниками напряжённее; чувство себя и реальности связное; защиты умеренно ригидны","Экзаменационная тревога, стыд за тело, «застревания»; рефлексия сохранна","480"],["**Пограничный** (умеренная)","Уязвимы тестирование реальности и чувство себя; защиты искажают реальность; ментализация низкая: свои чувства видятся в других, чужие намерения считываются неверно","Самоповреждение после отвержения, хаотичная дружба, «я не знаю, кто я» без ощущения кризиса","480"],["**Психотический** (тяжёлая)","Значительные дефициты тестирования реальности и чувства себя; трудно отделить свои чувства и желания от чужих","Отличать от продрома психоза: насколько мышление не поддаётся проверке (стр. 505)","481"]]},"setText":"(спектры: интернализирующий, экстернализирующий, эмоционально дисрегулированный и отдельно обсессивный, стр. 481–482). Шкала соответствия 1–5 (рамки 8.1–8.13). Кодов нет (стр. 482).","setTable":{"h":["id","Название в PA","Стр.","Чем отличается от взрослой карточки"],"r":[["dep_r","Формирующиеся депрессивные","482–485","Депрессивные периоды обостряются на новых возрастных задачах. Анаклитический и интроективный варианты, как у взрослых. Отличать от уязвимого нарциссизма: там сильнее искажены «я» и другие"],["hypom","Формирующиеся гипоманиакальные","485–487","**Отдельный раздел** (у взрослых — внутри депрессивных). Обычно пограничный уровень, пересекается с dysreg. Повышен риск биполярных, депрессивных и психотических расстройств и злоупотребления веществами"],["anxav","Тревожно-избегающие и фобические","487–489","Подчёркнуты темпераментные предшественники: застенчивость, «медленно разогревающийся» ребёнок; тревожные родители"],["cphob","Контрфобические","489–490","**Отдельный раздел.** Мягкая контрфобия для подростка нормальна. Стиль — когда риск чрезмерный и не терпится никакая уязвимость (опасное вождение, вещества, рискованный секс)"],["schiz","Шизоидные","490–493","Отличать от РАС: при шизоидности сигналы считываются, но отношения отвергаются. Ближе к психотическому уровню — шизотипические черты и риск психоза"],["somat","Соматизирующие","493–494","Меняющееся тело становится центром аффективных и отношенческих конфликтов"],["depend","Зависимые и зависимо-виктимные","494–497","Диапазон до пограничного и психотического уровня: токсичные и абьюзивные отношения. **Сюда вошла «отношенческая мазохистичность»** (стр. 495)"],["obs","Обсессивно-компульсивные","497–498","Давление учёбы и выбора будущего: паралич из-за поиска «идеального» решения"],["psychop","**Антисоциально-психопатические**","498–501","Другое название. DSM переоценивает внешние поступки; одного «плохого поведения» мало, ключ — неспособность к привязанности. Подтипы пассивно-паразитический и агрессивный. **Садизм — при тяжёлых вариантах** (стр. 499)"],["narc","Нарциссические","501–504","Грандиозный, уязвимый и высокофункциональный варианты. Подростковый возраст критичен для нарциссизма; соцсети могут усиливать"],["para","Параноидные","504–507","В детстве редки, у подростков чаще, нередко на фоне антисоциальных или пограничных черт. Отличать от продрома психоза; в анамнезе часто травля"],["hyst","**Истерические и импульсивно-истероидные**","507–510","Разделение: истерические — скорее невротический уровень, импульсивно-истероидные — пограничный. Пик импульсивности, незрелость префронтальной коры. Демонстративность ограничена сферой сексуальности и гендера, в отличие от нарциссизма"],["dysreg","Эмоционально дисрегулированные","510–512","Описывается как пограничный уровень; путаница в теле, ценностях, ориентации; реактивация сепарации-индивидуации"],["masoch","—","—","**Отдельной карточки в PA нет.** Ближайшее — зависимо-виктимные (стр. 495). ◆ В UI показать серой с пояснением"],["sadist","—","—","**Отдельной карточки в PA нет.** Садизм упомянут при тяжёлых антисоциально-психопатических (стр. 499). ◆ Серая карточка"]]},"traps":["Норма или стиль. Склонность к риску, поиску новизны и острых ощущений есть примерно у половины подростков (стр. 472). Мягкая контрфобия нормативна (стр. 489).","Кризис идентичности или диффузия. Кризис — нормальная задача, диффузия (неинтегрированные образы себя и других) — признак патологии (стр. 469).","«Подростки все нестабильны, не будем ставить диагноз». Миф о нестабильности личности подростков эмпирически не подтверждён. Отказ от диагноза ради защиты от стигмы может сговориться с этой стигмой и упустить раннее вмешательство (стр. 469–470).","Прочие подмены: шизоидность против РАС (стр. 491); параноидность против продрома психоза (стр. 505); «плохое поведение» против психопатии (стр. 500). Временное охлаждение отношений в семье может быть новой волной неуверенности, а не ухудшением (стр. 473)."],"sub":{"h":["Подфаза","Что характерно","Стр."],"r":[["12–14 ранняя","Половое созревание, тревога «нормальный ли я», внимание к настоящему, а не к будущему; под стрессом возврат к детскому поведению; проверка правил","472"],["15–16 средняя","Рост саморефлексии и морального мышления, пик конфликтов с родителями и влияния сверстников; поиск острых ощущений и риск","472–473"],["17–19 поздняя","Откладывание удовольствия, инсайт, более устойчивая идентичность; часть задач уходит в начало 20-х","473"]]}},"emerg":{"tasks":["Постепенно консолидировать идентичность (стр. 645).","Построить более устойчивые и надёжные близкие отношения вне семьи (стр. 645).","Достичь психологической и социально-экономической независимости. Три признака взрослости: ответственность за себя, самостоятельные решения, экономическая автономия (стр. 645–646).","Пройти этап поиска (по Арнетту): исследование идентичности, нестабильность, фокус на себе, ощущение «между», оптимизм (стр. 646)."],"levelsText":"Используется взрослая шкала (PDC-3, 1–10). Если психологическое созревание запаздывает, лучше взять PDC-3-A (стр. 647). Психопатология может закрепляться через гомотипическую или гетеротипическую непрерывность с детством и подростковым возрастом (стр. 646).\n◆ Маркер здорового и невротического уровня — нестабильность выборов при сохранной рефлексии и связных образах себя и других. Маркер пограничного уровня — диффузия идентичности и хаотичные отношения. Распространённость РЛ в переходе около 20%, особенно часто пограничные диагнозы (стр. 647).","levelsTable":null,"setText":"Взрослые 15 карточек. ◆ При выборе PDC-3-A переключать набор на PA (13 + 2 серые). Период «культурно сконструирован», его признаки не универсальны (стр. 645).","setTable":null,"traps":["Принимать нормальную нестабильность за патологию: смена работ, городов и партнёров здесь типична (стр. 646).","Обратная ошибка — списывать всё на «возраст поиска»: РЛ около 20%, депрессия 4%, тревожные расстройства 4,7% (стр. 647).","Механически применять возрастную рамку: психологически человек может ещё быть подростком или уже взрослым (стр. 9, 647)."],"sub":null},"adult":{"tasks":["PDM-3 исходит из того, что к взрослости личность стабилизировалась и требует первичного клинического фокуса (стр. 10).","◆ Удерживать близость и работу, авторство собственной жизни. В просмотренных главах задачи взрослости не перечислены; Эриксон помещает «интимность против изоляции» в 20–30 лет (стр. 645)."],"levelsText":"Без изменений: шкала PDC-3 1–10 и текущий массив LEVELS. Стиль может существовать на любом уровне (стр. 652). «Пограничный» — только уровень; соответствующая личность называется «эмоционально дисрегулированной» (стр. 12, 655).","levelsTable":null,"setText":"15 карточек (13 стилей P-оси плюс hypom и cphob). Шкала соответствия 1–5.","setTable":null,"traps":["Начинать со способностей M-оси: у взрослых первым оценивается P (стр. 10, 1024).","Называть стиль «пограничным»: в PDM-3 это уровень (стр. 12).","Игнорировать ранние возрастные изменения: признаки старения бывают уже в 50 лет, например ранняя болезнь Альцгеймера (стр. 899)."],"sub":null},"older":{"tasks":["Адаптация к старению. Она становится важнее «личностных тенденций», поэтому M-ось оценивается первой (стр. 10).","Целостность против отчаяния (Эриксон): мудрость, стойкость, целостность как добродетели возраста (стр. 927). Экзистенциальная зрелость (стр. 900).","Переработка утрат, смены жилья, осознания ограниченного времени, снижения телесных и когнитивных ресурсов (стр. 914).","Перестройка близких отношений при нарастающей зависимости. Меняется сексуальность (стр. 912).","Старение — не только потери: растут удовлетворённость жизнью и способность находить смысл; мозг сохраняет пластичность (стр. 901)."],"levelsText":"Уровни взрослой P-оси применимы (стр. 929), но с тремя поправками:\n1. **Сдвиги в обе стороны.** Старение может ухудшить уровень организации, но и смягчить субъективную боль и симптомы. Возможность выйти из социальных, профессиональных и интимных обязательств некоторым помогает адаптироваться лучше. Чаще всего изменения привязаны к уровню, типичному для человека в зрелости (стр. 929).\n2. **Гетеротипическая непрерывность.** Ядро патологии стабильно, а поведенческое выражение меняется. Одни черты после пенсии или утраты партнёра заостряются, другие ослабевают (стр. 927). РЛ может впервые проявиться в старости (стр. 927).\n3. **Защиты.** Гибкость снижается, растёт опора на привычные и более «дорогие» защиты. Утраты и болезни могут запускать расщепление. В благоприятных условиях защитное функционирование и рефлексия, наоборот, повышаются (стр. 913–914).\nТенденции по кластерам DSM: A (para, schiz) может усиливаться; B (прежде всего пограничное) обычно ослабевает; C (anxav, depend, obs) с возрастом утяжеляется (стр. 928).","levelsTable":{"h":["Уровень","Возрастные маркеры ◆ (с опорой на MOA и POA)","Стр."],"r":[["Здоровый","Знает о возрастных трудностях и отвечает на них без «дорогих» защит; принимает помощь соразмерно, сохраняет круг значимых связей","914, 940–941"],["Невротический","Под возрастными угрозами ригиднее: контроль, изоляция аффекта; тревога о здоровье соразмерна, но «застревает»","913, 936"],["Пограничный","При угрозе и тревоге — отрицание, крайняя идеализация или обесценивание себя и других, расщепление; хуже замечает реальность","914"],["Психотический","Переполнен тревогой из-за болезни; расщепление переходит в бредовую проекцию","914"]]},"setText":"Взрослый список применяется полностью; POA описывает его параллельно P-оси (стр. 928). Для каждой карточки в UI — блок «Возрастная поправка»:","setTable":{"h":["id","Возрастная поправка и ловушка","Стр."],"r":[["dep_r","Не путать с большой депрессией и депрессией при деменции. Сужение круга общения не равно депрессии. Ушедший супруг мог компенсировать черты. Пенсия — частый пусковой фактор. Связь с суицидальными мыслями","929–931"],["hypom","Субклинические кратковременные эпизоды «самоотпущения». Не путать с биполярным и нейрокогнитивным расстройствами","931"],["masoch","Встречается реже: меньше арен (работа, романы). В учреждениях жалобы раздражают персонал, и реальные трудности недооценивают","931–932"],["depend","Функциональная зависимость — нормальная потребность. Регрессия под стрессом не равна стилю. Зависимость, «индуцированная» учреждением. Синдром Диогена при пассивно-агрессивной окраске; контрзависимые отказываются от помощи","932–934"],["anxav","Естественное сужение связей, осторожность ради здоровья, избегание новых технологий, стыд за сенсорные потери — не РЛ","935"],["cphob","Отдельного описания в POA нет. ◆ Ближайшая аналогия — контрзависимый отказ от помощи (стр. 934)","—"],["obs","Стереотип «старики ригидны». Повторяющиеся действия в незнакомой среде. Бережливость поколения кризиса — не скупость. Черты с возрастом растут; связь с нейрокогнитивными нарушениями и болезнью Паркинсона","936–937"],["schiz","Сужение связей ради эмоциональной выгоды; сенсорные потери. Ключ — пожизненная тема «близость — дистанция»","938–939"],["somat","Много хронических болезней. Мерило — соразмерность запросов о помощи","940–941"],["hyst","Сильная зависимость от культуры. Временная регрессия и жалобы в норме быстро проходят","942–943"],["narc","Гордость возрастом, памятью, силой — не РЛ, если раньше этого не было. Потребность в подтверждении ценности реалистично растёт","944"],["para","Недоверие часто следует из сенсорных и когнитивных потерь. Проверить жестокое обращение","946"],["psychop","Встречается реже. Свобода от чужого мнения и фокус на себе — не психопатия. Импульсивность и агрессия бывают при ранней деменции","947"],["sadist","Данных почти нет. Эпизоды унижения других при вынужденной зависимости в учреждении, если раньше такого не было, кратковременны","948"],["dysreg","Меньше самоповреждений и бурных отношений; черты слабее, поэтому диагностика труднее","949"]]},"traps":["Нормативное сужение связей или schiz. Мужчина, сокративший контакты из-за усталости, пенсии или вдовства, не обязательно шизоид (стр. 928, 938–939).","Зависимость от ухода или depend. Индуцированная учреждением зависимость не равна стилю; нужен анамнез (стр. 933).","Недоверие из-за сенсорных потерь или реального жестокого обращения не равно параноидному стилю (стр. 946).","Эйджизм самого специалиста: снижение слуха принимают за когнитивный дефицит, депрессию считают «нормой возраста» (стр. 900, 929)."],"sub":null}},"AGE_TABLE":[["0–3","IEC: I основной диагноз; II функциональные эмоциональные способности; III регуляторно-сенсорная обработка; IV отношения; V медицинские диагнозы","Нет. Оцениваются развитие, регуляция и отношения","Своя структура: оси II–V, затем ось I","PDC-3-IEC"],["4–11","MC → PC → SC","Да, как формирующаяся: уровень формирующейся организации и 8 паттернов","M первым","PDC-3-C"],["12–19","MA → PA → SA","Да: «формирующийся стиль» и «формирующееся расстройство»; кодов нет","M первым","PDC-3-A"],["18–25","P / M / S","Да: «стиль», «расстройство»; при поздней зрелости — подростковая логика","PDC-3: P первым; PDC-3-A: M первым ◆","PDC-3 / PDC-3-A"],["Взрослые","P → M → S","Да: 13 стилей P-оси (в атласе 15 карточек); «пограничный» — только уровень","P первым","PDC-3"],["65+","MOA → POA → SOA","Да: те же стили с поправкой на возраст; возможен поздний дебют","M первым","PDC-3-OA"]],"MCAP":[{"n":1,"id":"attn","name":"Внимание и обучение (исполнительные функции)","short":"Внимание","line":"Удерживать фокус, планировать, учиться на опыте","en":"Capacity for Attention and Learning (Executive Functioning)","domain":"когнитивные и аффективные процессы","pages":"стр. 713–715","what":"Набор «управляющих» навыков: удерживать фокус, отсекать лишнее, планировать шаги, переключаться и учиться на опыте (стр. 713–714). Это единственная способность, где клиническую оценку желательно подкреплять внешними данными: тестами, историей жизни, рассказами близких (стр. 714).","s5":"Человек собран и организован, гибко меняет план и делает выводы из ошибок даже в напряжённой обстановке.","s3":"Работает хорошо, когда задача интересна и вокруг спокойно, но под давлением теряет нить, с трудом переключается и держит фокус недолго.","s1":"Внимание рассыпается или залипает на угрозе, планировать и учиться на опыте почти не получается, речь может быть бедной или странной.","stress":"По PDM-3, эта способность меняется вместе с текущим состоянием (тревога, страх, стыд, гнев), а также от болезни, усталости и лекарств (стр. 714). На уровне 3 под стрессом наступает заметный спад (стр. 714–715). На уровне 1 внимание не может оторваться от угрозы (стр. 715). **Чувствительность: высокая (w = 0.75).** ◆ Способность напрямую зависит от телесного ресурса: сон, болезнь и вещества бьют по ней раньше, чем проявляется характер.","w":0.75,"wave":1,"rec":"fast","styles":"anxav — руминации, сужение внимания на опасности (Box 12.3, стр. 678) ◆; dysreg — ранняя травма повреждает исполнительный контроль (стр. 696); hyst — импрессионистичный стиль мышления, уход от деталей (стр. 686) ◆; schiz в дефицитарном варианте нуждается в укреплении исполнительных функций (стр. 683). У obs способность сохранна, но ригидна: человек «тонет в деталях» (стр. 680) ◆.","age":"*Дети:* внимание оценивают вместе с сенсорной модуляцией, речью и моторикой. На уровне 3 ребёнок учится только при подходящей стимуляции и интересе (стр. 160–161). *Подростки:* «холодные» исполнительные функции созревают раньше «горячих», а префронтальная кора дозревает примерно к 25 годам. Отсюда разрыв: «понимаю риск» — «делаю под давлением сверстников» (стр. 415). *Пожилые (70+):* трудности с новым и снижение гибкости нормативны; их важно отличать от нейрокогнитивного расстройства (стр. 906).","signs":["теряет нить, как только разговор становится напряжённым;","перечитывает одно и то же и не может решить, с чего начать;","повторяет одни и те же ошибки без выводов."],"tools":"Нейропсихологические тесты, например WAIS (стр. 714). Для пожилых — MMSE, MoCA, FAB (стр. 907–908), для подростков — BRIEF, CEFI, WISC-IV (стр. 448–449).","quiz":{"q":"После двух бессонных ночей перед сдачей бюджета финансовый аналитик трижды открывает один и тот же файл, не может выбрать, с чего начать, и пропускает ошибку в формуле, которую обычно замечает сразу. Настроение ровное, ни с кем не конфликтует».","a":1,"o":[2,8,10],"why":"страдают фокус, планирование и отсев лишнего, а аффект и поведение в норме. Усталость PDM-3 прямо называет причиной спада (стр. 714)."}},{"n":2,"id":"affect","name":"Регуляция и выражение аффекта","short":"Аффект","line":"Узнавать, выдерживать и соразмерно выражать чувства","en":"Capacity for Affect Regulation and Expression","domain":"когнитивные и аффективные процессы","pages":"стр. 715–716","what":"Умение узнавать свои чувства, выдерживать их, менять их силу и выражать соразмерно ситуации и культуре (стр. 715). Через понятие «ментализированной аффективности» эта способность смыкается с ментализацией (стр. 716).","s5":"Различает широкий спектр чувств, включая тонкие и смешанные, переносит болезненные, выражает их соразмерно и точно считывает чужие сигналы даже в стрессе.","s3":"Диапазон чувств сужен: гнев, стыд, зависть или вину человек плохо замечает, либо они прорываются несоразмерно, а в сильном волнении он перестаёт видеть, что чувствуют другие.","s1":"Эмоции либо хаотичны и захлёстывают, либо почт
