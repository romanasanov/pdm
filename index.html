*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh) + 12px);-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:var(--bnh)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(22px,3vw,32px)}
h2{font-size:clamp(18px,2.2vw,23px)}
h3{font-size:16px}
p{margin:0}
ul,ol{margin:0;padding-left:20px}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
@media (max-width:599px){.pad{padding:14px}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:599px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hide-touch{}
body.touch .hide-touch{display:none}
body:not(.touch) .only-touch{display:none}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn .k{font-family:var(--f-mono);font-size:12px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.dchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;border:1px solid color-mix(in srgb,var(--gc) 50%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--surface));color:var(--ink);border-radius:999px;padding:3px 11px 3px 4px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:100%}
.dchip .rn{flex:none;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:var(--gc);color:var(--on-c);font-family:var(--f-mono);font-size:11px;font-weight:700;padding:0 5px}
.dchip.x .rn{background:var(--surface3);color:var(--muted)}
.dchip.dim{opacity:.3}
.dchip.hit{box-shadow:0 0 0 2px var(--accent)}
.dchip span.t{overflow:hidden;text-overflow:ellipsis}
.mono-badge{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--spc,var(--accent)) 14%,var(--surface));color:var(--spc,var(--accent));border:1px solid color-mix(in srgb,var(--spc,var(--accent)) 35%,var(--line));font-size:12px;font-weight:700;font-family:var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;color:var(--on-c);background:var(--c,var(--accent));white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:1px 7px;color:var(--muted);background:var(--surface2);white-space:nowrap}
.tag.c{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.seg{display:inline-flex;flex-wrap:nowrap;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;min-height:36px;padding:6px 14px;font-size:13.5px;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dia{all:unset;cursor:pointer;color:var(--faint);font-size:.85em;padding:0 2px;border-radius:4px}
.dia:hover,.dia:focus-visible{color:var(--accent)}
.pg{font-family:var(--f-mono);font-size:.78em;color:var(--faint);white-space:nowrap}
.term{all:unset;cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 70%,transparent);color:inherit}
.term:hover,.term:focus-visible{color:var(--accent)}
.more{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--accent);padding:8px 0;min-height:32px}
.more:hover{text-decoration:underline;text-underline-offset:3px}
.lvdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:9px;min-height:60px}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand .bt{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:14.5px;white-space:nowrap;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--muted);white-space:nowrap}
.brand .sect{display:none}
.navrow{border-top:1px solid var(--line)}
.tnav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.tnav::-webkit-scrollbar{display:none}
.tnav a{display:flex;align-items:center;gap:7px;min-height:38px;text-decoration:none;color:var(--muted);font-weight:650;font-size:13.5px;padding:6px 12px;border-radius:10px;white-space:nowrap;flex:none}
.tnav a i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tnav a:hover{color:var(--ink);background:var(--surface2)}
.tnav a[aria-current="page"]{color:var(--ink);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
.tnav a[aria-current="page"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tnav a.help{margin-left:auto}
.hctl{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.agechip{display:inline-flex;align-items:center;gap:6px;min-height:38px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.agechip b{font-weight:700}
.agechip .car{color:var(--muted);font-size:11px}
.agechip.on{border-color:var(--accent);background:var(--accent-soft)}
.depth{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.depth button{border:0;background:none;border-radius:999px;min-height:32px;padding:4px 11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.depth button i{display:inline-flex;gap:2px}
.depth button i b{width:3px;height:9px;border-radius:2px;background:currentColor;opacity:.35}
.depth button i b.on{opacity:1}
.depth button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.iconbtn.depthbtn{display:none}
.ring{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;min-height:38px}
.ring svg{display:block;flex:none}
.ring .t{font-size:12px;line-height:1.15;white-space:nowrap}
.ring .t b{font-family:var(--f-mono);font-size:12.5px}
.ring .t small{display:block;color:var(--muted);font-size:11px}
.ring .t .of2{display:none}
.iconbtn{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);flex:none}
.iconbtn:hover{border-color:var(--ink)}
@media (max-width:1279px){.tnav a{padding:6px 9px;font-size:13px}}
@media (max-width:1023px){
  .navrow{display:none}
  .ring .t small{display:none}
  .brand small,.brand .full{display:none}
  .brand .sect{display:block;overflow:hidden;text-overflow:ellipsis}
  .brand{flex:1 1 auto}
  .ring .t .lab,.ring .t .of1{display:none}
  .ring .t .of2{display:inline}
}
@media (max-width:599px){
  .top-in{gap:8px;padding-block:7px;min-height:54px}
  .brand .bt{display:none}
  .depth{display:none}
  .iconbtn.depthbtn{display:grid}
  .agechip{padding:4px 10px;font-size:12.5px}
  .agechip .lb{display:none}
  .ring{padding:3px 9px 3px 3px}
  .ring .t .lab,.ring .t .of1{display:none}
  .ring .t .of2{display:inline}
}
@media (max-width:359px){.agechip b{max-width:80px;overflow:hidden;text-overflow:ellipsis}}

/* age band */
.ageband{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:25;background:color-mix(in srgb,var(--accent-soft) 92%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));font-size:13px}
.ageband .wrap{display:flex;align-items:center;gap:8px 12px;padding-block:7px;flex-wrap:wrap}
.ageband b{font-weight:700}
.ageband .sep{color:var(--faint)}
.ageband button{all:unset;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
@media (max-width:599px){.ageband{font-size:12.5px}.ageband .abopt{display:none}}

/* bottom nav */
.bnav{display:none}
@media (max-width:1023px){
  :root{--bnh:calc(64px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:12px;font-size:11.5px;font-weight:650;color:var(--muted);text-align:center}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav button[aria-current="page"] svg{filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--accent) 45%,transparent))}
}
@media (min-width:600px) and (max-width:1023px){.bnav button{font-size:13px;flex-direction:row;gap:8px}}

/* ---------- main ---------- */
main{min-height:60vh}
main .wrap{padding-block:22px 40px}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:599px){main .wrap{padding-block:14px 28px}.view{gap:16px}}
.vhead{display:flex;flex-direction:column;gap:8px;max-width:80ch}
.vhead .lead{color:var(--muted);font-size:15.5px}
.todo{display:inline-flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:12px;padding:8px 12px;align-self:flex-start}
.todo i{font-style:normal;color:var(--accent);font-weight:800}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.foot{border-top:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:12.5px}
.foot .wrap{padding-block:16px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.nextmod{display:flex;justify-content:flex-end}
.nextmod .btn{min-height:46px;padding-inline:18px}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);background:var(--surface2);border:1px solid var(--line);font-size:14px}
.callout.acc{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.callout.warn{background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.callout .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:800;font-family:var(--f-mono);font-size:13px;color:var(--accent)}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;min-height:48px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold>.fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.kv dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14.5px}
dl{margin:0;display:flex;flex-direction:column;gap:12px}
.quote{border-left:3px solid var(--c,var(--accent));padding:8px 12px;background:var(--surface2);border-radius:0 10px 10px 0;font-size:15px}
.blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.blk>h4,.h4{margin:0;font-size:11.5px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
ul.marks{padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t thead th{background:var(--surface2);font-weight:700;font-size:12.5px;position:sticky;top:0}
table.t tr:last-child td{border-bottom:0}
.md p+p{margin-top:8px}
.md ul{display:flex;flex-direction:column;gap:4px}

/* ---------- start ---------- */
.hero{display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:clamp(24px,4vw,40px)}
.hero p{color:var(--muted);font-size:15.5px;max-width:68ch}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1023px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:118px;overflow:hidden;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--mc)}
.mode .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 14%,var(--surface));color:var(--mc)}
.mode b{font-family:var(--f-display);font-size:15px;line-height:1.2}
.mode span{font-size:13px;color:var(--muted);line-height:1.35}
.mode::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 16%,transparent),transparent 70%)}
@media (max-width:599px){.modes{gap:8px}.mode{padding:12px;min-height:104px;gap:4px}.mode .ico{width:32px;height:32px;border-radius:10px}.mode b{font-size:14px}.mode span{font-size:12.5px}}
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 16px;align-items:center;padding:16px}
.player .badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--f-display);font-weight:700;font-size:20px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.player .rk{display:flex;flex-direction:column;gap:4px;min-width:0}
.player .rk b{font-family:var(--f-display);font-size:16px}
.xpbar{height:8px;border-radius:8px;background:var(--surface3);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.streak{display:flex;flex-direction:column;align-items:center;gap:0;font-size:11.5px;color:var(--muted);text-align:center}
.streak b{font-family:var(--f-display);font-size:22px;color:var(--warn);line-height:1.1}
.quests{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:767px){.quests{grid-template-columns:minmax(0,1fr)}}
.quest{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;min-width:0}
.quest .qr{flex:none;width:30px;height:30px}
.quest.done{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.quest span{min-width:0}
.quest small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.agerow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.agepick{flex:none;all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:120px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.agepick b{font-family:var(--f-display);font-size:14px}
.agepick small{font-size:12px;color:var(--muted)}
.agepick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.modmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1023px){.modmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.mod:hover{border-color:var(--accent)}
.mod .mr{grid-row:1 / span 2;position:relative;width:46px;height:46px}
.mod .mr svg{position:absolute;inset:0}
.mod .mr em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:700;font-size:14px}
.mod b{font-size:14.5px;line-height:1.2}
.mod small{font-size:12px;color:var(--muted)}
.mod .st{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.st.s0{color:var(--faint)}.st.s1{color:var(--warn)}.st.s2{color:var(--good)}
.medals{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.medal{width:10px;height:10px;border-radius:50%;background:var(--surface3);border:1px solid var(--line2)}
.medal.b{background:var(--bronze);border-color:var(--bronze)}.medal.s{background:var(--silver);border-color:var(--silver)}.medal.g{background:var(--gold);border-color:var(--gold)}

/* ---------- levels ---------- */
.lvcol{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1023px){.lvcol{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.lvcol{grid-template-columns:minmax(0,1fr);gap:8px}}

<script>
const DATA={"AGES":[{"id":"iec","n":"0–3","name":"Младенцы и малыши","full":"0–3 года","order":"оси IEC","orderLong":"Оси IEC: сначала все оси II–V, потом основной диагноз оси I","pdc":"PDC-3-IEC","pers":"личность не оценивается","line":"Развитие, регуляция и отношения. Оси личности нет.","what":"оси IEC I–V","assess":"развитие, регуляцию, отношения"},{"id":"child","n":"4–11","name":"Дети","full":"4–11 лет","order":"сначала M","orderLong":"Сначала способности (MC), потом формирующаяся личность (PC)","pdc":"PDC-3-C","pers":"формирующиеся паттерны","line":"Формирующаяся организация и 8 паттернов, без слова «расстройство».","what":"MC → PC → SC","assess":"способности, затем формирующуюся организацию"},{"id":"teen","n":"12–19","name":"Подростки","full":"12–19 лет","order":"сначала M","orderLong":"Сначала способности (MA), потом формирующийся стиль (PA)","pdc":"PDC-3-A","pers":"формирующийся стиль","line":"13 подростковых стилей; кризис идентичности — норма.","what":"MA → PA → SA","assess":"способности, затем формирующийся стиль","sub":["12–14 ранний","15–16 средний","17–19 поздний"]},{"id":"emerg","n":"18–25","name":"Переход во взрослость","full":"18–25 лет","order":"P первым","orderLong":"С бланком PDC-3 первой идёт P-ось, с PDC-3-A — M-ось ◆","pdc":"PDC-3 / PDC-3-A","pers":"стиль","line":"Взрослые карточки; нестабильность выборов ≠ диффузия.","what":"P / M / S","assess":"как у взрослых, с поправкой на созревание"},{"id":"adult","n":"Взрослые","name":"Взрослые","full":"базовый режим","order":"сначала P","orderLong":"Сначала личность (P), потом способности (M) и симптомы (S)","pdc":"PDC-3","pers":"стиль","line":"Базовый режим: 15 стилей, шкала PDC 1–10.","what":"P → M → S","assess":"уровень и стиль, затем способности"},{"id":"older","n":"65+","name":"Пожилые","full":"65+ (клинически с 55)","order":"сначала M","orderLong":"Сначала способности (MOA): адаптация к старению важнее личностных тенденций","pdc":"PDC-3-OA","pers":"стиль","line":"Те же стили с возрастной поправкой; возможен поздний дебют.","what":"MOA → POA → SOA","assess":"способности и адаптацию, затем стиль","sub":["55–64 «молодые-старые»","65–74 «средние-старые»","75–84 «старые-старые»","85+ «старейшие»"]}],"LEVELS":[{"name":"Здоровый","short":"здоровый","pdc":[9,10],"m":["M1"],"dmrs":"7, иногда 6–5","sim":10,"id":0,"tagline":"Гибкость: стиль есть, но не управляет жизнью.","identity":"Связное, устойчивое и реалистичное чувство себя; противоречивые стороны признаются своими.","objrel":"Близость и автономия совмещаются; другие видятся объёмными и отдельными; отношения взаимные и устойчивые.","defenses":"Преобладают высокоадаптивные (юмор, антиципация, подавление, сублимация, аффилиация), есть и невротические. После стресса возвращается к зрелым защитам (стр. 726).","reality":"Сохранно, в том числе под нагрузкой.","affect":"Широкий диапазон чувств; выдерживает их и выражает соразмерно ситуации; импульсы регулирует гибко.","aggression":"Злость осознаётся и идёт в дело: отстаивание интересов, конкуренция по правилам ◆.","moral":"Внутренние, гибкие ценности; вина соразмерна поступку ◆.","themes":"Обычные жизненные трудности, кризисы, утраты. Под стрессом возможны симптомы, но устойчивые способности сохраняются (стр. 657).","origins":"Часто сочетает черты нескольких стилей (стр. 657); привязанность чаще надёжная ◆.","observing":"Хорошо видит себя со стороны, интересуется собой.","transfer":"Альянс складывается быстро; перенос легко обсуждается.","counter":"Интерес, лёгкость, ощущение партнёрства.","request":"Развитие, смысл, трудный жизненный этап. Хорошо помогает работа, направленная на понимание себя (стр. 662).","note":"Здоровый уровень — не отсутствие симптомов. Тяжёлая травма может повредить даже устойчивого человека (стр. 657).","markers":["юмор и самоирония","может сказать «я ошибся»","оттенки в оценках людей и событий","быстро восстанавливается"]},{"name":"Невротический","short":"невротический","pdc":[6,8],"m":["M2","M3"],"dmrs":"6–5","sim":7,"id":1,"tagline":"Ригидность в отдельных сферах: конфликт «хочу — нельзя».","identity":"Интегрирована; себя и других описывает объёмно.","objrel":"Отношения устойчивы. Трудности ограничены отдельными сферами (власть, близость, соперничество) и повторяющимися сценариями (стр. 657).","defenses":"Обсессивные и невротические: вытеснение, изоляция аффекта, интеллектуализация, реактивное образование, смещение, аннулирование. Под сильным стрессом — кратко ниже (стр. 658).","reality":"Сохранно.","affect":"В «проблемных» сферах чувства сдерживаются или переполняют; импульсы под контролем, порой с избытком ◆.","aggression":"Злость вызывает вину и запрет; обращается на себя или выражается косвенно ◆.","moral":"Строгая, порой карающая совесть; вина и стыд за желания.","themes":"Внутренний конфликт (стр. 657). У депрессивного стиля — утрата и самонаказание, у истерического — пол и власть, у обсессивно-компульсивного — контроль и авторитет.","origins":"Чаще всего здесь депрессивный, обсессивно-компульсивный, фобический и истерический стили (стр. 657).","observing":"Есть; симптомы переживаются как чуждые («мешает, хочу понять»).","transfer":"Заметен, но его можно обсуждать как «похоже на…». Регрессивные реакции не выходят за пределы сессии (стр. 662).","counter":"Спокойный, сочувственный; ожидание сотрудничества (стр. 658).","request":"Повторяющиеся сценарии, тревога, вина, торможение. Помогает работа на понимание и инсайт (стр. 662).","markers":["многословные «правильные» объяснения","оговорки и забывания","«понимаю, но не могу иначе»","повторяющиеся сценарии"]},{"name":"Пограничный","short":"пограничный","pdc":[3,5],"m":["M4","M5","M6"],"dmrs":"4–1","sim":4,"id":2,"tagline":"Эмоциональная дисрегуляция и диффузия идентичности.","identity":"Диффузная: противоречивые образы себя не сведены воедино; самоощущение «скачет» (стр. 659).","objrel":"Интенсивные и нестабильные; другие то идеальны, то ничтожны; страх и покинутости, и поглощения.","defenses":"Расщепление, проекция с полной уверенностью, проективная идентификация, отрицание, всемогущий контроль, идеализация и обесценивание, отреагирование, тяжёлая диссоциация, соматизация (стр. 658–660). От невротического уровня отличает скорее нехватка зрелых защит под стрессом (стр. 658).","reality":"В целом сохранно, но хрупко: в близких отношениях и под стрессом возникают искажения.","affect":"Крайние, быстро меняющиеся аффекты — ярость, отчаяние, паника; трудности с импульсами, зависимости, самоповреждения (стр. 658).","aggression":"Плохо интегрирована: вспышки, атаки, обращение против себя ◆.","moral":"Нестабильная, ситуативная ◆.","themes":"Дистресс обычно запускает угроза или разрыв важной привязанности (стр. 658).","origins":"Привязанность ненадёжная. Наследственность объясняет около 40% различий в тяжести пограничных черт (стр. 656). Сложная травма может «встраиваться» в личность (стр. 655).","observing":"Ограничено; проблемы чаще кажутся внешними («дело в них»).","transfer":"Интенсивный, переживается как реальность (стр. 663).","counter":"Сильный и меняющийся: страх, растерянность, беспомощность, желание наказать или спасти; давление «сделать что-то» (стр. 660).","request":"Кризисы, импульсивность, пустота. Помогает (стр. 658, 662–664):\n• ясная рамка;\n• активный, «живой» специалист;\n• работа «здесь и сейчас»;\n• длительная терапия.\nНа высоком пограничном уровне больше исследования, на низком — больше поддержки и наращивания способностей.","note":"При тяжести, достаточной для DSM-диагноза расстройства личности, человек, как правило, функционирует на этом уровне (стр. 658). Не путать уровень со стилем: у эмоционально дисрегулированного стиля всегда пограничный уровень, но не у всех на пограничном уровне этот стиль (стр. 696).","sub":"Высокий пограничный (PDC ≈ 5, ближе к неврозу): больше исследования и интерпретаций, рефлексия доступна. Низкий пограничный (PDC ≈ 3, ближе к психозу): больше поддержки, рамки и наращивания способностей (стр. 658).","markers":["чёрно-белые оценки","резкие развороты в отношении к людям","действие вместо слов","собеседника «втягивают» в роль"]},{"name":"Психотический","short":"психотический","pdc":[1,2],"m":["M7"],"dmrs":"0","sim":2,"id":3,"tagline":"Вопрос не «чего я хочу», а «существую ли я».","identity":"Глубоко нарушена; плохо различаются представления о себе и других (стр. 660).","objrel":"Слияние или отгороженность; доверие даётся с огромным трудом.","defenses":"Психотическое отрицание, аутистический уход, искажение, бредовая проекция, фрагментация, конкретизация (стр. 660).","reality":"Выраженные нарушения. Непоколебимая уверенность в своих атрибуциях; в компенсации может годами быть внешне сохранно (стр. 660).","affect":"Тревога уничтожения, ужас распада; аффект бедный или несоответствующий ◆.","aggression":"Переживается как разрушительная и проецируется вовне ◆.","moral":"Жёсткие конкретные правила или их распад ◆.","themes":"Безопасность, выживание, страх уничтожения или поглощения.","origins":"Уязвимость часто имеет наследственный компонент (стр. 656) ◆.","observing":"Очень ограничено, особенно в обострении.","transfer":"Слияние; специалист может стать частью внутренней картины.","counter":"Глубокое сочувствие; ощущение то всемогущества, то полного бессилия; иногда страх.","request":"Часто обращается окружение. Помогает (стр. 664–665):\n• уважительный, разговорный, «живой» специалист;\n• прямые ответы и конкретные советы;\n• опора на сильные стороны;\n• при необходимости — психиатр.","note":"Уровень — не то же самое, что психоз прямо сейчас. Примеры психотического уровня без диагноза психоза (стр. 661):\n• анорексия на грани истощения;\n• крайние компульсии и патологическое накопительство;\n• соматизация, при которой тело переживается как преследователь;\n• тяжёлые параноидные реакции.","markers":["странности речи и логики","конкретность","сверхценные убеждения, не поддающиеся проверке","утрата общей реальности"]}],"CRIT":[["identity","Идентичность",1,"core"],["objrel","Объектные отношения",1,"core"],["defenses","Уровень защит (DMRS)",1,"core"],["reality","Тестирование реальности",1,"core"],["affect","Аффект и импульсы",2,"reg"],["aggression","Агрессия",2,"reg"],["moral","Ценности и мораль",2,"reg"],["themes","Характерные тревоги и темы",2,"ctx"],["observing","Самонаблюдение",2,"ctx"],["origins","Привязанность и происхождение",3,"ctx"],["transfer","Перенос",3,"clin"],["counter","Контрперенос",3,"clin"],["request","С чем приходят и что помогает",3,"clin"]],"CRIT_GROUPS":{"core":"Ядро PDC-3","reg":"Регуляция","ctx":"Контекст","clin":"Клиника"},"LV_WARN":["Под достаточной нагрузкой или травмой любой может выглядеть пограничным или даже психотическим (стр. 654).","Прежде чем говорить об уровне или стиле, исключите другие объяснения: ситуационный стресс (пример PDM-3 — мигрант в чужой языковой среде), культурные различия, органические причины, нейроотличия, психотический спектр (стр. 654, 661–662).","Между уровнями нет чётких границ (стр. 661, 1026).","Исторически уровень связывали с фиксацией на стадии развития. PDM-3 считает такой взгляд малоупотребимым: уровень объясняют сочетанием наследственности, темперамента, раннего опыта и привязанности (стр. 656)."],"DEF":{"sublimation":{"n":"Сублимация","s":"Импульс получает социально ценную форму.","p":"от напряжения влечений, которые нельзя выразить прямо","e":"Злость на несправедливость стала адвокатской практикой.","w":"Соперничество направлено в продукт и результат, а не на коллег.","mw":"mature","lv":"7","under":"displacement"},"humor":{"n":"Юмор","s":"Видит смешное в трудном, не отрицая боли.","p":"от непереносимой серьёзности боли и страха","e":"«Ну что ж, теперь у меня есть отличная история для мемуаров».","w":"Разряжает напряжение на совещании, не обесценивая проблему.","mw":"mature","lv":"7","under":"isolation"},"altruism":{"n":"Альтруизм","s":"Забота о других приносит удовлетворение и не требует жертвовать собой.","p":"от собственной беспомощности и тревоги","e":"Пережив банкротство, бесплатно консультирует начинающих предпринимателей.","w":"Наставничество и поддержка новичков.","mw":"mature","lv":"7","under":"reaction"},"anticipation":{"n":"Антиципация","s":"Заранее проживает трудное и готовится к нему.","p":"от внезапности и паники","e":"Перед встречей с инвестором проговорил худшие вопросы и свою реакцию на них.","w":"Сценарии рисков, план Б.","mw":"mature","lv":"7","under":"isolation"},"suppression":{"n":"Подавление","s":"Сознательно откладывает переживание до подходящего момента.","p":"от перегрузки в неподходящий момент","e":"«Сейчас переговоры. Расстроюсь вечером».","w":"Сохраняет фокус в кризисе и возвращается к чувствам позже.","mw":"mature","lv":"7","under":"repression"},"affiliation":{"n":"Аффилиация","s":"Обращается за поддержкой, не перекладывая ответственность.","p":"от одиночества с проблемой","e":"Позвонил другу и прямо сказал, как ему страшно.","w":"Открыто просит совета у коллег и супервизора.","mw":"mature","lv":"7","under":"idealization"},"repression":{"n":"Вытеснение","s":"Неприемлемое желание или воспоминание удерживается вне сознания.","p":"от тревоги и вины, связанных с желанием или воспоминанием","e":"Не может вспомнить имя человека, который его когда-то унизил.","w":"«Забывает» о неприятной задаче или договорённости.","mw":"higher","lv":"5a","under":"dissociation"},"regression":{"n":"Регрессия","s":"Возврат к более ранним, детским способам реагирования.","p":"от тревоги взрослой ответственности","e":"Заболев, взрослый мужчина капризничает и требует ухода, как маленький.","w":"Под давлением сотрудник ждёт, что руководитель «всё решит».","mw":"higher","lv":"x","note":"Не ступень шкалы. В атласе показана механикой симулятора: снижением функционирования под нагрузкой.","under":"actingout"},"isolation":{"n":"Изоляция аффекта","s":"Событие помнится, чувство к нему отделено.","p":"от силы чувства","e":"Ровным голосом: «Отец умер, когда мне было двенадцать. Что ещё?»","w":"Сообщает об увольнениях как о «техническом вопросе».","mw":"higher","lv":"6","under":"denial"},"intellectualization":{"n":"Интеллектуализация","s":"О чувствах говорят на языке понятий.","p":"от эмоциональной уязвимости","e":"Вместо горя — рассуждения о стадиях проживания утраты.","w":"Разговор о конфликте уходит в модели и фреймворки.","mw":"higher","lv":"6","under":"rationalization"},"rationalization":{"n":"Рационализация","s":"Находится приемлемое объяснение вместо настоящего мотива.","p":"от стыда и разочарования","e":"«Не взяли — и хорошо, там всё равно платят мало».","w":"Провал проекта объясняют «рынком», а не своими решениями.","mw":"higher","lv":"3","note":"В DMRS — ступень 3 «отказ»: неприятное удобно объясняется.","under":"denial"},"moralization":{"n":"Морализация","s":"Желания и поступки переводятся в категории долга и правильности.","p":"от вины и сомнений","e":"«Я обязан был так поступить, это вопрос принципа» — о выгодном ему решении.","w":"Жёсткие решения подаются как «принципиальная позиция».","mw":"higher","lv":"x"},"compartmentalization":{"n":"Раздельное мышление","s":"Противоречивые установки сосуществуют, не сталкиваясь.","p":"от внутреннего противоречия","e":"Искренне религиозен и спокойно обманывает партнёров.","w":"Декларируемые ценности компании и реальные практики живут параллельно.","mw":"higher","lv":"x"},"undoing":{"n":"Аннулирование","s":"Действие символически «отменяет» чувство или поступок.","p":"от вины за агрессию","e":"После ссоры — цветы и поведение, будто ничего не было.","w":"После жёсткого разноса — внезапная премия всему отделу.","mw":"higher","lv":"6","under":"omnipotent"},"turning":{"n":"Обращение против себя","s":"Агрессия к другому направляется на себя.","p":"от страха потерять отношения из-за своей злости","e":"«Это я виновата, что он на меня накричал».","w":"После несправедливой критики винит себя и перерабатывает.","mw":"higher","lv":"x","under":"devalself"},"displacement":{"n":"Смещение","s":"Чувство переадресовано более безопасному объекту.","p":"от опасности прямого конфликта","e":"Получив разнос от начальника, срывается на стажёре или
