,["devalself","splitself","idealization"],["distortion","apwithdraw"]],"teen":"«формирующаяся депрессивная личность» не равна хронической клинической депрессии; уступчивость, непрямой протест, реактивное образование, идеализация других и обесценивание себя (стр. 483). Интроективные похожи на нарциссических, анаклитические — на зависимых; зависимые открыто ищут поддержки, анаклитически-депрессивные прячут тоску по близости (стр. 483–484). Интроективным больше помогают интерпретации, анаклитическим — поддержка (стр. 485); гипоманиакальный — отдельный стиль (стр. 485).","teenP":"PA, стр. 482–485","older":"не путать с большой депрессией и депрессией при деменции; депрессию у пожилых ошибочно считают «нормой» (стр. 929). Пенсия, смерть супруга, отъезд детей снимают компенсацию, и черты проступают ярче (стр. 929–930); самоупрёки звучат как сожаления о прошлом, растёт суицидальный риск (стр. 930–931). Интроективным тяжелее спад возможностей, анаклитическим — потери (стр. 930).","olderP":"POA, стр. 929–931","cross":{"dsm":"отдельного расстройства личности нет; дифференцировать с персистирующим депрессивным и большим депрессивным расстройством (это расстройства настроения) / AMPD — депрессивность, ангедония (Отстранённость), тревожность (Негативная аффективность) / ICD-11 — домен «Негативная аффективность» (6D11.0); дистимическое расстройство (6A72) как дифференциальный диагноз","ampd":"депрессивность, ангедония (Отстранённость), тревожность (Негативная аффективность) / ICD-11 — домен «Негативная аффективность» (6D11.0); дистимическое расстройство (6A72) как дифференциальный диагноз","icd":"домен «Негативная аффективность» (6D11.0); дистимическое расстройство (6A72) как дифференциальный диагноз"},"crossTxt":"DSM-5-TR — отдельного расстройства личности нет; дифференцировать с персистирующим депрессивным и большим депрессивным расстройством (это расстройства настроения) / AMPD — депрессивность, ангедония (Отстранённость), тревожность (Негативная аффективность) / ICD-11 — домен «Негативная аффективность» (6D11.0); дистимическое расстройство (6A72) как дифференциальный диагноз","quiz":[{"q":"Руководитель проекта после провального запуска, в котором прежде всего виноват заказчик, неделю пишет «разбор моих ошибок», отказывается от бонуса и не может сформулировать ни одной претензии к заказчику; так было и после прошлых неудач","a":"dep_r","sub":"","o":["masoch","obs","depend"],"why":"Агрессия обращена на себя и не осознаётся; нет демонстрации страдания ради правоты или связи (masoch), борьбы за контроль и правила (obs), поиска опоры в сильном другом (depend)."},{"q":"Сильный методолог годами работал в паре с наставником. После ухода наставника из компании — апатия, пустота и «смысл пропал», хотя работа формально идёт; новые предложения встречает мыслью «без него это уже не то»","a":"dep_r","sub":"анаклитический","o":["depend","hypom","schiz"],"why":"Утрата переживается как безвозвратная потеря и пустота; зависимый искал бы нового покровителя и советов (стр. 484), гипоманиакальный ушёл бы в бурную активность, шизоидный держал бы дистанцию ещё до утраты."}],"mv":{"p":[6,11,13],"s":[2]},"pa":{"n":"Формирующиеся депрессивные","pg":"482–485","d":"Депрессивные периоды обостряются на новых возрастных задачах. Анаклитический и интроективный варианты, как у взрослых. Отличать от уязвимого нарциссизма: там сильнее искажены «я» и другие"},"oa":{"d":"Не путать с большой депрессией и депрессией при деменции. Сужение круга общения не равно депрессии. Ушедший супруг мог компенсировать черты. Пенсия — частый пусковой фактор. Связь с суицидальными мыслями","pg":"929–931"}},{"id":"hypom","n":"Гипоманиакальный","full":"Гипоманиакальный","en":"Hypomanic","m":"Гм","sp":"int","typ":[2,2,3,2],"line":"Энергия и движение вместо печали и утраты","subl":"подтип депрессивного в PDC-3","theme":"Бегство от печали в движение: энергия и оптимизм не оставляют места горю и зависимости (стр. 669).","affects":"Лёгкий подъём, азарт, мало вины; под ними — депрессивные темы и неосознаваемый ужас покинутости (стр. 670). У подростков — раздражительность и перепады настроения (стр. 485).","relations":"Обаяние и остроумие при поверхностных связях; уходит, как только появляется чувство зависимости, — бросает, чтобы не быть брошенным (стр. 670).","self":"Завышенная самооценка, «всё получится» (стр. 670); под ней — хрупкость и страх распада (стр. 485).","counter":"Сначала увлечённость; затем растерянность, перевозбуждение, ощущение, что тебя «развлекают», и дистанция (стр. 670).","org":"Генераторы идей, «запускальщики», звёзды переговоров и корпоративов; много стартов, мало завершений ◆. Внезапные уходы из проектов и компаний, риск алкоголя и рискованных решений (стр. 670 ◆).","help":"Бережно показывать защитную функцию активности — сколько сил уходит на то, чтобы не грустить; заранее договариваться о том, как будет завершаться работа, если он решит резко уйти (стр. 670). При признаках биполярности — к психиатру: без медикаментов интерпретации мало что дают (стр. 670).","avoid":"Подхватывать его подъём и «развлекаться» вместе с ним (стр. 670). Форсировать горевание на низких уровнях — риск бегства или срыва (стр. 487); принимать «характер» за биполярное расстройство или наоборот без оценки (стр. 670).","proto":"Энергичный, оптимистичный, остроумный человек с приподнятым настроением, завышенной самооценкой и заметно малым чувством вины. Его подвижность — защита от подлежащих депрессивных тем: печали, утраты, беспомощности. Связей много, но они неглубоки; когда возникает привязанность и зависимость, он уходит первым.","basis":"клиническое описание — у взрослых текст без рамки (стр. 669–670), у подростков клинически выведенное описание (Box 8.2, стр. 486). Прототипа SWAP нет.","typicalTxt":"здоровый — встречается (гипоманиакальные защиты могут быть очень адаптивными, стр. 670 ◆); невротический — встречается ◆; пограничный — типично (у подростков обычно пограничный уровень и большое пересечение с дисрегулированным стилем, стр. 485); психотический — встречается (при утрате возможен психотический срыв, стр. 485). Оговорка: та же картина может отражать биполярный диатез, а не стиль личности — возможны оба варианта, нужна тщательная оценка (стр. 670).","mvulnTxt":"2 — не выдерживает печаль и боль (стр. 485, 670); 7 — поверхностные связи, бегство от зависимости (стр. 670); 8 — импульсивность, вещества, гиперсексуальность (стр. 670, 485); 12 — сопротивление исследующей работе (стр. 670).","vulnTxt":"loss — утрата и разлука могут толкнуть к суицидальной попытке или срыву (стр. 485); dependency — бегство из отношений, где возникает зависимость (стр. 670); attach — страх быть покинутым, уходит первым (стр. 670); alcohol — уязвимость к злоупотреблению веществами (стр. 670, 485).","pages":"482, 485–487 (Box 8.2 — 486), 667, 669–670, 930–931, 1025","spectrumTxt":"интернализирующий по месту в классификации (у взрослых — подтип депрессивного, стр. 667, 669; у подростков — в интернализирующем спектре, стр. 482); ◆ внешнее поведение похоже на экстернализирующее","sub":[{"n":null,"d":"нет. Сам является подтипом депрессивного в PDC-3 (стр. 1025) и отдельным стилем в PA-оси (стр. 482, 485)."}],"core":["denial","omnipotent","actingout","reaction"],"lv":[["энергия и юмор","Заряжает команду, быстро восстанавливается после неудач и при этом умеет погрустить ◆."],["бегство в дела","После потерь — всплеск активности и шуток; печаль признаётся, но на неё «нет времени» ◆."],["маниакальная броня","Отрицание боли, всемогущество, рискованные поступки, вещества; резкие разрывы при сближении (стр. 485, 670)."],["срыв брони","При утрате или неудаче — психотический срыв или суицидальная попытка (стр. 485); ◆ грандиозные идеи с утратой критики."]],"bands":[["humor","sublimation"],["reaction","idealself"],["denial","omnipotent","actingout"],["psydenial","distortion"]],"teen":"отдельный стиль. Отрицание пронизывает весь опыт; приподнятость, импульсивность, гиперсексуальность, раздражительность, поверхностная общительность (стр. 485). Обычно пограничный уровень; от дисрегулированных отличаются меньшей диффузией идентичности, агрессией и стыдом; высокий риск биполярного, депрессивного, психотического расстройств и зависимостей (стр. 485). Уходят из терапии, как только связь становится настоящей (стр. 486).","teenP":"PA, стр. 485–487","older":"подклиническая гипомания на фоне «самооправдания»: ускорение, поверхностность, рискованные связи (стр. 930–931). Не путать с нейрокогнитивными нарушениями и с циклами биполярного расстройства; подъёмы короткие и страдания не снимают (стр. 931). Задача — уважать страх депрессивных чувств и одновременно работать с отрицанием и реактивным образованием (стр. 931).","olderP":"POA, стр. 930–931","cross":{"dsm":"расстройства личности нет; дифференцировать с циклотимическим и биполярным II расстройством / AMPD — Расторможенность (импульсивность, рискованное поведение), Антагонизм (грандиозность) / ICD-11 — домен «Расторможенность» (6D11.3); циклотимия (6A62) как дифференциальный диагноз","ampd":"Расторможенность (импульсивность, рискованное поведение), Антагонизм (грандиозность) / ICD-11 — домен «Расторможенность» (6D11.3); циклотимия (6A62) как дифференциальный диагноз","icd":"домен «Расторможенность» (6D11.3); циклотимия (6A62) как дифференциальный диагноз"},"crossTxt":"DSM-5-TR — расстройства личности нет; дифференцировать с циклотимическим и биполярным II расстройством / AMPD — Расторможенность (импульсивность, рискованное поведение), Антагонизм (грандиозность) / ICD-11 — домен «Расторможенность» (6D11.3); циклотимия (6A62) как дифференциальный диагноз","quiz":[{"q":"Через неделю после ухода основателя, своего многолетнего наставника, директор по развитию запускает три новых направления, спит по четыре часа, шутит на всех встречах и говорит, что «грустить некогда». Когда новый CEO предлагает ему стать ближайшим партнёром, он неожиданно объявляет об уходе в стартап","a":"hypom","sub":"","o":["narc","cphob","dysreg"],"why":"Подъём возникает в ответ на утрату и обрывается бегством от новой привязанности (стр. 670); нарциссический искал бы восхищения, контрфобический — опасности как вызова страху, дисрегулированный показал бы бури с яростью и самоповреждением. ◆ Короткий сон без усталости — повод исключить биполярный эпизод."},{"q":"Руководитель отдела продаж — душа компании, но за десять лет сменил семь работодателей и уходит каждый раз, когда «становится слишком по-семейному». На сессиях развлекает коуча историями, на вопрос о разводе отвечает анекдотом","a":"hypom","sub":"","o":["hyst","psychop","dep_r"],"why":"Обаяние и юмор защищают от печали и зависимости; у истерического в центре привлекательность и власть, психопатический использует других, депрессивный переживает печаль открыто."}],"mv":{"p":[2,7,8],"s":[12]},"pa":{"n":"Формирующиеся гипоманиакальные","pg":"485–487","d":"**Отдельный раздел** (у взрослых — внутри депрессивных). Обычно пограничный уровень, пересекается с dysreg. Повышен риск биполярных, депрессивных и психотических расстройств и злоупотребления веществами"},"oa":{"d":"Субклинические кратковременные эпизоды «самоотпущения». Не путать с биполярным и нейрокогнитивным расстройствами","pg":"931"}},{"id":"masoch","n":"Мазохистический","full":"Мазохистический (саморазрушительный)","en":"Masochistic / Self-Defeating","m":"Мз","sp":"int","typ":[2,3,3,2],"line":"Страдание как плата за любовь и правоту","subl":"реляционный, моральный, «право жертвы»","theme":"Страдание как валюта: им платят за привязанность, за моральную правоту или за то, чтобы удар случился «по своему сценарию» (стр. 671–672).","affects":"Неосознаваемые гнев и обида, вина за полученную заботу, праведное негодование; облегчение после саморазрушительного поступка (стр. 671–672).","relations":"Подчинение с невольной провокацией; мученический тон сначала вызывает сочувствие и вину, потом отталкивает (стр. 671). В варианте «права жертвы» — ожидание компенсации и отказ от помощи (стр. 671–672).","self":"«Я хороший, потому что терплю»; «мне должны за то, что я пережил»; «ударю себя сам, пока не ударили меня» (стр. 671–672).","counter":"Сочувствие сменяется раздражением, осуждением и даже желанием наказать; или бессилие спасателя, чьи советы не работают (стр. 671–672).","org":"«Вечно перегруженный»: берёт больше всех, напоминает о жертвах, отвергает помощь и жёстко судит тех, кто «не выкладывается» (стр. 671 ◆). После повышения или публичной похвалы — срыв или конфликт, после которого ему становится легче (стр. 672 ◆).","help":"Тактичная конфронтация с собственным вкладом в повторяющиеся трудности — она пробуждает интерес к смыслу паттерна (стр. 672). Показывать, что внимание не зависит от страданий; помогать отгоревать прошлые несправедливости, удерживая фокус на нынешнем выборе (стр. 672).","avoid":"Открытое сочувствие и щедрость: укрепляют убеждение «страдание — путь к заботе» или провоцируют срыв из вины за незаслуженную заботу (стр. 672). Спасать, а потом наказывать (стр. 672).","proto":"Повторяющееся поведение против собственного благополучия с бессознательной привязанностью к страданию. Страдание выполняет функцию: удерживает отношения, подтверждает моральную ценность или «опережает» ожидаемый удар. За покорностью и жертвенностью — неосознаваемая злость и садистические элементы.","basis":"клиническое описание (прототипа SWAP нет); реляционный вариант опирается на эмпирический прототип зависимо-виктимной личности (Box 12.2, стр. 675; связь — стр. 671). Внешне похож на депрессивный, но динамика и лечение другие (стр. 670).","typicalTxt":"здоровый — встречается (самопожертвование эволюционно адаптивно, стиль — его гипертрофия, стр. 670); невротический — типично ◆; пограничный — типично ◆ (на низких уровнях — проективная идентификация, стр. 671); психотический — встречается ◆ (в PDM-3 не описан)","mvulnTxt":"6 — самооценка привязана к лишениям (стр. 671); 7 — убеждённость, что интерес других держится на страдании (стр. 672); 13 — трудно брать ответственность за нынешний выбор (стр. 672); 2 — неосознаваемая агрессия (стр. 671).","vulnTxt":"success — ожидание нападения за успех (стр. 672); dependency — принятая забота вызывает вину и саморазрушительные срывы (стр. 672); attach — страх потерять отношения перевешивает заботу о своей безопасности (стр. 671).","pages":"482, 495, 670–672, 675 (Box 12.2), 931–932, 1025","spectrumTxt":"интернализирующий (описан в разделе интернализирующих стилей, стр. 670–672; ◆ в перечне спектра на стр. 667 не назван)","sub":[{"n":"реляционный (зависимый вариант)","d":"подчиняет свои нужды другим, лишения — плата за нужную привязанность; под покорностью — пассивно-агрессивная злость, провоцирующая плохое обращение (стр. 671); эмпирически близок к зависимо-виктимному прототипу (стр. 671, 675);"},{"n":"моральный (нарциссический вариант)","d":"страдание равно добродетели; моральное превосходство, мученический тон, скрытая жестокость к тем, кто «недостаточно чист»; часто встречается в помогающих профессиях (стр. 671);"},{"n":"«право жертвы»","d":"вариант морального: мир должен компенсировать страдание, поэтому помощь бессознательно нужно победить (стр. 671–672);"},{"n":"параноидный (ищущий вреда)","d":"ожидает нападения, особенно за успех, и провоцирует его, «чтобы покончить с этим»; после саморазрушительного поступка наступает облегчение (стр. 672)."}],"core":["turning","passiveagg","moralization","hrc","projid"],"lv":[["самоотдача","Готов терпеть ради значимой цели и людей, но умеет остановиться, попросить помощи и принять её ◆."],["взваливает лишнее","Берёт лишнее и жалуется, невольно провоцирует несправедливость к себе; превосходство через терпение (стр. 671)."],["саморазрушение","Отношения с плохим обращением, срывы при успехе; вызывает в других жестокость, которую не признаёт в себе (стр. 671–672)."],["бредовая кара","В PDM-3 не описан; ◆ бредовые идеи наказания и искупления, тяжёлое самоповреждение."]],"bands":[["altruism","suppression"],["turning","moralization","reaction"],["projid","hrc","actingout"],["distortion","delproj"]],"teen":"отдельного мазохистического стиля в PA-оси нет. Черты реляционного мазохизма описаны внутри зависимо-виктимного стиля — убеждение, что любые отношения требуют жертвы и боли (стр. 495).","teenP":"PA, стр. 482, 495","older":"встречается реже: самосаботаж больше проявляется на работе и в романтических отношениях, а с пенсией поводов меньше (стр. 931–932); различать те же варианты (стр. 932). Ловушка: подчёркнутая слабость ради компенсации раздражает персонал, и реальные проблемы списывают на «привлечение внимания» (стр. 932).","olderP":"POA, стр. 931–932","cross":{"dsm":"нет (саморазрушительного расстройства личности в действующих классификациях нет) / AMPD — Негативная аффективность (покорность, враждебность) / ICD-11 — домен «Негативная аффективность» (6D11.0); категориального аналога нет","ampd":"Негативная аффективность (покорность, враждебность) / ICD-11 — домен «Негативная аффективность» (6D11.0); категориального аналога нет","icd":"домен «Негативная аффективность» (6D11.0); категориального аналога нет"},"crossTxt":"DSM-5-TR — нет (саморазрушительного расстройства личности в действующих классификациях нет) / AMPD — Негативная аффективность (покорность, враждебность) / ICD-11 — домен «Негативная аффективность» (6D11.0); категориального аналога нет","quiz":[{"q":"CEO на общем собрании хвалит менеджера проекта и объявляет о её повышении. Через неделю она «забывает» отправить ключевому клиенту договор, получает выговор — и, по словам коллег, впервые за месяц выглядит спокойной","a":"masoch","sub":"ищущий вреда","o":["dep_r","anxav","obs"],"why":"Облегчение после саморазрушительного поступка — маркер этого варианта (стр. 672); депрессивный винил бы себя без провокации, тревожно-избегающий отказался бы от повышения заранее, обсессивный изводил бы себя проверками, чтобы ошибки не случилось."},{"q":"Директор по персоналу берёт на себя все ночные дежурства в кризис, ежедневно напоминает, как мало спит, отказывается от предложенного помощника («справлюсь, как всегда») и публично стыдит тех, кто уходит в 18:00","a":"masoch","sub":"моральный","o":["obs","narc","depend"],"why":"Добродетель через страдание и скрытая жестокость к «нечистым» (стр. 671); обсессивный морализирует о правилах и порядке, нарциссический ищет восхищения не через жертву, зависимый держится за опору, а не за превосходство."}],"mv":{"p":[6,7,13],"s":[11]},"pa":{"n":"—","pg":"—","d":"**Отдельной карточки в PA нет.** Ближайшее — зависимо-виктимные (стр. 495). ◆ В UI показать серой с пояснением"},"oa":{"d":"Встречается реже: меньше арен (работа, романы). В учреждениях жалобы раздражают персонал, и реальные трудности недооценивают","pg":"931–932"}},{"id":"depend","n":"Зависимый","full":"Зависимый и зависимо-виктимный","en":"Dependent / Dependent–Victimized","m":"Зв","sp":"int","typ":[2,3,2,2],"line":"«Со мной всё в порядке, пока в порядке отношения»","subl":"зависимо-виктимный, пассивно-агрессивный, контрзависимый","theme":"Безопасность через другого: «со мной всё в порядке, пока в порядке отношения» (стр. 672–673).","affects":"Тревога за результат, страх критики и покинутости, бессилие; злость почти не признаётся (стр. 673).","relations":"Подчинение, поиск советов и подтверждения «я хороший»; угадывает и обслуживает нужды значимого другого, приносит подарки (стр. 673). Виктимный вариант остаётся в отношениях с плохим обращением (стр. 673).","self":"«Один я не справлюсь»; другие сильнее и компетентнее; наивность (стр. 673).","counter":"Сначала доброжелательность, потом раздражение и ощущение груза; соблазн стать экспертом-советчиком (стр. 673–674). С пассивно-агрессивным вариантом — нетерпение и раздражение (стр. 674).","org":"Лояльный исполнитель, которому трудно решать без руководителя; соглашается на неприемлемое ради одобрения ◆. Пассивно-агрессивный вариант «забывает» и тянет сроки, контрзависимый — «незаменимый», который никогда не просит помощи (стр. 674–675 ◆).","help":"Не брать роль эксперта, поддерживать самостоятельные шаги и выдерживать тревогу, которую они вызывают; приглашать злость и несогласие — путь к авторству и гордости (стр. 674). Пассивно-агрессивному — юмор, обход борьбы за власть, фокус на цене поведения (стр. 674); контрзависимому — терпение к декларациям независимости и нормализация потребностей (стр. 675).","avoid":"Давать советы и решать за него; вместе избегать негативных чувств (стр. 674). С пассивно-агрессивным — показывать сильную заинтересованность в его успехе: он будет её саботировать (стр. 674).","proto":"Благополучие держится на связи с другими в ущерб собственной агентности. Себя переживает слабым и наивным, других — сильными; подчиняется, угождает, ищет советов и одобрения, боится одиночества и не умеет прямо злиться. В виктимном варианте — тяготение к отношениям с плохим обращением и непрямой гнев, провоцирующий агрессию.","basis":"эмпирический прототип SWAP (Box 12.2, зависимо-виктимный, стр. 675); пассивно-агрессивный и контрзависимый — клинические описания (стр. 674–675)","typicalTxt":"встречается на всех уровнях (стр. 673): здоровый — встречается ◆ (здоровая взаимозависимость — середина континуума Борнштейна, стр. 674); невротический — типично (обращаются в середине жизни после утраты, развода, выхода на пенсию, стр. 673); пограничный — встречается (дисрегуляция, когда нужно опираться на себя; соматизация и отреагирование ради заботы, стр. 673); психотический — встречается (стр. 673). Оценивать с учётом культуры и гендерных стереотипов (стр. 673).","mvulnTxt":"13 — агентность, главный дефицит (стр. 672–673); 6 — ощущение никчёмности (стр. 673); 2 — трудно выражать злость и договариваться (стр. 673); 5 ◆ — определяет себя через другого (стр. 672–673).","vulnTxt":"attach — симптомы при неполадках в главной привязанности (стр. 673); alone — дисрегуляция, когда нужно опираться на себя (стр. 673); loss — утрата, развод, пенсия (стр. 673); crit — страх критики (стр. 673).","pages":"484, 494–497 (Box 8.7 — 496), 667, 672–675 (Box 12.2 — 675), 932–935, 1025","spectrumTxt":"интернализирующий (стр. 667)","sub":[{"n":"зависимо-виктимный","d":"эмпирический вариант SWAP: тянется к отношениям, где с ним плохо обращаются, ставит себя под удар; злость выражает пассивно и тем вызывает агрессию других (стр. 673, Box 12.2 — стр. 675);"},{"n":"пассивно-агрессивный","d":"«враждебная зависимость»: определяет себя через противостояние другому, нападает непрямо; порочный круг обиды и ответного плохого обращения (стр. 674);"},{"n":"контрзависимый","d":"псевдонезависимость: зависимые потребности скрыты отрицанием, реактивным образованием и диссоциацией; гордится тем, что на нём всё держится (стр. 674–675)."}],"core":["idealization","devalself","passiveagg","turning"],"lv":[["взаимозависимость","Ценит близость и командную работу, умеет опереться на других и решить сам (стр. 674 ◆)."],["ищет опору","Тревога без опоры, потребность в одобрении; приходит за помощью после развода, утраты, выхода на пенсию (стр. 673)."],["виктимизация","Цепляется за отношения с плохим обращением; непрямой гнев, соматизация и отреагирование как отчаянный призыв к заботе (стр. 673)."],["слияние","В PDM-3 лишь упомянут (стр. 673); ◆ при утрате опоры — распад, переживание себя несуществующим без другого."]],"bands":[["affiliation","altruism"],["regression","turning","idealization"],["passiveagg","somatization","actingout"],["fragmentation","distortion"]],"teen":"постоянный поиск поддержки, трудности выбора, страх автономии (стр. 494). Виктимный вариант — хрупкая идентичность, терпит насилие, «героически» выносит страдание; видны черты реляционного мазохизма (стр. 494–495); ради принятия сверстниками — рискованные поступки, в тяжёлых случаях самоповреждение (стр. 496). От анаклитической депрессии отличается тем, что поддержки ищет открыто (стр. 484).","teenP":"PA, стр. 494–497","older":"главная ловушка — путать стиль с функциональной зависимостью старения, болезни и институционализации; нужна история жизни (стр. 932–933). Тревога разлуки даёт частые звонки и визиты; бывает пассивно-агрессивный тон, отказ от помощи, крайнее самозапущение (синдром Диогена) (стр. 934). Зависимость и контрзависимость могут чередоваться; задача — баланс между откликом на просьбы и сохранением реальной автономии (стр. 934–935).","olderP":"POA, стр. 932–935","cross":{"dsm":"зависимое расстройство личности; пассивно-агрессивного (негативистического) в DSM-5-TR нет / AMPD — Негативная аффективность: покорность, тревога разлуки, тревожность / ICD-11 — «Негативная аффективность» (6D11.0); для контрзависимого варианта — также «Отстранённость» (6D11.1)","ampd":"Негативная аффективность: покорность, тревога разлуки, тревожность / ICD-11 — «Негативная аффективность» (6D11.0); для контрзависимого варианта — также «Отстранённость» (6D11.1)","icd":"«Негативная аффективность» (6D11.0); для контрзависимого варианта — также «Отстранённость» (6D11.1)"},"crossTxt":"DSM-5-TR — зависимое расстройство личности; пассивно-агрессивного (негативистического) в DSM-5-TR нет / AMPD — Негативная аффективность: покорность, тревога разлуки, тревожность / ICD-11 — «Негативная аффективность» (6D11.0); для контрзависимого варианта — также «Отстранённость» (6D11.1)","quiz":[{"q":"Главный бухгалтер двенадцать лет работала с одним финансовым директором. После его ухода она не может утвердить ни одного платежа без нового руководителя, по нескольку раз в день пишет ему «правильно ли я поняла», приносит домашнюю выпечку; соглашается на сверхурочные, а потом «забывает» о сроках","a":"depend","sub":"","o":["dep_r","anxav","masoch"],"why":"Благополучие держится на фигуре руководителя, злость прорывается пассивно (стр. 673–674); анаклитически-депрессивный прятал бы тоску, а не искал советов открыто (стр. 484), тревожно-избегающий избегал бы контакта, мазохистический выставлял бы страдание напоказ."},{"q":"Операционный директор гордится тем, что «на мне всё держится», пять лет не был в отпуске и презирает коллег, которые просят помощи. При этом каждый вечер звонит бывшему наставнику обсудить решения, а дважды в год «срывает спину» и неделями лежит дома под опекой жены","a":"depend","sub":"контрзависимый","o":["schiz","cphob","narc"],"why":"Псевдонезависимость прикрывает скрытую зону зависимости и болезнь как «законный» повод получить заботу (стр. 675); шизоидный держит дистанцию, а не делает себя опорой для всех; контрфобический ищет опасности; нарциссический защищает величие, а не прячет потребность в заботе."}],"mv":{"p":[7,10,13],"s":[2]},"teenN":"Зависимый / зависимо-виктимный","pa":{"n":"Зависимые и зависимо-виктимные","pg":"494–497","d":"Диапазон до пограничного и психотического уровня: токсичные и абьюзивные отношения. **Сюда вошла «отношенческая мазохистичность»** (стр. 495)"},"oa":{"d":"Функциональная зависимость — нормальная потребность. Регрессия под стрессом не равна стилю. Зависимость, «индуцированная» учреждением. Синдром Диогена при пассивно-агрессивной окраске; контрзависимые отказываются от помощи","pg":"932–934"}},{"id":"anxav","n":"Тревожно-избегающий","full":"Тревожно-избегающий и фобический","en":"Anxious–Avoidant / Phobic","m":"Тр","sp":"int","typ":[2,3,3,2],"line":"Жизнь вокруг опасности: главное — избежать угрозы","subl":"тревожный, избегающий, фобический","theme":"Жизнь вокруг опасности: главное — не получить желаемое, а избежать угрозы (стр. 678).","affects":"Хроническая осознаваемая тревога, стыд, смущение (стр. 676, 678). Тревога бывает разной: разлуки, телесного повреждения, моральная, посттравматическая, тревога уничтожения (стр. 676).","relations":"Хочет близости, но боится критики и унижения (стр. 935, 487); с «сильными» покорен и ищет защиты (стр. 677).","self":"Маленький, неадекватный, под угрозой — особенно в одиночестве; чувство неполноценности и нерешительность (стр. 676–677).","counter":"Ответная тревога и импульс «сделать что-нибудь»; родительские чувства, иногда отстранённость (стр. 677). Соблазн спасать (стр. 677).","org":"Внимателен к рискам, надёжен в привычных процессах; избегает выступлений, переговоров и решений «на виду», может отказаться от повышения ◆. Новые роли, реорганизации, оценка незнакомыми людьми — тяжёлое испытание (стр. 678 ◆).","help":"Сохранять уверенность в его способности справляться с тревогой и помогать назвать смутные состояния; на глобальное «всё рухнет» — расспрашивать о деталях: «а что потом?» (стр. 677). При надёжном альянсе — постепенно двигаться к тому, чего он боится; экспозиция и осознанность полезны как дополнение (стр. 677).","avoid":"Спасать, снимать все вызовы, обещать «формулу» без встречи со страхом; торопиться с успокоительными — риск зависимости (стр. 677). Убеждать, что страх «несоразмерен», — растут стыд и тревога (стр. 488–489).","proto":"Хронически тревожный человек, который знает о своей тревоге: защиты её не удерживают. Решения подчинены тому, чтобы избежать опасности, а не тому, чтобы получить желаемое; стыдлив, застенчив, сдержан, держится за рутину и долго колеблется. Тревога уходит и в тело: паника, телесные симптомы, страхи за здоровье.","basis":"эмпирический прототип SWAP (Box 12.3, стр. 678)","typicalTxt":"здоровый — встречается ◆; невротический — типично (фобическая личность — частый стиль невротического уровня, стр. 657; тревожные стили легко узнаются от невротического до пограничного, стр. 676); пограничный — типично (стр. 676); психотический — встречается, но картина сближается с параноидной: ужас требует примитивных экстернализирующих защит (стр. 676). Чем ниже уровень, тем сильнее доминирует тревога уничтожения (стр. 676).","mvulnTxt":"2 — тревогу не удерживают защиты, «аффект-фобия» (стр. 676); 13 — выбор подчинён избеганию, а не желанию (стр. 678); 6 — неполноценность и стыд (стр. 676); 10 — жёсткие рутины, трудная адаптация к новому (стр. 678; у пожилых — стр. 935).","vulnTxt":"novelty — страх смущения и унижения, избегание социальных ситуаций (стр. 678); crit — стыд и страх унижения (стр. 678); alone — в одиночестве чувствует себя маленьким и под угрозой (стр. 677); illness ◆ — ипохондрические опасения (стр. 678).","pages":"482, 487–489 (Box 8.3 — 488), 657, 667, 676–678 (Box 12.3 — 678), 928, 935–936, 1026","spectrumTxt":"интернализирующий (стр. 667)","sub":[{"n":"тревожный","d":"характерологическая «свободно плавающая» тревога без понятного объекта; крайний вариант — «аффект-фобия», страх собственных чувств (стр. 676);"},{"n":"избегающий","d":"социальная тревога, стыд и страх унижения, избегание сужает жизнь (стр. 676; Box 12.3 — стр. 678);"},{"n":"фобический","d":"тревога привязана к конкретным объектам и ситуациям, которых человек избегает; магическое ожидание, что опасность можно обойти (стр. 676–677);"},{"n":"контрфобический","d":"подтип по PDC-3 (стр. 1026), в атласе отдельная карточка `cphob`."}],"core":["displacement","rationalization","withdrawal","somatization"],"lv":[["осторожность","Чуткий, вдумчивый, внимательный к рискам; тревога — сигнал, который он умеет проверить и пережить (стр. 488 ◆)."],["сужающее избегание","Тревога привязана к ситуациям (выступления, полёты, конфликты), которых он избегает и находит этому разумные объяснения; может казаться обсессивным или истерическим (стр. 676, 936)."],["паника и цепляние","Свободно плавающая тревога, паника, телесные симптомы; ищет спасителя и цепляется за него; заметна тревога уничтожения (стр. 676–677)."],["ужас уничтожения","Доминирует тревога уничтожения и распада; защиты становятся экстернализирующими, картина сближается с параноидной (стр. 676)."]],"bands":[["anticipation","affiliation"],["displacement","rationalization","repression"],["idealization","somatization","withdrawal"],["delproj","fragmentation"]],"teen":"межличностная тревога, социальная заторможенность, стыд, сверхчувствительность к оценке; темперамент «медленно разогревающегося», часто тревожные родители (стр. 487). Хотят отношений, но боятся унижения; доминируют тревога уничтожения и разлуки; соматические жалобы, паника, отказ ходить в школу (стр. 487–488). На адаптивном полюсе — чуткие, эмпатичные, творческие (стр. 488); контрфобический — отдельный стиль (стр. 489).","teenP":"PA, стр. 487–489","older":"черты кластера C с возрастом усиливаются (стр. 928). Не путать с естественным сужением круга общения, осторожностью ради здоровья, избеганием новых технологий и стыдом из-за снижения слуха и зрения; отличать от шизоидного стиля и социофобии, уединение может быть выбором (стр. 935). Помогает настойчивость вместе с эмпатией к страхам; возможна избыточная зависимость от врача (стр. 936).","olderP":"POA, стр. 928, 935–936","cross":{"dsm":"избегающее расстройство личности; на уровне симптомов — социальное тревожное расстройство, специфические фобии, ГТР, паническое расстройство / AMPD — избегающее РЛ: Отстранённость (уход, избегание близости, ангедония) и Негативная аффективность (тревожность) / ICD-11 — «Негативная аффективность» и «Отстранённость» (6D11.0, 6D11.1); тревожные и связанные со страхом расстройства (6B0x)","ampd":"избегающее РЛ: Отстранённость (уход, избегание близости, ангедония) и Негативная аффективность (тревожность) / ICD-11 — «Негативная аффективность» и «Отстранённость» (6D11.0, 6D11.1); тревожные и связанные со страхом расстройства (6B0x)","icd":"«Негативная аффективность» и «Отстранённость» (6D11.0, 6D11.1); тревожные и связанные со страхом расстройства (6B0x)"},"crossTxt":"DSM-5-TR — избегающее расстройство личности; на уровне симптомов — социальное тревожное расстройство, специфические фобии, ГТР, паническое расстройство / AMPD — избегающее РЛ: Отстранённость (уход, избегание близости, ангедония) и Негативная аффективность (тревожность) / ICD-11 — «Негативная аффективность» и «Отстранённость» (6D11.0, 6D11.1); тревожные и связанные со страхом расстройства (6B0x)","quiz":[{"q":"Сильный аналитик отказывается возглавить отдел, потому что придётся раз в месяц выступать перед советом директоров. Перед каждой планёркой у неё болит живот, разговоры она часами прокручивает в голове; ей хочется дружить с командой, но на корпоративы она не ходит — «вдруг скажу глупость»","a":"anxav","sub":"","o":["schiz","depend","obs"],"why":"Хочет связи, но боится унижения — в отличие от шизоидного конфликта вокруг самой близости (стр. 935); не цепляется за опору (depend); сомнения связаны со стыдом, а не с борьбой за контроль (obs)."},{"q":"Руководитель логистики выстраивает работу команды так, чтобы ему не летать, объясняя это тем, что «в поезде продуктивнее»; отказывается от международного проекта; на вопрос коуча, что случится, если полететь, отвечает: «Просто не люблю»","a":"anxav","sub":"фобический","o":["cphob","obs","somat"],"why":"Тревога привязана к конкретной ситуации, избегание рационализировано (стр. 676, 936); контрфобический выбрал бы самый рискованный рейс, обсессивный спорил бы о регламентах, у соматизирующего тревога не осознаётся и выражается телом."}],"mv":{"p":[1,2,10],"s":[4]},"pa":{"n":"Тревожно-избегающие и фобические","pg":"487–489","d":"Подчёркнуты темпераментные предшественники: застенчивость, «медленно разогревающийся» ребёнок; тревожные родители"},"oa":{"d":"Естественное сужение связей, осторожность ради здоровья, избегание новых технологий, стыд за сенсорные потери — не РЛ","pg":"935"}},{"id":"cphob","n":"Контрфобический","full":"Контрфобический","en":"Counterphobic","m":"Кф","sp":"int","typ":[2,2,2,1],"line":"Страх побеждают нападением: «смотри, я не боюсь»","subl":"","theme":"Страх побеждают нападением: «я не боюсь — смотри» (стр. 677).","affects":"Отрицаемый страх, азарт, спокойствие перед лицом опасности (стр. 677–678); непереносимость любого ощущения уязвимости (стр. 489).","relations":"Избегает уязвимых шагов, в том числе просьбы о помощи (стр. 677); с помогающим держится отстранённо и пренебрежительно, без зависимости (стр. 489).","self":"Неуязвимый, контролирующий ситуацию; сила и контроль подтверждаются действием (стр. 489).","counter":"Тревога «за него» — специалист носит в себе отщеплённый страх клиента (стр. 678); раздражение от его неуязвимости (стр. 489).","org":"Кризис-менеджеры, «пожарные», добровольцы на самые рискованные проекты и сделки ◆. Спокойны в аврале, но могут втягивать компанию в неоправданный риск и высмеивать осторожность; команда тревожится за них (стр. 678 ◆).","help":"Работать медленно и долго выдерживать браваду, прежде чем подводить к признанию даже обычных человеческих страхов (стр. 678). Быть готовым к депрессивной реакции, когда магические идеи неуязвимости ослабевают (стр. 678).","avoid":"Ранняя лобовая конфронтация, запугивание рисками, нотации ◆ (вывод из стр. 678). Если за бравадой стоит травма — особая осторожность (стр. 490).","proto":"Личность, организованная вокруг защиты от страха: вместо избегания — активный поиск опасности. Риск бодрит, в опасности — пугающее окружающих спокойствие; собственная тревога отрицается и передаётся другим. О помощи просит редко, потому что это уязвимость.","basis":"клиническое описание — у взрослых краткий текст без рамки (стр. 677–678), у подростков клинически выведенное описание (Box 8.4, стр. 490). Прототипа SWAP нет.","typicalTxt":"здоровый — встречается (адаптивный полюс: опасные занятия без полной угрозы безопасности, стр. 489 ◆ для взрослых); невротический — встречается ◆; пограничный — встречается (отреагирование, потенциально смертельное поведение на дезадаптивном полюсе, стр. 489); психотический — нетипично ◆ (в PDM-3 не описано)","mvulnTxt":"2 — страх не перерабатывается, а сразу разряжается действием (стр. 489); 8 — действует, не думая о последствиях (стр. 489); 7 — избегает зависимости и уязвимости (стр. 677, 489); 12 ◆ — защиты от страха мешают исследовать внутреннюю жизнь.","vulnTxt":"helpless ◆ — вынужденная пассивность лишает защиты действием (вывод из стр. 489); dependency — просьба о помощи как уязвимый шаг (стр. 677); trauma — после травматических событий защита даёт трещину, и человек может прийти за помощью (стр. 677).","pages":"482, 489–490 (Box 8.4 — 490), 672, 677–678, 934, 1026","spectrumTxt":"интернализирующий по классификации (у взрослых — подтип тревожно-избегающего, стр. 677, 1026; у подростков — в интернализирующем спектре, стр. 482); ◆ внешнее поведение похоже на экстернализирующее","sub":[{"n":null,"d":"нет"}],"core":["denial","projection","actingout","omnipotent"],"lv":[["смелость","Выбирает рискованные дела осознанно, признаёт страх и действует вопреки ему, не ставя безопасность на карту (стр. 489 ◆)."],["бравада","Демонстративное бесстрашие, ответ на тревогу действием; страх отрицается, но базовая осторожность сохранна ◆."],["игра со смертью","Опасное вождение, вещества, рискованный секс, неоправданный риск в делах; действие разряжает непереносимый страх (стр. 489)."],["не описан","В PDM-3 не описан; ◆ отрицание реальной опасности достигает психотического."]],"bands":[["sublimation","suppression"],["reaction","idealself"],["denial","actingout","omnipotent"],["psydenial"]],"teen":"отдельный стиль. Активно ищет то, чего боится; высокий порог стимуляции — как черта темперамента или ответ на эмоциональную депривацию (стр. 489). Лёгкая контрфобичность для подростка нормативна, при стиле риск чрезмерен и может быть смертельным (стр. 489). С терапевтом — отстранённо-пренебрежительно, у терапевта — тревога и раздражение через проективную идентификацию; лечение трудное, нужна крайняя осторожность, особенно при травматических корнях (стр. 489–490).","teenP":"PA, стр. 489–490","older":"в POA-оси отдельно не описан. ◆ Экстраполяция: отрицание возрастных ограничений и отказ от помощи близки к описанной в POA контрзависимости (стр. 934); повышен риск падений и травм.","olderP":"POA","cross":{"dsm":"нет; дифференцировать с антисоциальным РЛ и расстройствами, связанными с веществами / AMPD — Расторможенность: рискованное поведение (включая отрицание личной опасности) / ICD-11 — «Расторможенность» (6D11.3)","ampd":"Расторможенность: рискованное поведение (включая отрицание личной опасности) / ICD-11 — «Расторможенность» (6D11.3)","icd":"«Расторможенность» (6D11.3)"},"crossTxt":"DSM-5-TR — нет; дифференцировать с антисоциальным РЛ и расстройствами, связанными с веществами / AMPD — Расторможенность: рискованное поведение (включая отрицание личной опасности) / ICD-11 — «Расторможенность» (6D11.3)","quiz":[{"q":"Руководитель антикризисного штаба сам вызывается на каждую опасную площадку, смеётся над техникой безопасности, а после несчастного случая с коллегой говорит: «Со мной такого не будет». Команда постоянно за него тревожится; от коучинга он отказывается: «Мне помощь не нужна»","a":"cphob","sub":"","o":["psychop","hypom","narc"],"why":"Риск — способ отрицать страх, который «переселяется» в окружающих (стр. 678); психопатический использует других, гипоманиакальный бежит от печали, нарциссический — от стыда и за восхищением."},{"q":"Через месяц после серьёзной аварии основатель записывается в автоспорт и запускает самую рискованную продуктовую линию. К консультанту приходит по настоянию партнёра, держится иронично и снисходительно, говорить о страхе отказывается","a":"cphob","sub":"","o":["anxav","masoch","dysreg"],"why":"После травмы — движение навстречу опасности вместо избегания (anxav); мазохистический бессознательно провоцирует удар и испытывает облегчение после него (стр. 672), а контрфобический утверждает власть над страхом; нет аффективных бурь дисрегулированного."}],"mv":{"p":[7,8,12],"s":[2]},"pa":{"n":"Контрфобические","pg":"489–490","d":"**Отдельный раздел.** Мягкая контрфобия для подростка нормальна. Стиль — когда риск чрезмерный и не терпится никакая уязвимость (опасное вождение, вещества, рискованный секс)"},"oa":{"d":"Отдельного описания в POA нет. ◆ Ближайшая аналогия — контрзависимый отказ от помощи (стр. 934)","pg":"—"}},{"id":"obs","n":"Обсессивно-компульсивный","full":"Обсессивно-компульсивный","en":"Obsessive–Compulsive","m":"ОК","sp":"int","typ":[3,3,2,2],"line":"Контроль и правильность: подчиниться или взбунтоваться","subl":"обсессивный и компульсивный полюс","theme":"Контроль и правильность: конфликт «подчиниться или взбунтоваться». Обсессивный думает вместо чувств, компульсивный — делает (стр. 679–680).","affects":"Подавленные гнев и стыд (цена подчинения), тревога и страх наказания (цена бунта); стыд за обычные чувства как за «детские», допустим лишь «праведный» гнев (стр. 679).","relations":"Борьба за власть и правила, часто скрытая: опоздания, «да, но…», перебивание (стр. 680); скупость на время, деньги и тепло (стр. 680).","self":"«Я должен быть рациональным, сильным и безупречным»; совесть жёсткая и карающая (стр. 679).","counter":"Нетерпение и раздражение в скрытой борьбе за власть, скука от интеллектуализации (стр. 680, 498). Соблазн «пробить броню» (стр. 680–681).","org":"Процессы, качество, точность; трудоголизм в ущерб отдыху и отношениям, перфекционизм тормозит решения и согласования (стр. 678–679). С руководством — то подчёркнутая исполнительность, то упрямое сопротивление (стр. 665).","help":"Не обходить защиты, а замечать их «здесь и сейчас» и вызывать интерес к их функции: стену не штурмуют, а изучают — как и почему она строится именно сейчас (стр. 681). Структура и время на решение ◆.","avoid":"Пытаться обойти защиты и выдавить «настоящие» чувства (стр. 680–681). Втягиваться в спор и борьбу за власть (стр. 680).","proto":"Эмоционально сдержанный, подчёркнуто «рациональный» человек, для которого порядок, правила, расписание и работа важнее отдыха и близости. Строго судит себя и других, на вопрос о чувствах отвечает мыслями. Под упорядоченностью — конфликт вокруг гнева, контроля и власти: подчиниться или взбунтоваться.","basis":"эмпирический прототип SWAP (Box 12.4, стр. 680)","typicalTxt":"здоровый — типично; невротический — типично (стиль чаще встречается на здоровом и невротическом уровне, стр. 655; частый невротический стиль, стр. 657); пограничный — встречается (интенсивные симптомы, эго-синтонные страхи, тревога уничтожения с параноидным оттенком, стр. 937); психотический — встречается (крайние компульсии вроде тяжёлого накопительства с тревогой уничтожения при попытке отказаться от ритуала, стр. 661)","mvulnTxt":"2 — эмоциональная сдержанность (стр. 678); 8 — полюс сверхконтроля импульсов (стр. 725); 11 — жёсткие, карающие стандарты (стр. 679); 10 — ригидность, трудная адаптация к переменам (стр. 937–938).","vulnTxt":"chaos — утрата порядка и предсказуемости; у пожилых — новые места и рутины (стр. 938); control — конфликт подчинения и протеста (стр. 679); mistake — жёсткая самокритика (стр. 679); dependency — вынужденная зависимость усиливает контроль над помогающими (стр. 938).","pages":"497–498 (Box 8.8 — 498), 654–655, 657, 661, 665, 667, 678–681 (Box 12.4 — 680), 725, 927, 936–938, 1026","spectrumTxt":"интернализирующий (стр. 667)","sub":[{"n":null,"d":"в PDC-3 нет (стр. 1026). В тексте различаются полюса: обсессивный «живёт в голове», самооценка держится на мышлении; компульсивный «делает и переделывает», самооценка держится на действии (стр. 679–680)."}],"core":["isolation","intellectualization","undoing","reaction"],"lv":[["надёжность","Точный, системный, добросовестный; держит слово и способен к спонтанности и отдыху ◆."],["перфекционизм","Перфекционизм, сомнения, откладывание решений ради идеального; «да, но» и скрытое сопротивление авторитету (стр. 679–680)."],["жёсткий контроль","Жёсткий контроль себя и других, эго-синтонные страхи, тревога уничтожения с подозрительностью; обесценивание помогающих (стр. 937–938)."],["ритуал против распада","Крайние ритуалы и накопительство, отказ от которых вызывает тревогу уничтожения; бредовые страхи, например что обкрадывают (стр. 661, 938)."]],"bands":[["anticipation","sublimation","suppression"],["isolation","intellectualization","undoing"],["omnipotent","devaluation","projection"],["concretization","delproj"]],"teen":"стремление к совершенству и контролю, интеллектуализация, изоляция аффекта, реактивное образование, почтение к авторитетам и жёсткое Сверх-Я (стр. 497). Учебное давление рождает маску «сильного и рационального» и паралич в поиске идеального решения, возможны навязчивости; терапевт видится контролирующим, фокус работы — контакт с чувствами (стр. 497–498).","teenP":"PA, стр. 497–498","older":"самое частое расстройство личности у пожилых (7,6%, стр. 927). Ловушки: стереотип «стариковской ригидности», невидимость рабочего перфекционизма после пенсии, бережливость людей, чьи семьи пережили нужду, — не черта стиля (стр. 937; ◆ в российском контексте — поколения дефицита). С утратой контроля — руминации, накопительство, контроль над опекунами, иногда бредовые страхи; помогает практическая помощь, у ухаживающих высок риск выгорания (стр. 937–938).","olderP":"POA, стр. 927, 936–938","cross":{"dsm":"обсессивно-компульсивное расстройство личности; ОКР — симптоматическое расстройство, которое может быть не связано с личностью (стр. 654) / AMPD — ригидный перфекционизм, персеверация, избегание близости, ограниченная аффективность / ICD-11 — домен «Ананкастия» (6D11.4)","ampd":"ригидный перфекционизм, персеверация, избегание близости, ограниченная аффективность / ICD-11 — домен «Ананкастия» (6D11.4)","icd":"домен «Ананкастия» (6D11.4)"},"crossTxt":"DSM-5-TR — обсессивно-компульсивное расстройство личности; ОКР — симптоматическое расстройство, которое может быть не связано с личностью (стр. 654) / AMPD — ригидный перфекционизм, персеверация, избегание близости, ограниченная аффективность / ICD-11 — домен «Ананкастия» (6D11.4)","quiz":[{"q":"На стратегической сессии финансового директора спрашивают, что он чувствует по поводу сокращения своего отдела. Он отвечает двадцатью слайдами моделей затрат; на встречи с новым CEO стабильно опаздывает на пять минут и каждую реплику начинает с «да, но…»","a":"obs","sub":"","o":["schiz","para","narc"],"why":"Интеллектуализация вместо чувств и скрытое сопротивление авторитету (стр. 679–680); шизоидный ушёл бы в дистанцию, а не в спор, параноидный искал бы угрозу, нарциссический защищал бы самооценку."},{"q":"Менеджер по качеству ночами перепроверяет отчёты и не даёт команде закрыть релиз, пока всё не идеально. Когда руководитель ставит жёсткий срок, она внешне соглашается, а за час до дедлайна присылает сорок замечаний","a":"obs","sub":"компульсивный полюс","o":["anxav","masoch","depend"],"why":"Перфекционизм и конфликт подчинения и протеста (стр. 679–680); тревожно-избегающий избегал бы ситуации из страха унижения, мазохистический добивался бы страдания, у пассивно-агрессивного зависимого в центре враждебная зависимость, а не правильность и контроль."}],"mv":{"p":[2,8,11],"s":[7,12]},"pa":{"n":"Обсессивно-компульсивные","pg":"497–498","d":"Давление учёбы и выбора будущего: паралич из-за поиска «идеального» решения"},"oa":{"d":"Стереотип «старики ригидны». Повторяющиеся действия в незнакомой среде. Бережливость поколения кризиса — не скупость. Черты с возрастом растут; связь с нейрокогнитивными нарушениями и болезнью Паркинсона","pg":"936–937"}},{"id":"schiz","n":"Шизоидный","full":"Шизоидный","en":"Schizoid","m":"Шз","sp":"int","typ":[2,2,3,2],"line":"Дистанция как безопасность: близость переполняет","subl":"конфликтный и дефицитарный","theme":"Дистанция как безопасность: тяга к близости и страх быть поглощённым (стр. 681–682).","affects":"Сильная, порой невыносимая боль за внешней отстранённостью, переполненность стимуляцией; сильные приятные чувства редки (стр. 681–682). В дефицитарном варианте — суженный диапазон эмоций (стр. 682).","relations":"«Одиночка» на дистанции, но за избеганием — тоска по близости и яркие фантазии о ней (стр. 682). Дистанция — способ отрегулировать расстояние, а не непонимание социальных правил (отличие от аутизма, стр. 681).","self":"«Я другой»; в конфликтном варианте — ясное видение своей внутренней жизни, в дефицитарном — трудно связно рассказать о себе (стр. 682).","counter":"Трудно «достучаться», ощущение отвергнутости; или нежность и желание оберегать (стр. 940 ◆). С дефицитарным вариантом — скука (стр. 682); риск видеть в клиенте «интересный экземпляр» (стр. 492).","org":"Глубокие эксперты, исследователи, архитекторы систем; тяжело переносят open space, обязательные тимбилдинги и публичность ◆. Дефицитарный вариант: странности в коммуникации, трудности командной работы, нужны ясные процедуры и поддержка ◆.","help":"Конфликтному — одновременно оставлять возможность близости и уважать потребность в пространстве; говорить через метафоры, искусство, область страстного интереса (стр. 683). Дефицитарному — поддерживающий подход: укреплять исполнительные функции и компенсировать дефициты (стр. 683).","avoid":"Требовать «открыться», навязывать близость и интерпретации — это переживается как вторжение (стр. 492, 940). Принимать дистанцию за отсутствие чувств (стр. 682).","proto":"Конфликтный вариант: близость опасна — может поглотить, вторгнуться, перегрузить, поэтому человек держит дистанцию и уходит в фантазию, втайне тоскуя по близости и чувствуя сильно. Дефицитарный вариант: устойчивая бедность связей, чувств и мышления, странности поведения и речи, конкретность, слабое понимание себя и других. Страдает от ощущения изгойства и бессмысленности.","basis":"эмпирический прототип SWAP для дефицитарного варианта (Box 12.5, стр. 682); конфликтный вариант — клиническое описание психоаналитической традиции (стр. 681–682)","typicalTxt":"здоровый — встречается (конфликтный вариант); невротический — встречается (конфликтный вариант); пограничный — типично («тихий пограничный» — шизоидный человек на пограничном уровне без бурных аффектов, стр. 656; дефицитарный вариант — пограничный и психотический уровни, стр. 683); психотический — встречается (нарушения мышления, персекуторные тревоги, конкретность, стр. 682)","mvulnTxt":"7 — близость переживается как опасность (стр. 681); 5 — у шизоидных недостаточная интеграция собственного опыта при тонком видении других (стр. 721); 3 — в дефицитарном варианте тяжело понимать поведение своё и чужое (стр. 683); 1 — в дефицитарном варианте нужна поддержка исполнительных функций (стр. 683).","vulnTxt":"intrude — поглощение, вторжение, контроль, перегрузка (стр. 681); dependency — у пожилых госпитализация, общие палаты, вынужденная помощь (стр. 940); novelty ◆ — перегрузка в новых социальных ситуациях (вывод из стр. 681).","pages":"490–492 (Box 8.5 — 492), 656, 667, 681–683 (Box 12.5 — 682), 721, 928, 935, 938–940, 1026","spectrumTxt":"интернализирующий (стр. 667)","sub":[{"n":"конфликтный (более высокофункциональный)","d":"внутренний конфликт между тягой к близости и страхом поглощения, вторжения, контроля, перегрузки; уход в уединение или во внутренний мир; богатая внутренняя жизнь и порой поразительная осведомлённость о ней (стр. 681–682);"},{"n":"дефицитарный шизоидно-шизотипический","d":"эмпирический кластер SWAP: обеднённость и странности в отношениях, эмоциях и мышлении; соответствует большинству диагнозов «шизоидное РЛ» по DSM; чем больше шизотипии, тем тяжелее уровень (стр. 681–682)."}],"core":["withdrawal","autfant","intellectualization","isolation"],"lv":[["независимость","Независимый, оригинальный, с богатым внутренним миром и ясным видением себя; ценит уединение, но способен к близости (стр. 682)."],["уход «в голову»","Под давлением дистанцируется и уходит «в голову»; о чувствах говорит через метафору и абстракцию (стр. 683 ◆)."],["тихий пограничный","Отношения почти отсутствуют, фантазия заменяет контакт, внешне спокойно и без бурь (стр. 656); при дефиците — трудно понимать себя и других (стр. 683)."],["разрыв с реальностью","Нарушения мышления, персекуторные тревоги, конкретность (стр. 682); у подростков — риск психоза (стр. 491)."]],"bands":[["sublimation","selfobs"],["intellectualization","isolation"],["withdrawal","autfant","projection"],["apwithdraw","distortion","delproj"]],"teen":"отстранённость и уход в фантазию; в отличие от тревожно-избегающих — мало или нет друзей (стр. 490). Два пути: холодные или подавляюще-вторгающиеся родители (стр. 490–491); континуум от «чудаковатого» до тяжёлого, к психотическому полюсу — шизотипические черты и риск психоза (стр. 491). От аутизма отличает то, что сигналы считываются, но отношения отвергаются по динамическим причинам; сначала поддержка без интерпретаций, тренинг социальных навыков (стр. 491–492).","teenP":"PA, стр. 490–492","older":"возрастное сужение контактов, сенсорные дефициты, вдовство имитируют шизоидность — нужен анализ пожизненной темы «близость—дистанция» (стр. 928, 938–939). Пенсию и утраты переносят легче, но госпитализацию и общие комнаты — тяжелее; возможна уязвимость к позднему психозу (стр. 939–940). Горе может звучать «практично» — это защита; не навязывать близость, оставаться доступным (стр. 940).","olderP":"POA, стр. 928, 938–940","cross":{"dsm":"шизоидное РЛ (в основном дефицитарный вариант, стр. 681), шизотипическое РЛ; дифференцировать с избегающим РЛ и РАС / AMPD — Отстранённость (уход, избегание близости, ограниченная аффективность, ангедония); шизотипическое — Психотизм (эксцентричность, когнитивная и перцептивная дисрегуляция) / ICD-11 — «Отстранённость» (6D11.1); шизотипическое расстройство (6A22) — в спектре шизофрении","ampd":"Отстранённость (уход, избегание близости, ограниченная аффективность, ангедония); шизотипическое — Психотизм (эксцентричность, когнитивная и перцептивная дисрегуляция) / ICD-11 — «Отстранённость» (6D11.1); шизотипическое расстройство (6A22) — в спектре шизофрении","icd":"«Отстранённость» (6D11.1); шизотипическое расстройство (6A22) — в спектре шизофрении"},"crossTxt":"DSM-5-TR — шизоидное РЛ (в основном дефицитарный вариант, стр. 681), шизотипическое РЛ; дифференцировать с избегающим РЛ и РАС / AMPD — Отстранённость (уход, избегание близости, ограниченная аффективность, ангедония); шизотипическое — Психотизм (эксцентричность, когнитивная и перцептивная дисрегуляция) / ICD-11 — «Отстранённость» (6D11.1); шизотипическое расстройство (6A22) — в спектре шизофрении","quiz":[{"q":"Ведущий архитектор данных отказывается руководить командой. На встречах один на один увлечённо рассказывает о средневековой картографии как метафоре своего проекта. После переезда в open space берёт долгий больничный; коллеги считают его холодным, но коучу он признаётся, что очень хочет быть кому-то нужным","a":"schiz","sub":"конфликтный","o":["anxav","obs","narc"],"why":"Близость опасна как вторжение и перегрузка, а не как унижение (anxav); внутренняя жизнь богата, чувства идут через метафору (стр. 682–683); нет борьбы за контроль (obs) и поддержания величия (narc)."},{"q":"Инженер лаборатории пишет отчёты с бесконечными отступлениями, описывает коллег только через их функции и не понимает, почему с ним конфликтуют; ровным голосом говорит, что «всю жизнь чужой», а иногда подозревает в письмах скрытый смысл","a":"schiz","sub":"дефицитарный шизоидно-шизотипический","o":["para","somat","anxav"],"why":"Устойчивая обеднённость связей и странности мышления (стр. 682); подозрительность вторична, а не организует личность (para); нужна поддерживающая структура, а не интерпретации (стр. 683)."}],"mv":{"p":[3,5,7],"k":[12]},"pa":{"n":"Шизоидные","pg":"490–493","d":"Отличать от РАС: при шизоидности сигналы считываются, но отношения отвергаются. Ближе к психотическому уровню — шизотипические черты и риск психоза"},"oa":{"d":"Сужение связей ради эмоциональной выгоды; сенсорные потери. Ключ — пожизненная тема «близость — дистанция»","pg":"938–939"}},{"id":"somat","n":"Соматизирующий","full":"Соматизирующий","en":"Somatizing","m":"Сз","sp":"int","typ":[2,2,3,2],"line":"Тело говорит за душу","subl":"","theme":"Тело говорит за душу: то, что нельзя сказать словами, становится симптомом (стр. 683–684).","affects":"Неоформленные чувства (алекситимия) и невысказанная ненависть после опыта «это всё у вас в голове» (стр. 684); тревога и депрессия выражаются телесно (стр. 941).","relations":"С врачами и помогающими одновременно беспомощен и оппозиционен, чувствует себя неуслышанным (стр. 684). Внутренняя модель: чтобы о тебе заботились, нужно болеть (стр. 684).","self":"Хрупкий, бессильный, «не имею права» (стр. 684).","counter":"Бесполезность, нетерпение, раздражение; скука, внутренняя мертвенность, желание отключиться (стр. 684).","org":"Частые больничные, совпадающие с реорганизациями и конфликтами; о стрессе говорит через симптомы («опять спина»), о чувствах — почти никогда ◆. Окружение перестаёт слушать, ярлык «симулянт» усиливает симптомы (стр. 684 ◆).","help":"Явно признать, что страдание реально, — иначе человек чувствует себя обвинённым в симуляции (стр. 685). Терпеливо и бережно поощрять замечать, называть и принимать чувства; сначала исключить пропущенную соматическую болезнь (стр. 683–685, 942).","avoid":"Говорить «это всё нервы» и торопиться с психологическим объяснением (стр. 684, 493). Отстраняться от постоянных жалоб; ждать прогресса без откатов — при сдвигах человек часто заболевает и отменяет встречи (стр. 685, 942).","proto":"Эмоциональное страдание говорит языком тела: боль, симптомы, функциональные нарушения. Чувства трудно распознать и назвать, мышление конкретное и «вещное», фантазия бедна. Самоощущение хрупкое: человек чувствует себя бессильным и неуслышанным.","basis":"клинически выведенное описание (Box 12.6, стр. 685); кластер SWAP не выделился — вероятно, из-за выборки психотерапевтов и психиатров (стр. 683). Часть авторов считает соматизацию вне спектра личности (стр. 683).","typicalTxt":"здоровый — встречается ◆ (соматизация есть на всех уровнях тяжести, стр. 683); невротический — встречается (стр. 683); пограничный — типично (соматизация «вездесуща» на пограничном уровне, лечение здесь особенно трудно, стр. 660, 683); психотический — встречается (соматический бред, тело как садистический преследователь, стр. 661, 683)","mvulnTxt":"4 — тело как «предпочтительный» канал невыразимого (стр. 683; описание способности — стр. 719–720); 2 — алекситимия (стр. 684, 716); 3 — не хватает «ментализованной аффективности», склонность соматизировать (стр. 684, 718); 12 — операциональное мышление, бедность фантазии (стр. 684).","vulnTxt":"illness — медицинские «хождения по мукам» и недоверие врачей (стр. 683–684); reject — повторяющийся опыт «тебя не слышат» (стр. 684); loss — симптомы совпадают с утратами и выходом на пенсию (стр. 941).","pages":"493–494 (Box 8.6 — 494), 660–661, 667, 676, 683–685 (Box 12.6 — 685), 716, 718–720, 940–942, 1026","spectrumTxt":"интернализирующий (стр. 667)","sub":[{"n":null,"d":"нет. Отграничение: ипохондрия — более тяжёлое состояние (преувеличенный страх болезни, низкий порог дискомфорта, ритуалы вокруг тела, озабоченность телом вместо отношений; при исследовании переноса возможна паранойяльность) (стр. 684)."}],"core":["somatization","regression","dissociation","hrc"],"lv":[["телесный сигнал","Тело первым сигналит о стрессе, но человек связывает симптом с переживанием и заботится о себе ◆."],["конверсия","Симптом выражает конкретные непереносимые идеи и чувства, отношения и работа в целом сохранны (стр. 684 ◆)."],["болезнь как язык","Хронические необъяснимые симптомы, зависимость от обезболивающих, болезни прерывают лечение; беспомощность вместе с оппозицией (стр. 683–684)."],["тело-преследователь","Соматический бред; тело переживается как садистический преследователь (стр. 661, 683)."]],"bands":[["selfobs","suppression"],["repression","somatization"],["somatization","hrc","regression"],["delproj","concretization"]],"teen":"тело в подростковом возрасте меняется и становится ареной аффективных и отношенческих конфликтов; боль реальна, хотя часто без медицинского объяснения (стр. 493). Алекситимия, операциональное мышление, низкая ментализация; чувства не вытеснены, а никогда не были сформулированы (стр. 493). Подросток подозрителен к психологу, а поспешные доказательства «психологического происхождения» вредят (стр. 493).","teenP":"PA, стр. 493–494","older":"много хронических болезней — трудно отличить обоснованную тревогу от соматизации; признаки: жалобы без ясной болезни, изоляция под предлогом недомогания, колебания симптомов в зависимости от людей и ситуаций, связь с пенсией и утратами (стр. 940–941). Исключить «маскированную депрессию» и пропущенную болезнь; характерна «вращающаяся дверь» госпитализаций; страдание реально, не отстраняться (стр. 941–942).","olderP":"POA, стр. 940–942","cross":{"dsm":"р лядит бессильным. Невротическому уровню помогает работа с инсайтом, пограничному — внимание к границам, конфронтация с разрушительными отыгрываниями, психообразование (стр. 687–688).","avoid":"Отвечать на соблазнение или купаться в идеализации; конкурировать; быть «слабым» помощником (стр. 687). Высмеивать «театральность» или отвергать соблазнение — его нужно понять и проговорить (стр. 944).","proto":"Эмоции яркие и театральные, мышление общее, «по впечатлению», детали теряются. Пол, привлекательность и власть — главная ось: восхищение «сильными» и подражание им, внушаемость, соблазнение, быстрые и сильные, но неглубокие привязанности. Под этим — страх оказаться отвергнутым и одиноким.","basis":"эмпирический прототип SWAP (Box 12.7, стр. 687).","typicalTxt":"здоровый — типично (стр. 655: истерический и обсессивный стили чаще на здоровом или невротическом уровне); невротический — типично (стр. 657); пограничный — встречается: именно это сочетание DSM называет пограничным РЛ (стр. 656, 686); психотический — нетипично, но описан как почти не поддающийся помощи (стр. 688).","mvulnTxt":"2 — аффект: театральность как защита от затопления (стр. 686); 4 — тело: конверсия, у пожилых ипохондрия (стр. 686, 943); 7 — близость: привязанности сильные, но неглубокие (стр. 687); 8 — импульсы на пограничном уровне: гистрионная патология — на «недоконтролируемом» полюсе M-оси (стр. 725). ◆ Также 1: детали и противоречия «проскальзывают» (стр. 686).","vulnTxt":"reject — страх отвержения (Box 12.7, стр. 687); alone — страх одиночества (там же); intrude ◆ — сексуализированная близость поднимает конфликт и страх перевозбуждения (стр. 686); illness — у пожилых утрата привлекательности и телесный упадок бьют по самооценке (стр. 943). trauma ◆ — регрессия и диссоциация при травматическом напоминании (стр. 942–943; перенесено из справочной карточки «Диссоциативный»).","pages":"655–657, 665, 667, 685–688, 725, 735; PA 507–510; POA 942–944; PDC-3 1025.","spectrumTxt":"экстернализирующий (стр.
