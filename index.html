Основательница компании, 78 лет, всю жизнь очень самостоятельная. Через месяц в пансионате постоянно зовёт персонал, не может ничего решить сама.","a":"зависимость, индуцированная учреждением","o":["depend","masoch","hyst"],"why":"В анамнезе зависимости нет, поведение появилось с переездом (стр. 933).","age":"older"},{"q":"Бухгалтер на пенсии, 69 лет, уверена, что соседи «что-то замышляют». Слух резко ухудшился, недавно родственник снял деньги с её карты.","a":"сначала проверить сенсорные потери и жестокое обращение","o":["para","бредовое расстройство","schiz"],"why":"Недоверие часто следует из сенсорных потерь и реального злоупотребления (стр. 946).\n\n---","age":"older"}],"diff":[{"q":"Эмоционально дисрегулированный стиль и пограничный уровень: что верно?","a":"ЭД всегда на пограничном уровне, но на пограничном уровне бывает любой стиль","o":["Это одно и то же: «пограничная личность»","Пограничный уровень бывает только у ЭД","ЭД бывает на любом уровне, как другие стили"],"why":"В PDM-3 «пограничный» — только уровень организации; эмоционально дисрегулированный стиль всегда на нём, но не наоборот (стр. 696)."},{"q":"Антидепрессант снял симптомы, но самокритика и чувствительность к отвержению остались. Депрессивная личность или депрессивный эпизод?","a":"Стиль: депрессивная личность","o":["Эпизод: симптомы ушли — значит, всё","Ни то ни другое: побочный эффект","Психотический уровень"],"why":"Устойчивые черты сохраняются после снятия симптомов — это стиль, а не только эпизод (стр. 668)."},{"q":"Гипоманиакальный стиль или биполярное расстройство: что говорит PDM-3?","a":"Возможно и то и другое, нужна тщательная оценка","o":["Всегда биполярное расстройство","Никогда не связаны","Решает только длительность подъёма"],"why":"PDM-3 подчёркивает: гипоманиакальная личность и биполярный диатез могут сочетаться, нужна тщательная оценка (стр. 670)."},{"q":"Шизоид или человек с аутизмом: кто считывает социальные ожидания, но держит дистанцию?","a":"Шизоид","o":["Человек с аутизмом","Оба одинаково","Ни тот ни другой"],"why":"При шизоидности сигналы считываются, но отношения отвергаются; при РАС нарушено само считывание (стр. 681; у подростков стр. 491)."},{"q":"Пожилой человек сузил круг общения. Шизоидный стиль или нормальное старение?","a":"Сначала исключить нормативное «сужение круга»","o":["Шизоидный стиль","Депрессивный стиль","Тревожно-избегающий стиль"],"why":"Избирательность связей ради эмоционально ценных контактов — норма старения; ключ к шизоидности — пожизненная тема «близость — дистанция» (POA, стр. 928, 938–939)."},{"q":"Подросток рискует на скейтборде и пробует запрещённое. Контрфобический стиль?","a":"Не обязательно: умеренная контрфобия у подростков нормативна","o":["Да, это контрфобический стиль","Это психопатический стиль","Это эмоционально дисрегулированный стиль"],"why":"Поиск риска есть примерно у половины подростков; стиль — когда риск чрезмерный и уязвимость непереносима (стр. 472, 489)."},{"q":"Истерический стиль на пограничном уровне или эмоционально дисрегулированный: чем отличаются?","a":"У истерического центр — пол и власть, вне этой сферы возможны устойчивые связи; у ЭД — дилемма привязанности","o":["Ничем: это синонимы","У истерического чаще самоповреждения","ЭД бывает только у женщин"],"why":"Вывод составителей по стр. 686 и 697 ◆."},{"q":"Психопатический или садистический: в чём главное различие?","a":"У садистического — доминирование с холодным удовольствием от страдания; у психопатического — власть и выигрыш ради самого выигрыша","o":["Садистический всегда импульсивнее","Психопатический всегда жестоко бьёт","Различия нет: это один стиль"],"why":"Стр. 692–695; у садистического нет импульсивности, жестокость холодная и спланированная ◆."}]},"CROSS_ST":[["dep_r","— (был в приложении прежней редакции DSM)","PD-TS: депрессивность, ангедония","негативная аффективность"],["hypom","— (дифф.: циклотимия, биполярное II)","—","—"],["masoch","— (был в приложении DSM-III-R)","PD-TS","негативная аффективность"],["depend" ,["style","стиль личности","Personality style","Устойчивый способ думать, чувствовать и строить отношения. Расстройство личности — крайняя, ригидная форма стиля (стр. 653).","«тип» — только в историческом контексте Мак-Вильямс",["стиль личности","стиля личности","стили личности"]],["dysreg","эмоционально дисрегулированный стиль","Emotionally dysregulated personality","Стиль, всегда связанный с пограничным уровнем: «стабильная нестабильность» чувств, образа себя и отношений (стр. 696).","«пограничная личность», «ПРЛ»",["эмоционально дисрегулированный","эмоционально дисрегулированного"]],["hyst","истерический-истероидный","Hysteric–histrionic","«Истерический» — на здоровом и невротическом уровне, «истероидный» — на пограничном и психотическом (стр. 657, 686).","«театральный»",["истероидный"]],["spectrum","интернализирующий / экстернализирующий спектр","Internalizing / Externalizing spectrum","Интернализирующие страдают внутри и винят себя; экстернализирующие переносят страдание на других и винят их; дисрегулированные — «стабильно нестабильные» (стр. 666–667).","",["интернализирующий","экстернализирующий"]],["maxis","M-ось","Profile of mental functioning","Профиль 13 базовых психических способностей; каждая оценивается от 1 до 5, сумма 13–65 даёт уровень M1–M7.","«12 способностей» — теперь их 13",["M-ось","M-оси"]],["mentalization","ментализация","Mentalization","Способность понимать своё и чужое поведение через внутренние состояния: желания, чувства, намерения (стр. 717).","",["ментализация","ментализации","ментализацию"]],["defensive","защитное функционирование","Defensive functioning","Привычные способы справляться с тревогой, стыдом и конфликтом. В атласе — по иерархии DMRS (Perry) от 7 до 0.","",["защитное функционирование"]],["dmrs","DMRS","Defense Mechanism Rating Scales","Шкала защит Перри, на которую опирается PDM-3: 7 высокоадаптивные, 6 обсессивные, 5 невротические (5a/5b), 4 и 2 искажение образов, 3 отказ, 1 действие, 0 психотические (стр. 735).","",["DMRS" function rankOf(xp){ let i = 0; while(i < RANKS.length-1 && xp >= RANKS[i+1][0]) i++; return i; }
function addXP(n, why){

function touchDay(){
  const d = today();
  if(P.days.last === d) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
  P.days.streak = P.days.last === ys ? P.days.streak + 1 : 1;
  P.days.last = d;
  if(P.days.streak >= 3) unlock("days3");
  persist();
}
function questsToday(){
  const d = today();
  if(P.quests.day !== d){
    let h = 0; for(const c of d) h = (h*31 + c.charCodeAt(0)) >>> 0;
    const pool = QUESTS.map((q,i) => i); const ids = [];
    while(ids.length < 3){ h = (h*1103515245 + 12345) >>> 0; const k = pool.splice(h % pool.length, 1)[0]; ids.push(QUESTS[k][0]); }
    P.quests = {day:d, ids, prog:{}, done:[]}; persist();
  }
  return P.quests;
}
function quest(id, inc){
  const q = questsToday(); if(!q.ids.includes(id) || (q.done||[]).includes(id)) return;
  const def = QUESTS.find(x => x[0] === id);
  q.prog[id] = (q.prog[id]||0) + (inc||1);
  if(q.prog[id] >= def[2]){ q.done = (q.done||[]).concat(id); toast("Задание дня выполнено", def[1] + " · +40 XP", "var(--good)"); addXP(40); confetti(40); }
  persist(); if(P_view === "start") renderView();
}
function unlock(id){

  addXP(a.x); confetti(70);
}
function markSeen(key, depth){
  const lvl = depth >= 2 ? 2 : 1, prev = P.seen[key] || 0;
  if(lvl <= prev) return;
  P.seen[key] = lvl; persist();
  addXP(prev === 0 ? (lvl === 2 ? 7 : 2) : 5);
  const cnt = p => Object.keys(P.seen).filter(k => k.startsWith(p)).length;
  if(MAIN_STYLES.every(s => P.seen["style:"+s.id])) unlock("styles");
  if(cnt("level:") >= 4) unlock("levels");
  if(cnt("def:") >= 30) unlock("defs");
  if(cnt("cap:") >= 13) unlock("caps");

}

/* confetti */
let cf = null;
function confetti(n){
  if(reduce) return;
  const c = $("#confetti"); if(!c) return;
  const ctx = c.getContext("2d"); const dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ["#6a4bd8","#16917d","#3767cc","#c97c0f","#c0344f","#e8b93f"];
  const parts = (cf && cf.parts) || [];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*0.38, vx:(Math.random()-.5)*11, vy:-Math.random()*11-4, r:Math.random()*6+3, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.3, life:0});
  if(cf) return; cf = {parts};
  const step = () => {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    cf.parts = cf.parts.filter(p => p.life < 150 && p.y < innerHeight + 20);
    for(const p of cf.parts){ p.life++; p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life/150); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(cf.parts.length) requestAnimationFrame(step); else { ctx.clearRect(0,0,innerWidth,innerHeight); cf = null; }
  };
  requestAnimationFrame(step);
}

  document.body.appendChild(box); confetti(120);

}

/* ---------- recording ---------- */
function addMistake(it){ if(!it || !it.uid) return; if(!P.mistakes.find(m => m.uid === it.uid)) P.mistakes.push({uid:it.uid, ts:Date.now()}); persist(); }

function recordTest(mod, pct, n, inline){
  const t = P.tests[mod] = P.tests[mod] || {best:0, last:0, rounds:0, byDepth:{}};
  const d = inline ? 1 : P.depth;
  const wasMastered = t.best >= 0.8 && (n >= 3);
  t.last = pct; t.rounds++; t.best = Math.max(t.best, pct); t.byDepth[d] = Math.max(t.byDepth[d] || 0, pct);
  persist();
  if(pct >= 0.8 && !wasMastered){ toast("Модуль освоен: " + (QMOD[mod] ? QMOD[mod].n : mod), "Результат " + Math.round(pct*100) + "% · +50 XP", "var(--good)"); addXP(50); confetti(60); }
  if(!inline && d === 3 && pct >= 0.8 && n >= 5) unlock("deep3");
  if(!inline && pct === 1 && n >= 5) unlock("perfect");
  if(mod === "diff" && pct === 1 && n >= 8) unlock("diff8");
}

let T = null;   // current round
function startRound(mod, opts){

  else { const n = P.depth === 1 ? 5 : P.depth === 2 ? 8 : 10; items = sample(bank(mod), n); }
  if(!items.length){ toast("Вопросов нет", mod === "mist" ? "Ошибок на повтор пока нет." : "", "var(--muted)"); return; }
  T = {mod, items:items.map(prepQ), i:0, score:0, first:items.length, combo:0, best:0, ans:null, requeued:new Set(), wrong:0};

function roundHTML(){

}
function roundEnd(){
  const pct = T.score / T.first;
  if(!T.recorded){
    T.recorded = true;
    if(T.mod !== "mix" && T.mod !== "mist") recordTest(T.mod, pct, T.first);
    else { if(pct === 1 && T.first >= 5) unlock("perfect"); }
    if(T.mod === "mist") quest("mistakes");
  }

  return `<div class="quiz"><div class="card qend"><span class="eyebrow">Раунд завершён</span><div class="score">${T.score} / ${T.first}</div>

}
function answerRound(k){
  if(!T || T.ans !== null) return;
  const it = T.items[T.i];
  T.ans = k;
  const ok = k === String(it.a);
  const retry = it._retry;
  if(ok){
    if(!retry){ T.score++; T.combo++; T.best = Math.max(T.best, T.combo); addXP(10 + Math.min(10, (T.combo-1)*2)); }
    P.stats.correct++; quest("correct5"); clearMistake(it.uid);
    if(T.combo >= 5) unlock("streak5");
    P.stats.bestStreak = Math.max(P.stats.bestStreak, T.combo);
  } else {
    T.combo = 0; T.wrong++; addMistake(it);
    if(!T.requeued.has(it.uid)){ T.requeued.add(it.uid); const copy = prepQ(it); copy._retry = true; T.items.splice(Math.min(T.items.length, T.i + 3), 0, copy); }

}

  const lead = fmt("M-ось — 13 базовых психических способностей. P-ось отвечает на вопрос «как устроена личность», M-ось — «насколько хорошо работают её отдельные функции» (стр. 709–710). Каждая способность оценивается от 1 до 5; сумма 13–65 даёт уровень M1–M7.", P.depth, {gloss:P.depth>=2});
  const doms = DOMAINS.map((dm, k) => `<div class="domain"><h3>${esc(dm[0])} <i>${dm[1][0]}–${dm[1][dm[1].length-1]}</i></h3>${dm[1].map(n => { const c = CAP(n); const seen = P.seen["cap:"+n];
    return `<button type="button" class="cap" data-open="cap:${n}"><span class="no">${n}</span><b>${esc(c.name.replace(/ \(.+\)$/,""))}${seen?` <span class="sr">открыта</span>`:""}</b><small>${esc(c.line)}</small></button>`; }).join("")}</div>`).join("");
  const mlad = MLEVELS.map((m,i) => { const c = LVC[ENG.BAND_OF_M[i]]; return `<div style="--c:${c}"><b>${m.code}</b><span>${esc(m.name)}</span><span>${m.range}</span></div>`; }).join("");
  let extra = "";
  if(P.depth >= 2) extra += typicalProfileHTML();
  if(P.depth >= 3) extra += buildProfileHTML();
  return vhead("capacities", "Способности: M-ось", lead) + ageCallout("capacities")
    + (P.depth >= 2 ? `<details class="fold" ${P.depth===3?"open":""}><summary>Что такое M-ось и как она связана с уровнями</summary><div class="fb">${md(M_INTRO.split("\n\n>")[0])}</div></details>` : "")
    + `<div class="capwrap"><div class="domains">${doms}</div><aside class="card pad stack"><h3>Уровни M1–M7</h3><div class="mlad">${mlad}</div><p class="muted" style="font-size:12.5px">${fmt("Здоровый = M1 · невротический = M2–M3 · пограничный = M4–M6 · психотический = M7 (стр. 738). Диапазоны — по бланку PDC-3 (стр. 1027).")}</p></aside></div>`
    + extra
    + (P.depth >= 3 ? `<details class="fold"><summary>Расхождения в книге</summary><div class="fb">${md(">" + M_INTRO.split("\n\n>")[1] || "")}</div></details>` : "")
    + modTest("capacities") + nextMod("capacities");
}
function bars13(vals, base, opt){
  opt = opt || {};
  return `<div class="bars">${vals.map((v,i) => { const n = i+1, c = CAP(n); const d = base ? v - base[i] : 0;
    const col = v >= 4 ? "var(--lv0)" : v >= 3 ? "var(--lv1)" : v >= 2 ? "var(--lv2)" : "var(--lv3)";
    const vk = opt.mv ? ENG.kind(opt.mv, n) : "";
    return `<div class="bar13 ${Math.abs(d) >= 0.15 && opt.hl ? "ch" : ""}"><span class="no">${n}</span><span class="nm">${esc(c.short)}${vk === "p" ? `<span class="vk" title="главная уязвимость стиля">●</span>` : vk === "s" ? `<span class="vk" title="вторичная уязвимость">○</span>` : vk === "k" ? `<span class="vk" style="color:var(--good)" title="относительно сохранна">★</span>` : ""}</span>
      <span class="tr"><i style="width:${((v-1)/4*100).toFixed(1)}%;--bc:${col}"></i>${base && opt.mark ? `<u style="left:${((base[i]-1)/4*100).toFixed(1)}%"></u>` : ""}</span><span class="v">${v.toFixed(1)}</span>
      <span class="dl ${d < -0.05 ? "dn" : d > 0.05 ? "up" : ""}">${Math.abs(d) >= 0.05 && opt.delta ? (d < 0 ? "↓" : "↑") + Math.abs(d).toFixed(1) : ""}</span></div>`; }).join("")}</div>`;
}

/* ======================= simulator: functioning under load ======================= */
const RSHORT = {"7":"адаптив.","6":"обсесс.","5a":"истерич.","5b":"др.невр.","4":"иск. м.","3":"отказ","2":"иск. зн.","1":"действие","0":"психот."};
const ZONES = [[0,"покой",0],[25,"напряжение",1],[50,"перегрузка",2],[75,"кризис",3]];
const zoneOf = v => ZONES.filter(z => v >= z[0]).pop();
const SIM = {stress:35, support:0, months:0, rz:-32, tab:"events", evtab:"t", log:[], st:null, prev:null, lastMi:null, deepestMi:null, shown:null, logOpen:false, partner:false, predOk:0};
(function(){ const u = P.ui.sim || {}; SIM.style = u.style || "narc"; SIM.li = u.li ?? 1; SIM.pdc = u.pdc || LEVELS[SIM.li].sim; })();
function simStyles(){
  if(isChild()) return PC.map(p => ({id:p.id, n:p.n, m:p.m, sp:"dys", mv:p.mv, pc:true, typ:[3,3,3,3]}));
  return MAIN_STYLES.map(s => ({id:s.id, n:styleName(s), m:s.m, sp:s.sp, mv:s.mv, typ:s.typ, off:teenAbsent(s.id)}));
}
const simStyle = () => simStyles().find(s => s.id === SIM.style) || simStyles()[0];
function fixSimStyle(){
  const list = simStyles();
  const cur = list.find(s => s.id === SIM.style && !s.off);
  if(!cur) SIM.style = isChild() ? "pc_inhib" : "narc";
  const s = simStyle();
  if(s.typ && s.typ[SIM.li] === 0){ SIM.li = s.typ.indexOf(3); SIM.pdc = LEVELS[SIM.li].sim; }
}
const adultOf = id => PCB[id] ? PCB[id].sim : id;
function isVul(t){ const v = (t.ageVuln && t.ageVuln[P.age]) || t.vuln; return !t.all && (v.includes(SIM.style) || v.includes(adultOf(SIM.style))); }

const isMinus = s => s.minus.includes(SIM.style) || s.minus.includes(adultOf(SIM.style));
function simLists(){
  const L = AGE_LISTS[P.age] || AGE_LISTS.adult;
  const extraT = (P.age === "emerg" || P.age === "older") ? AGE_LISTS.adult.t.filter(t => !L.t.includes(t)) : [];
  const extraS = (P.age === "emerg" || P.age === "older") ? AGE_LISTS.adult.s.filter(t => !L.s.includes(t)) : [];
  return {t:L.t, s:L.s, xt:extraT, xs:extraS};
}
function simInit(){
  fixSimStyle();
  SIM.st = ENG.init({mv:simStyle().mv, pdc:SIM.pdc, stress:SIM.stress, support:SIM.support, internal:SIM.internal||0, age:P.age});
  ENG.settle(SIM.st);
  SIM.prev = SIM.st.cur.slice(); SIM.lastMi = null; SIM.deepestMi = null;
  P.ui.sim = {style:SIM.style, li:SIM.li, pdc:SIM.pdc}; persist();
}
function baseRead(){
  const st = SIM.st; const zero = new Array(13).fill(0);
  const t = ENG.targets({mv:st.mv, pdc:st.pdc, stress:0, support:0, internal:st.internal, age:P.age, shock:zero});
  const s = ENG.sum(t); return {sum:s, mi:ENG.mIdx(s)};

function read(){
  const s = ENG.sum(SIM.st.cur), mi = ENG.mIdx(s);
  return {sum:s, mi, band:ENG.BAND_OF_M[mi], pdc:ENG.pdcEq(s), rung:ENG.rung(s), d:ENG.dpos(s)};
}

/* ---------- sheet ---------- */
const SH = {kind:null, id:null, list:[], opener:null};
const SHEETS = {level:sheetLevel, style:sheetStyle, pc:sheetPC, def:sheetDef, cap:sheetCap, cell:sheetCell, trig:sheetTrig, stab:sheetStab};
function openSheet(kind, id, opener){
  if(kind === "age" && AGE[id]){ setAge(id); go("age"); return; }
  const f = SHEETS[kind]; if(!f) return;
  const r = f(id); if(!r) return;
  SH.kind = kind; SH.id = id; SH.list = r.list || [];
  if(opener) SH.opener = opener;
  const head = `<div class="ht"><span class="eyebrow" style="${r.c ? `color:${r.c}` : ""}">${esc(r.type)}</span><div class="row" style="flex-wrap:nowrap;gap:10px">${r.mono ? mono(r.mono) : r.monoTxt ? `<span class="mono-badge" style="--spc:var(--sp-dys)">${esc(r.monoTxt)}</span>` : ""}<h2 id="shTitle">${esc(r.title)}</h2></div>${r.sub || ""}${r.acts ? `<div class="acts">${r.acts}</div>` : ""}</div>
    <button type="button" class="iconbtn" data-shclose aria-label="Закрыть">✕</button>`;
  $("#shHead").innerHTML = head;
  $("#shBody").innerHTML = r.body; $("#shBody").scrollTop = 0;
  const key = kind + ":" + id; const i = SH.list.indexOf(key);
  if(i >= 0 && SH.list.length > 1){
    const pv = SH.list[(i - 1 + SH.list.length) % SH.list.length], nx = SH.list[(i + 1) % SH.list.length];
    $("#shFoot").innerHTML = `<button type="button" class="btn" data-open="${pv}" data-nav="1"><span>← ${esc(sheetTitle(pv))}</span></button><button type="button" class="btn" data-open="${nx}" data-nav="1"><span>${esc(sheetTitle(nx))} →</span></button>`;
    $("#shFoot").hidden = false;
  } else $("#shFoot").hidden = true;
  const sh = $("#sheet"), sc = $("#scrim");
  sh.hidden = false; sc.hidden = false; sh.inert = false;
  requestAnimationFrame(() => { sh.classList.add("show"); sc.classList.add("show"); });
  document.body.classList.add("panel-open");
  tip().hidden = true; closePop();
  setTimeout(() => { const c = $("[data-shclose]"); if(c && !(SH._nav)) c.focus({preventScroll:true}); SH._nav = false; }, 60);
}
function sheetTitle(key){
  const [k, a, b] = key.split(":");
  if(k === "level") return LEVELS[+a].short; if(k === "style") return STY[a].n; if(k === "pc") return PCB[a].n; if(k === "def") return DEF[a].sh || DEF[a].n; if(k === "cap") return CAP(+a).short;
  if(k === "cell") return LEVELS[+b].short; return key;
}
function reopenSheet(){ if(SH.kind && SH.kind !== "custom") { const sc = $("#shBody").scrollTop; openSheet(SH.kind, SH.id); $("#shBody").scrollTop = sc; } }
function openCustomSheet(r){
  SH.kind = "custom"; SH.id = null; SH.list = [];
  $("#shHead").innerHTML = `<div class="ht"><span class="eyebrow">${esc(r.type||"")}</span><h2 id="shTitle">${esc(r.title)}</h2></div><button type="button" class="iconbtn" data-shclose aria-label="Закрыть">✕</button>`;
  $("#shBody").innerHTML = r.body; $("#shFoot").hidden = true;
  const sh = $("#sheet"), sc = $("#scrim"); sh.hidden = false; sc.hidden = false; sh.inert = false;
  requestAnimationFrame(() => { sh.classList.add("show"); sc.classList.add("show"); });
  document.body.classList.add("panel-open");
  setTimeout(() => { const c = $("[data-shclose]"); if(c) c.focus({preventScroll:true}); }, 60);
}
function closeSheet(instant){
  const sh = $("#sheet"), sc = $("#scrim");
  if(!SH.kind && sh.hidden) return;
  SH.kind = null;
  sh.classList.remove("show"); sc.classList.remove("show"); sh.inert = true;
  document.body.classList.remove("panel-open");
  setTimeout(() => { if(!SH.kind){ sc.hidden = true; } }, instant ? 0 : 230);
  if(SH.opener && document.contains(SH.opener) && !instant) SH.opener.focus({preventScroll:true});
  SH.opener = null;
}
/* swipe on phones: down to close, left/right for neighbours */
(function(){
  let s = null;
  document.addEventListener("touchstart", e => { const sh = e.target.closest("#sheet"); if(!sh || !isS()) return; const t = e.touches[0]; s = {x:t.clientX, y:t.clientY, top:$("#shBody").scrollTop, head:!!e.target.closest(".sh-head,.sh-grab")}; }, {passive:true});
  document.addEventListener("touchend", e => {
    if(!s) return; const t = e.changedTouches[0]; const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if(dy > 90 && Math.abs(dx) < 60 && (s.head || s.top <= 0)) closeSheet();
    else if(Math.abs(dx) > 80 && Math.abs(dy) < 45 && SH.list.length > 1 && !e.target.closest(".tabs3,.chips,.tblwrap,.seg,.mvrow")){
      const i = SH.list.indexOf(SH.kind + ":" + SH.id); if(i >= 0){ const k = SH.list[(i + (dx < 0 ? 1 : -1) + SH.list.length) % SH.list.length]; const [a, ...b] = k.split(":"); openSheet(a, b.join(":")); }
    }
    s = null;
  }, {passive:true});
})();
document.addEventListener("keydown", e => {
  const tb = e.target.closest && e.target.closest('[role="tab"]');
  if(tb && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    const all = [...tb.parentElement.querySelectorAll('[role="tab"]')]; const i = all.indexOf(tb);
    const n = all[(i + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length]; n.click();
    setTimeout(() => { const m = document.querySelector(`[data-sttab="${n.dataset.sttab}"]`); if(m) m.focus(); }, 30); e.preventDefault(); return;
  }
  if(e.key === "Escape"){ if(!$("#pop").hidden){ closePop(); return; } if(SH.kind) closeSheet(); const lu = $(".lvlup"); if(lu) lu.remove(); }
  if(e.key === "Tab" && SH.kind){
    const f = $$("#sheet button:not([disabled]), #sheet [href], #sheet input, #sheet select, #sheet [tabindex]:not([tabindex='-1'])").filter(x => x.offsetParent !== null);
    if(!f.length) return; const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
  }
});

  const mods = MODS.slice(0,5).map(m => { const s = modState(m.id); const t = P.tests[m.q] || {};
    return `<div class="pmod"><span><b>${esc(m.n)}</b>${medals(m.q)}</span><span class="pb" role="img" aria-label="Открыто ${s.seen}, изучено ${s.studied} из ${s.total}"><i style="width:${s.studied/s.total*100}%;background:var(--accent)"></i><i style="width:${(s.seen-s.studied)/s.total*100}%;background:color-mix(in srgb,var(--accent) 35%,var(--surface3))"></i></span><span class="mono" style="font-size:12px">${s.studied}/${s.total}${t.rounds ? " · тест " + Math.round(t.best*100) + "%" : ""}</span></div>`; }).join("");
  const achs = ACH.map(a => { const on = P.ach.includes(a.id); return `<div class="ach ${on?"on":""}"><span class="ai">${on ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .9-5.1 4.8 1.3 6.9L12 17.8 5.8 21.1l1.3-6.9L2 9.4l7-.9z"/></svg>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`}</span><span><b>${esc(a.n)}</b><small>${esc(a.d)} · +${a.x} XP</small></span></div>`; }).join("");
  const coll = (arr, key, lab, col) => `<div class="coll">${arr.map(x => { const s = P.seen[key(x)] || 0; return `<button type="button" class="s${s}" style="--c:${col(x)}" data-open="${key(x)}" title="${esc(lab(x))}${s ? (s>=2?" · изучено":" · открыто") : ""}" aria-label="${esc(lab(x))}">${esc(x.m || (x.n && String(x.n).length < 3 ? x.n : "") || "")}</button>`; }).join("")}</div>`;
  return `<section class="vhead"><span class="eyebrow">Мой прогресс</span><h1>Прогресс и достижения</h1><p class="lead">Открыто — карточка просмотрена; изучено — на слое 2 или 3; освоено — тест модуля от 80%.</p></section>
    ${playerCard()}
    <section class="card pad stack"><h2>Модули</h2><div class="pmods">${mods}</div><div class="row"><button type="button" class="btn" data-go="tests">Хаб тестов</button><button type="button" class="btn" data-tstart="mist" ${P.mistakes.length?"":"disabled"}>Мои ошибки (${P.mistakes.length})</button></div></section>
    <section class="card pad stack"><h2>Коллекция</h2>
      <div class="blk"><h4>Стили · ${MAIN_STYLES.filter(s => P.seen["style:"+s.id]).length} из 15</h4>${coll(MAIN_STYLES, s => "style:"+s.id, s => s.n, s => SPC[s.sp])}</div>
      <div class="blk"><h4>Защиты · ${Object.keys(DEF).filter(k => P.seen["def:"+k]).length} из 47</h4>${coll(RUNG_ORDER.flatMap(l => Object.keys(DEF).filter(k => DEF[k].lv === l)).map(k => ({id:k, m:DEF[k].lv === "x" ? "·" : DEF[k].lv, n:DEF[k].n})), x => "def:"+x.id, x => x.n, x => rungColor(DEF[x.id].lv))}</div>
      <div class="blk"><h4>Способности · ${MCAP.filter(c => P.seen["cap:"+c.n]).length} из 13</h4>${coll(MCAP.map(c => ({id:c.n, m:String(c.n), n:c.name})), x => "cap:"+x.id, x => x.n, () => "var(--accent)")}</div>
      <div class="blk"><h4>Возраст · ${AGES.filter(a => P.seen["age:"+a.id]).length} из 6 · паттерны детства ${PC.filter(p => P.seen["pc:"+p.id]).length} из 8</h4>${coll(PC.map(p => ({id:p.id, m:p.m, n:p.n})), x => "pc:"+x.id, x => x.n, () => "var(--sp-dys)")}</div></section>
    <section class="stack"><h2>Достижения · ${P.ach.length} из ${ACH.length}</h2><div class="achs">${achs}</div></section>
    <section class="card pad stack"><h2>Сброс</h2><p class="muted" style="font-size:13.5px">Прогресс, опыт, достижения и ошибки хранятся только в этом браузере.</p><div class="row" id="resetRow"><button type="button" class="btn danger" data-reset1>Сбросить прогресс</button></div></section>`;
}

/* ---------- coach marks ---------- */
const COACH = [["#ageChip","Возраст","Выберите возраст — атлас перестроит стили, уровни и симулятор."],["#depthSeg, #depthBtn","Глубина","Кратко, Подробнее или Глубоко. В карточках есть «Подробнее ▾»."],["#ring","Прогресс","Сколько изучено, ранг и опыт. Нажмите — откроется «Мой прогресс»."]];
let coachI = 0;
function coach(){
  if(P.coach) return;
  const el = COACH[coachI] && $$(COACH[coachI][0]).find(x => x.offsetParent !== null);
  $$(".coach,.coachring").forEach(x => x.remove());
  if(!el){ P.coach = true; persist(); return; }
  const r = el.getBoundingClientRect();
  const ring = document.createElement("div"); ring.className = "coachring";
  Object.assign(ring.style, {left:(r.left-4)+"px", top:(r.top-4)+"px", width:(r.width+8)+"px", height:(r.height+8)+"px"});
  const b = document.createElement("div"); b.className = "coach"; b.setAttribute("role", "dialog");
  b.innerHTML = `<b>${COACH[coachI][1]} · ${coachI+1} из 3</b><span>${COACH[coachI][2]}</span><div class="row"><button type="button" class="btn sm ghost" data-coachskip>Пропустить</button><button type="button" class="btn sm" data-coachnext>${coachI === 2 ? "Готово" : "Дальше"}</button></div>`;
  document.body.append(ring, b);
  const bw = b.offsetWidth; const left = clamp(r.left + r.width/2 - bw/2, 12, innerWidth - bw - 12);
  b.style.left = left + "px"; b.style.top = (r.bottom + 12) + "px"; b.style.setProperty("--ax", clamp(r.left + r.width/2 - left - 7, 14, bw - 28) + "px");
  b.querySelector("[data-coachnext]").focus({preventScroll:true});
}

/* ---------- global delegation ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if(t.closest("[data-coachnext]")){ coachI++; coach(); return; }
  if(t.closest("[data-coachskip]")){ P.coach = true; persist(); $$(".coach,.coachring").forEach(x => x.remove()); return; }
  const md = t.closest("[data-mode]");
  if(md){ const m = md.dataset.mode;
    if(m === "overview"){ P.depth = 1; persist(); toast("Обзор за 10 минут", "Слой «Кратко». Идите по кнопкам «Дальше».", "var(--lv0)"); go("levels"); }
    if(m === "steps"){ P.depth = Math.max(2, P.depth); persist(); go("levels"); }
    if(m === "sim") go("sim");
    if(m === "test") startRound("mix");
    return; }
  const ts = t.closest("[data-tstart]"); if(ts && !t.closest(".quiz")){ startRound(ts.dataset.tstart); return; }
  const g = t.closest("[data-go]"); if(g){ e.preventDefault(); const tm = g.dataset.tmod; if(tm){ closeSheet(true); startRound(tm); } else go(g.dataset.go); return; }
  const hj = t.closest("[data-hj]"); if(hj){ e.preventDefault(); const n = $("#" + hj.dataset.hj); if(n) n.scrollIntoView({behavior: reduce ? "auto" : "smooth"}); return; }
  const ag = t.closest("[data-age]"); if(ag){ setAge(ag.dataset.age); return; }
  const dp = t.closest("[data-depth]"); if(dp){ closeSheet(true); setDepth(+dp.dataset.depth); return; }
  const ds = t.closest("[data-depthset]"); if(ds){ setDepth(+ds.dataset.depthset); return; }
  const shp = t.closest("[data-sheet]"); if(shp){ specialSheet(shp.dataset.sheet); return; }
  if(t.closest("[data-shclose]") || t.closest("#scrim")){ closeSheet(); return; }
  if(t.closest("[data-popclose]")){ closePop(); return; }
  if(t.closest("[data-dia]")){ const n = t.closest("[data-dia]"); popAt(n, `<b>◆ Вывод составителей</b><span>Это вывод составителей атласа, в PDM-3 прямо не сказано.</span>`); return; }
  const term = t.closest("[data-term]");
  if(term){ const gl = GLOSS.find(x => x[0] === term.dataset.term); popAt(term, `<b>${esc(cap1(gl[1]))}</b><span class="muted" style="font-size:12px">${esc(gl[2])}</span><span>${fmt(gl[3], 2)}</span><button type="button" class="btn sm" data-glossgo="${gl[0]}">В глоссарий</button>`); return; }
  const gg = t.closest("[data-glossgo]"); if(gg){ closePop(); go("help"); setTimeout(() => { const n = $("#term-" + gg.dataset.glossgo); if(n) n.scrollIntoView({block:"center"}); }, 50); return; }
  const mo = t.closest("[data-more]"); if(mo){ const k = mo.dataset.more; MORE[k] = effDepth(k) + 1; if(SH.kind) reopenSheet(); return; }
  const sm = t.closest("[data-sim]");
  if(sm){ const id = sm.dataset.sim; SIM.style = id; if(sm.dataset.simlvl !== undefined){ SIM.li = +sm.dataset.simlvl; SIM.pdc = LEVELS[SIM.li].sim; } SIM.st = null; P.ui.sim = {style:SIM.style, li:SIM.li, pdc:SIM.pdc}; persist(); go("sim"); return; }
  const sl = t.closest(".sheet .acts [data-simlv]"); if(sl){ SIM.li = +sl.dataset.simlv; SIM.pdc = LEVELS[SIM.li].sim; SIM.st = null; go("sim"); return; }
  const cw = t.closest("[data-cmpwith]"); if(cw){ P.ui.cmpA = cw.dataset.cmpwith; if(P.ui.cmpB === P.ui.cmpA) P.ui.cmpB = P.ui.cmpA === "narc" ? "psychop" : "narc"; P.ui.stView = "cmp"; persist(); go("styles"); return; }
  const op = t.closest("[data-open]");
  if(op){ const v = op.dataset.open; const i = v.indexOf(":"); const kind = v.slice(0, i), id = v.slice(i+1);
    if(op.dataset.agejump && P.age === "child"){ /* adult style from child pattern: just open */ }
    if(op.dataset.nav) SH._nav = true;
    openSheet(kind, id, op.closest("#sheet") ? SH.opener : op); return; }
  /* module-local controls */
  const lm = t.closest("[data-lvmode]"); if(lm){ P.ui.lvMode = lm.dataset.lvmode; persist(); if(lm.dataset.lvmode === "cmp") quest("lvcompare"); renderView(); return; }
  const lc = t.closest("[data-lvcrit]"); if(lc){ P.ui.lvCrit = lc.dataset.lvcrit; persist(); quest("lvcompare"); renderView(); return; }
  const bs = t.closest("[data-bsub]"); if(bs){ P.ui.bsub = bs.dataset.bsub; reopenSheet(); return; }
  const mx = t.closest("[data-mxsel]"); if(mx){ P.ui.mxSel = mx.dataset.mxsel; persist(); const sc = scrollY; renderView(); scrollTo({top:sc}); const m = $(".mmsel"); if(m) m.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"}); return; }
  const sv = t.closest("[data-stview]"); if(sv){ P.ui.stView = sv.dataset.stview; persist(); renderView(); return; }
  const fs = t.closest("[data-fsp]"); if(fs){ P.ui.fSp = fs.dataset.fsp; renderView(); return; }
  const fl = t.closest("[data-flv]"); if(fl){ P.ui.fLv = +fl.dataset.flv; renderView(); return; }
  if(t.closest("[data-fteen]")){ P.ui.fTeen = !P.ui.fTeen; renderView(); return; }
  if(t.closest("[data-cmpswap]")){ const a = P.ui.cmpA || "narc"; P.ui.cmpA = P.ui.cmpB || "psychop"; P.ui.cmpB = a; renderView(); return; }
  const ef = t.closest("[data-eform]"); if(ef){ P.emergForm = ef.dataset.eform; persist(); renderView(); return; }
  const st = t.closest("[data-sttab]"); if(st){ P.ui.stTab = st.dataset.sttab; reopenSheet(); return; }
  const rt = t.closest("[data-rate]"); if(rt){ const [k, n] = rt.dataset.rate.split(/:(?=\d$)/); P.ui.rate = P.ui.rate || {}; P.ui.rate[k] = +n; reopenSheet(); return; }
  const dc = t.closest("[data-dcol]"); if(dc){ P.ui.defColor = dc.dataset.dcol; persist(); renderView(); return; }
  const tl = t.closest("[data-tpl]"); if(tl){ P.ui.tpL = +tl.dataset.tpl; const s = P.ui.tpS && STY[P.ui.tpS]; if(s && s.typ[P.ui.tpL] === 0) P.ui.tpS = ""; quest("mprofile"); const sc = scrollY; renderView(); scrollTo({top:sc}); return; }
  if(t.closest("[data-bpreset]")){ P.ui.bp = new Array(13).fill(3); const sc = scrollY; renderView(); scrollTo({top:sc}); return; }
  if(t.closest("[data-reset1]")){ $("#resetRow").innerHTML = `<span>Точно сбросить всё?</span><button type="button" class="btn danger" data-reset2>Да, сбросить</button><button type="button" class="btn ghost" data-reset0>Отмена</button>`; return; }
  if(t.closest("[data-reset0]")){ renderView(); return; }
  if(t.closest("[data-reset2]")){ const keep = {age:P.age, depth:P.depth, coach:true, migrated:true}; P = Object.assign(JSON.parse(JSON.stringify(DEF_P)), keep); persist(); toast("Прогресс сброшен", "", "var(--muted)"); renderView(); return; }
  if(!t.closest("#pop") && !$("#pop").hidden) closePop();
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-cmp]"); if(c){ P.ui["cmp" + c.dataset.cmp] = c.value; persist(); renderView(); return; }
  const tp = e.target.closest("[data-tps]"); if(tp){ P.ui.tpS = tp.value; quest("mprofile"); const sc = scrollY; renderView(); scrollTo({top:sc}); return; }
});
document.addEventListener("input", e => {
  const b = e.target.closest("[data-bp]"); if(!b) return;
  P.ui.bp = P.ui.bp || new Array(13).fill(3); P.ui.bp[+b.dataset.bp] = +b.value; b.nextElementSibling.textContent = b.value;
  const v = P.ui.bp, sum = v.reduce((a,c) => a+c, 0), mi = ENG.mIdx(sum), band = ENG.BAND_OF_M[mi];
  const r = $("#bpres"); r.style.setProperty("--c", LVC[band]);
  r.innerHTML = `<span class="big">M${mi+1}</span><span>Сумма <b class="mono">${sum}</b> · ${esc(MLEVELS[mi].name.toLowerCase())} · соответствует уровню организации «${esc(LEVELS[band].short)}»</span><span class="muted" style="font-size:12.5px">Учебная оценка, не диагноз.</span>`;
  quest("mprofile"); persist();
});
let rsT = null;
addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { setHH(); document.body.classList.toggle("touch", touch()); if(P_view === "sim" && $("#stage")){ layoutStage(); renderOrbit(); } }, 120); });

window.ATLAS = {go, setAge, setDepth, startRound, openSheet, SIM, P:() => P};
/* ---------- boot ---------- */
function boot(){
  document.documentElement.lang = document.documentElement.lang || "ru";
  document.body.classList.toggle("touch", touch());
  touchDay(); questsToday();
  const h = location.hash.slice(1);
  P_view = ROUTES.includes(h) ? h : "start";
  renderView();
  if(P_view === "start" && !P.coach) setTimeout(coach, 500);
}
boot();

})();
</script>
</body>
</html>
