и не видны; чувства трудно назвать и отличить от телесных ощущений (алекситимические черты).","stress":"На уровне 5 человек и в стрессе распознаёт эмоциональные сигналы и откликается на них. На уровне 3 сбой наступает, когда на человека давят, он расстроен или чувство слишком сильное: он теряет перспективу другого и реагирует невпопад (стр. 716). **Чувствительность: высокая (w = 0.85).** ◆ Это первое звено цепочки: стресс сначала поднимает аффект, и уже от него зависят внимание, ментализация и импульсы.","w":0.85,"wave":1,"rec":"fast","styles":"- dysreg — эмоции «раскручиваются», для успокоения нужен другой человек (стр. 697);\n  - hyst — драматизация, реакции из чувства, а не из размышления (стр. 687);\n  - obs — эмоциональная скованность, на вопрос о чувствах отвечает мыслью (стр. 678–679);\n  - somat — алекситимия (стр. 684);\n  - anxav — «аффект-фобия», трудно назвать чувство (стр. 676);\n  - hypom — энергия как защита от печали (стр. 669–670);\n  - sadist — внутренняя мертвенность (стр. 694);\n  - dep_r — подавленные гнев и радость (стр. 667, 669) ◆;\n  - cphob — непризнаваемый страх (стр. 678) ◆.","age":"*Дети:* регулировать аффект с помощью взрослого или через игру — норма. На уровне 1 ребёнок выражает чувства телом или поступком и злится, когда взрослый пытается их назвать (стр. 165–166). *Подростки:* нормативно растут сила и изменчивость чувств, обостряется чувствительность к оценке сверстников, есть колебания между превосходством и неполноценностью (стр. 418). *Пожилые:* в отличие от многих других способностей, обычно не снижается; пожилые даже чаще сообщают о позитивных чувствах (стр. 908).","signs":["сила реакции не соответствует поводу: вспышка из-за мелочи или «каменное лицо» при серьёзной потере;","на вопрос «что вы почувствовали?» отвечает про события или про тело;","после эпизода сам удивляется: «не знаю, что на меня нашло»."],"tools":"Отдельные пункты SWAP (стр. 734), подшкала аффективной нестабильности PAI-BOR (стр. 736), домен аффектов в STIPO-R (стр. 735–736). Для подростков — DERS, LEAS, B-MAS-A (стр. 449).","quiz":{"q":"Руководительница направления на любой сбой отвечает одинаково громким раздражением, будь то сорванный срок, отказ подрядчика или опечатка в слайде. Через десять минут она удивляется, что \"так завелась\". Радость от побед команды почти не показывает. Решения при этом принимает взвешенно».","a":2,"o":[8,6,9],"why":"сбой в силе и диапазоне самого чувства — аффект несоразмерен поводу и плохо осознаётся, позитивный спектр сужен. Импульсивных решений (8) нет, а самооценка (6) и защиты (9) здесь не главная мишень."}},{"n":3,"id":"ment","name":"Ментализация","short":"Ментализация","line":"Понимать поведение через желания, чувства и намерения","en":"Capacity for Mentalization","domain":"когнитивные и аффективные процессы","pages":"стр. 716–718","what":"Способность понимать своё и чужое поведение через внутренние состояния: желания, чувства, намерения, убеждения (стр. 716). Работает в основном предсознательно. Позволяет перебрать несколько объяснений вместо первого пришедшего в голову и исправить ошибочный вывод (стр. 716–717).","s5":"Строит достаточно точные и при этом скромные модели своего и чужого ума: уверен в догадке, но помнит, что чужая душа до конца не прозрачна.","s3":"Обычно понимает свои и чужие мотивы, но в конфликте или сильном возбуждении «выключается»: ссылается на внешние причины, уходит в действие или в тело.","s1":"Не различает внутреннее и внешнее («раз я так думаю, так и есть»), путается в чужих реакциях, не пересматривает убеждения; под стрессом чувство себя может распадаться.","stress":"PDM-3 прямо говорит, что ментализация уязвима к срывам, особенно под стрессом (стр. 717). На уровне 3 в конфликте, дистрессе и сильном возбуждении наступает заметный спад (стр. 718). **Ключевое для симулятора:** часть людей уровня 3 начинает видеть свои ограничения в понимании себя и других, когда их успокаивает безопасный межличностный контекст (стр. 718). **Чувствительность: высокая (w = 0.90).** ◆ Ментализация падает одной из первых и первой откликается на поддержку.","w":0.9,"wave":1,"rec":"rel","styles":"dysreg — трудности ментализации входят в ядро описания (стр. 696–697); para — трудно встать на место другого, мысль приравнивается к действию (стр. 691–692); schiz в дефицитарном варианте не понимает поведение своё и чужое (стр. 682–683); somat — переживание идёт через тело, а не через представления (ср. определение на стр. 717; стр. 684) ◆; narc — эмоционально вкладывается в себя, а не в других (стр. 689) ◆.","age":"*Дети:* путь идёт от «психической эквивалентности» (что чувствую, то и есть) через «режим притворства» к рефлексии. На уровне 3 ребёнок возвращается к пониманию с помощью взрослого, который ментализирует (стр. 166–169). *Подростки:* сбои в норме кратковременны и привязаны к ситуации; встречаются и проекция, и гиперментализация, то есть сверхсложные выводы (стр. 422). *Пожилые:* болезнь и страх смерти сужают символическое мышление, но у тех, кто хорошо ментализировал раньше, способность может даже расти (стр. 909).","signs":["у чужого поступка одно объяснение, и человек полностью в нём уверен («он специально»);","объясняет через обстоятельства, а не через чувства («так сложилось»);","вопрос «а что он мог при этом думать?» вызывает раздражение или пустоту."],"tools":"Основной — шкала рефлексивной функции (RFS) по интервью AAI (стр. 734–735). Есть пункт SWAP о непонимании чужого поведения (стр. 734). Для подростков — RFQY, MASC (стр. 449–450), для детей — CRFS (стр. 202).","quiz":{"q":"Руководитель видит, что сотрудник час не отвечает в мессенджере, и заявляет: \"Игнорирует — значит, уже ищет другую работу\". Варианты \"занят\", \"в дороге\", \"не заметил\" он отвергает, а объяснению сотрудника не верит».","a":3,"o":[7,9,5],"why":"одно жёсткое прочтение чужого ума без альтернатив и без пересмотра (стр. 717–718). Недоверие (7) здесь следствие, проекция (9) возможна, но сбой — в понимании чужого ума."}},{"n":4,"id":"body","name":"Телесный опыт и репрезентации тела","short":"Тело","line":"Чувствовать тело своим и считывать его сигналы","en":"Bodily Experiences and Representations","domain":"идентичность и отношения","pages":"стр. 718–720","what":"Как человек ощущает, воспринимает и представляет своё тело, осознанно и неявно, и чувствует ли его своим, с границами между «я» и средой (стр. 718–719). Это новая способность PDM-3 (стр. 710). Сюда входят интероцепция, образ тела и умение отличить эмоцию от телесного состояния (стр. 719).","s5":"Тело переживается своим и целостным, его сигналы читаются точно, чувство отличимо от физиологии даже в конфликте.","s3":"В стрессе граница между душевным и телесным размывается, и тело становится главным предметом тревоги: вес, здоровье, внешность.","s1":"Тело кажется чужим, распадающимся или враждебным и служит главным каналом для невыносимых переживаний, вплоть до самоповреждений и деперсонализации.","stress":"На уровне 3 заметный дефицит появляется именно в стрессе и конфликте: всё угрожающее и непереработанное делает тело фокусом внимания (стр. 720). Примеры низкого функционирования: самоповреждения, психосоматические жалобы, страх болезни, конверсия, нарушения образа тела (стр. 719). При гендерной неконгруэнтности оценивается не само несовпадение, а степень дисфории (стр. 719). **Чувствительность: средняя (w = 0.50).** ◆ Способность падает не у всех, но резко падает у «телесных» стилей и при триггерах illness, trauma.","w":0.5,"wave":3,"rec":"slow","styles":"somat — тело как «предпочтительный» канал страдания (стр. 683–685); dysreg — самоповреждение, чтобы почувствовать себя живым (стр. 697); hyst — конверсия, стыд за тело (стр. 686); anxav — соматические симптомы в ответ на стресс (стр. 678); narc — ипохондрические опасения (стр. 689); diss (справочно) — деперсонализация и внетелесный опыт описаны на уровне 1 (стр. 720) ◆.","age":"*Дети:* схема тела строится все первые 10 лет. Оценивают координацию, понимание телесных сигналов и удовольствие от тела (стр. 170–171). *Подростки:* при пубертате тело буквально заставляет психику им заняться; рискованное поведение и самоповреждения часто несут неосознанное послание (стр. 425). *Пожилые:* болезни и изменения внешности вызывают тревогу и чувство никчёмности, растёт риск соматизации (стр. 910).","signs":["перед важными событиями «приступы» тела (мигрень, спина, желудок), а волнение при этом отрицается;","много разговоров о здоровье, весе и внешности вместо разговора о чувствах;","телесные сигналы (голод, усталость) игнорируются до истощения ◆."],"tools":"RFS — частично (стр. 734); подшкала самоповреждения PAI-BOR (стр. 736). Для подростков — BAS-2, BSQ, BUT, EDI-3 (стр. 450).","quiz":{"q":"Перед каждым советом директоров у главного инженера начинается мигрень и болит спина. О волнении он не говорит и уверен, что \"организм такой\"; обследования ничего не находят. Свои рабочие ошибки при этом разбирает спокойно и вдумчиво».","a":4,"o":[2,12,10],"why":"в ситуации угрозы переживание уходит в тело, и душевное не отделяется от телесного (стр. 720). Аффект не хаотичен (2), а самонаблюдение (12) в целом сохранно."}},{"n":5,"id":"ident","name":"Дифференциация и интеграция (идентичность)","short":"Идентичность","line":"Отличать себя от другого и фантазию от реальности","en":"Capacity for Differentiation and Integration","domain":"идентичность и отношения","pages":"стр. 720–721","what":"Умение отличать себя от другого, фантазию от реальности, внутренние образы от реальных людей, прошлое от настоящего и связывать всё это, не смешивая (стр. 720). Ядро способности — устойчивая, реалистичная, непрерывная идентичность и объёмные образы других (стр. 720).","s5":"Сохраняет цельное чувство себя в разных ролях и видит других сложными: с сильными и слабыми сторонами одновременно.","s3":"В целом цельный, но под сильным чувством картина упрощается или раскалывается на «только хорошее / только плохое»; в поверхностных контактах держится лучше, чем в близких.","s1":"Опыт раздроблен или жёстко разложен по ячейкам, себя и других человек путает, оценки полярны и нестабильны, страдает тестирование реальности.","stress":"На уровне 3 восприятие сужается и упрощается, особенно под стрессом. Сильные чувства и желания дают временную фрагментацию или поляризацию, то есть расщепление (стр. 721). Способность лучше работает в менее близких отношениях (стр. 721). **Чувствительность: средняя (w = 0.45).** ◆ Это структурная, медленная способность. Под стрессом она проседает не сразу, а при сильном аффекте в значимых отношениях.","w":0.45,"wave":3,"rec":"slow","styles":"narc — внешне цельный, но поляризованный образ себя и неинтегрированный образ других (стр. 721); schiz — наоборот, тонкое видение других при неинтегрированном опыте себя (стр. 721); dysreg — нет непрерывности себя и других, при расстройстве всё чёрно-белое (стр. 697); para — смешение мысли и действия (стр. 691) ◆; diss (справочно) — диссоциация разрывает непрерывность «я» (стр. 428) ◆.","age":"*Дети:* чувство себя хрупкое и строится через идентификацию с родителями; есть риск «ложного Я», то есть подстройки под чужие желания (стр. 152, 177). *Подростки:* построение идентичности — центральная задача возраста; баллы 4–5 ожидаются только к поздней юности или ранней взрослости (стр. 430). *Пожилые:* в старости идентичность не создаётся заново; потеря ресурсов и зависимость от других могут её ослабить (стр. 910).","signs":["позиция совпадает с мнением того, с кем человек говорил последним;","коллег описывает одним словом или в крайностях («гений», «ничтожество»);","на вопрос «а вы сами чего хотите?» теряется или отвечает пустотой."],"tools":"Индексы связности AAI (стр. 734); домен идентичности STIPO-R (стр. 735–736); подшкала «проблемы идентичности» PAI-BOR (стр. 736). Для подростков — AIDA, SCORS-G (стр. 450).","quiz":{"q":"Новый директор по развитию за два месяца трижды меняет позицию по стратегии, и каждый раз она совпадает с мнением того, с кем он говорил последним. На вопрос \"а как видите вы?\" теряется. Коллег описывает одним словом: \"нормальный\", \"сложная\"».","a":5,"o":[13,6,7],"why":"нет устойчивого «я», позиция заимствуется у собеседника, образы других бедные (стр. 720–721). С агентностью (13) это не главное: неясно не «как действовать», а «кто я в этом»."}},{"n":6,"id":"esteem","name":"Регуляция самооценки","short":"Самооценка","line":"Реалистичное и устойчивое чувство своей ценности","en":"Capacity to Regulate Self-Esteem","domain":"идентичность и отношения","pages":"стр. 721–722","what":"Общее ощущение собственной ценности: реалистичное, без завышения и занижения, с уверенностью, которая меняется соразмерно ситуации (стр. 721–722). Сюда входит и умение относиться к себе с состраданием при неудаче (стр. 721).","s5":"Устойчиво чувствует себя «достаточно хорошим»: неудачу и критику переживает с огорчением, но без самоуничтожения и без поиска виноватых.","s3":"Обычно в порядке, но сильные чувства и стресс раскачивают самооценку, и её приходится подпирать завистью, обидой и перекладыванием вины или, наоборот, стыдом и самокритикой.","s1":"Самооценка раздута до превосходства, разрушена до ничтожности или качается между этими полюсами; достижения не радуют, а неудача вызывает ярость к другим или беспощадную атаку на себя.","stress":"На уровне 5 самооценка устойчива и в стрессе, и в конфликте. На уровне 3 её расшатывают сильные эмоции и стрессовые ситуации, отсюда заметные колебания (стр. 722). Высокая сознательная самооценка может прикрывать низкую бессознательную, и наоборот (стр. 722). **Чувствительность: средняя (w = 0.65).** ◆ Сильно зависит от вида триггера: критика, ошибка на виду, отвержение, успех.","w":0.65,"wave":2,"rec":"slow","styles":"narc — самооценке нужны постоянные внешние подтверждения, она защищается идеализацией и обесцениванием (стр. 688–689); dep_r — самокритика и недостижимые стандарты (стр. 667); masoch — моральный мазохизм, ценность через страдание (стр. 671); obs — самооценка держится на «думании» или «делании» (стр. 680) ◆; depend — чувство никчёмности (стр. 673) ◆.","age":"*Дети:* здоровая самооценка звучит как «я хороший, но не всегда лучше всех». На низком уровне ребёнок защищается всемогуществом и отрицанием в фантазии (стр. 179–180). *Подростки:* самый трудный для самооценки период, она сильно зависит от сверстников (стр. 431). *Пожилые:* самооценка держится на принятии старения и ощущении, что ещё справляешься. Её подтачивают ослабление зрения, слуха, движений и зависимость от других (стр. 911).","signs":["реакция на критику несоразмерна, например неделя «я самозванец» после одного отзыва;","постоянно нужно подтверждение статуса;","собственные достижения не радуют."],"tools":"Шкала нарциссизма в STIPO-R (стр. 736). Для подростков — RSES, SPPA (стр. 450–451).","quiz":{"q":"Опытный консультант после одного резкого отзыва клиента неделю называет себя \"самозванцем\" и отменяет встречи. После аплодисментов на конференции он говорит коллегам, что \"в этой нише равных нет\". В остальное время с людьми ровен, в работе последователен».","a":6,"o":[5,2,11],"why":"ощущение своей ценности качается вслед за внешней оценкой (стр. 722). Идентичность (5) и ценности (11) устойчивы, а аффект сам по себе не хаотичен (2)."}},{"n":7,"id":"trust","name":"Доверие, эмпатия и близость","short":"Близость","line":"Глубокие, взаимные отношения и доверие","en":"Capacity for Trust, Empathy, and Intimacy","domain":"идентичность и отношения","pages":"стр. 723–724","what":"Качество отношений: их глубина и устойчивость, умение доверять людям и информации от них (эпистемическое доверие), сопереживать и регулировать дистанцию (стр. 723). Включает умение и принимать поддержку, и оказывать её, а также связь сексуальности с близостью (стр. 723).","s5":"Отношения глубокие и взаимные; человек доверяет избирательно, может и приблизиться, и отойти, и сохраняет эмпатию даже в сильных чувствах.","s3":"Близость возможна, но гнев, стыд или страх разлуки её рушат: человек уходит в себя, действует назло или «прилипает», бывает то недоверчив, то неразборчиво доверчив.","s1":"Отношения поверхностные и потребительские, эмпатии нет или она служит манипуляции; другим либо не доверяют вовсе, либо доверяют слепо и становятся лёгкой добычей.","stress":"На уровне 5 близость и эмпатия сохраняются при сильных чувствах и стрессе. На уровне 3 их нарушают гнев, стыд и тревога разлуки, и в стрессе человек отдаляется, отыгрывает или становится чрезмерно зависимым (стр. 724). **Чувствительность: средняя (w = 0.60).** ◆ Реагирует на триггеры привязанности (reject, attach, intrude, secret) и восстанавливается через живой контакт.","w":0.6,"wave":2,"rec":"rel","styles":"- para — «ужас доверия», ожидание унижения (стр. 691);\n  - schiz — близость переживается как поглощение и вторжение (стр. 681);\n  - narc — дефицит близости, эмоциональный уход от других (стр. 688–689);\n  - psychop — эмпатии нет, хотя чужие состояния считываются точно (стр. 693);\n  - sadist — другие как объекты (стр. 695);\n  - hyst — внушаемость, привязанность интенсивная и одновременно поверхностная (стр. 687);\n  - depend — наивность, легко поддаётся влиянию (стр. 673);\n  - hypom — бегство от отношений, которые вызывают зависимость (стр. 670);\n  - masoch — отношения подчинения и провокации (стр. 671) ◆;\n  - cphob — избегает просить о помощи (стр. 677) ◆.","age":"*Дети:* способность оценивают по отношениям со взрослыми, сверстниками и самим клиницистом (перенос и контрперенос). На уровне 3 — эмоциональная зависимость и сверхуступчивость (стр. 180–181, 185). *Подростки:* привязанность смещается от родителей к сверстникам. Подросток ищет баланс между бдительностью и доверием, и есть риск как чрезмерной недоверчивости, так и доверчивости (стр. 434). *Пожилые:* потери слуха и зрения сужают контакты. Когнитивная эмпатия может снижаться, а эмоциональная — сохраняться или даже расти (стр. 912).","signs":["в конфликте обрывает связь («только письма», «сам справлюсь») или, наоборот, засыпает звонками;","не может принять помощь или не может её оказать;","доверяет либо никому, либо первому уверенному голосу."],"tools":"AAI (стр. 734); пункты SWAP о близости и эмпатии (стр. 734); подшкала «негативные отношения» и межличностные шкалы PAI (стр. 736); PRQ и TRQ — для отношений в терапии (стр. 737–738). Для подростков — ETMCQ (эпистемическое доверие), BES (стр. 451).","quiz":{"q":"После конфликта с куратором руководительница филиала месяц общается с ним только письменно и отказывается от помощи: \"сама разберусь\". Когда куратор уходит в отпуск, она звонит ему по пять раз в день».","a":7,"o":[6,8,13],"why":"под стрессом дистанция не регулируется — уход сменяется прилипанием, а поддержку невозможно принять (стр. 724)."}},{"n":8,"id":"impulse","name":"Регуляция импульсов","short":"Импульсы","line":"Сдерживать и гибко направлять побуждения","en":"Capacity for Impulse Regulation","domain":"защиты и совладание","pages":"стр. 724–725","what":"Умение сдерживать и направлять побуждения: выражать желания гибко и в рамках культуры, а при необходимости откладывать их (стр. 724). Нарушения бывают двух видов: несдержанная импульсивность или жёсткий сверхконтроль с обеднением чувств (стр. 724).","s5":"Побуждения выражаются вовремя и в подходящей форме, а отложить желаемое человек может без драмы.","s3":"В целом владеет собой, но в нагруженных отношениях (партнёр, начальник, семья) или в гневе, печали, страхе отвержения срывается или, наоборот, всё зажимает.","s1":"Контроля почти нет (вспышки, саморазрушение, агрессия) или он тотальный, с внезапными прорывами, а то и качается между запретом и безоглядным действием.","stress":"На уровне 5 контроль сохраняется и под стрессом. На уровне 3 трудности возникают в конкретных напряжённых отношениях — с партнёром, руководителем, родственниками — и в состояниях гнева, печали, страха отвержения (стр. 725). **Чувствительность: высокая (w = 0.70).** ◆ Падает вслед за ментализацией: на уровне 5 ментализация помогает сдерживать импульсы, на уровне 3 появляется склонность к отыгрыванию (стр. 718). Резко усиливается алкоголем и усталостью ◆.","w":0.7,"wave":2,"rec":"fast","styles":"PDM-3 прямо называет полюса: dysreg и hyst — недостаток контроля, obs — сверхконтроль (стр. 725). Кроме того: psychop — слабый контроль импульсов (стр. 693); hypom — вещества, гиперсексуальность (стр. 670); cphob — поиск опасности (стр. 678). У подростков PDM-3 связывает дефицит этой способности с контрфобическими и гипоманиакальными установками (стр. 437).","age":"*Дети:* научиться контролировать импульсы — главное достижение первого десятилетия жизни (стр. 186). *Подростки:* префронтальная кора ещё незрела, а лимбическая система уже зрелая, отсюда пик риска; к 17–19 годам импульсивность снижается (стр. 437–438). *Пожилые:* прежние паттерны недо- и сверхконтроля могут усиливаться, а при нейрокогнитивном расстройстве нарушения тяжёлые (стр. 913).","signs":["решения «сгоряча», которые потом отменяются;","резкие письма, траты, демонстративный уход с совещания;","или наоборот: «железный» самоконтроль без единого живого желания, а потом внезапный срыв."],"tools":"Пункт SWAP о колебании между недо- и сверхконтролем (стр. 734); подшкала самоповреждения PAI-BOR (стр. 736); STIPO-R — домен управления сексуальными, зависимыми и агрессивными мотивами (стр. 736). Для подростков — BIS-11-A, UPPS (стр. 451).","quiz":{"q":"Коммерческий директор, получив отказ крупного клиента, в тот же вечер без согласования снижает цены на 40% для всей базы и рассылает письмо партнёрам. Утром всё отменяет и не понимает, \"зачем так сделал\"».","a":8,"o":[1,2,10],"why":"поступок совершён вслед за побуждением, без учёта последствий (стр. 724–725). Планирование (1) в обычном режиме сохранно, и речь о действии, а не только о чувстве (2)."}},{"n":9,"id":"defense","name":"Защитное функционирование","short":"Защиты","line":"Справляться с тревогой и болью без искажений","en":"Defensive Functioning","domain":"защиты и совладание","pages":"стр. 725–727","what":"Привычные способы справляться с тревогой, стыдом, горем и конфликтами — набор защит от зрелых до психотических (стр. 725). Чем выше уровень, тем меньше защиты искажают реальность и тем лучше позволяют одновременно чувствовать и думать (стр. 725). Подробнее — гл. 12 и иерархия DMRS (стр. 657–660, 735).","s5":"Преобладают зрелые защиты (юмор, антиципация, сублимация, аффилиация); невротические появляются ненадолго и уходят, когда напряжение спадает.","s3":"В стрессе проблема видится снаружи, а свой вклад не замечается: в ход идут отрицание, рационализация, проекция, идеализация, обесценивание, всемогущество, на пике — более примитивные защиты.","s1":"Человек охвачен страхом распада или гибели, реальность грубо искажается (бредовая проекция, психотическое отрицание, фрагментация), и даже в спокойные периоды держатся расщепление и проективная идентификация.","stress":"Набор защит зависит от активного конфликта, настроения, тревоги и физического состояния. Под сильным стрессом может ухудшиться даже устойчивое защитное функционирование (стр. 726). Уровень 5 возвращается к зрелым защитам, когда стресс спадает; уровень 3 на пике стресса откатывается к незрелым (стр. 726). Уровень 1 при росте конфликта уходит в проективную идентификацию и ниже (стр. 727). **Чувствительность: высокая (w = 0.80).** ◆ По сути, это та же ось «глубины защит», которая уже есть в симуляторе атласа.","w":0.8,"wave":2,"rec":"rel","styles":"para — личность организована вокруг проекции (стр. 691); dysreg — расщепление, проекция, проективная идентификация (стр. 696); psychop — проекция, обесценивание, отрицание, отреагирование (стр. 692) ◆; narc — идеализация и обесценивание (стр. 689) ◆. ◆ В симуляторе защиты у всех стилей сдвигаются вниз по DMRS, а стиль определяет, какие именно включаются.","age":"*Дети:* отрицание и проекция нормальны в раннем детстве, но позже указывают на патологию. В 4–6 лет часты расщепление и защиты действием (стр. 189, 191). *Подростки:* незрелых защит становится меньше, зрелых — больше. В средней юности усиливаются нарциссические защиты (идеализация, обесценивание, всемогущество). Мальчики чаще используют навязчивые защиты и защиты действием, девочки — невротические (стр. 439–440). *Пожилые:* гибкость защит снижается; утраты, болезни и нужда в помощи могут запустить расщепление (стр. 913).","signs":["видит ли человек свой вклад в проблему;","меняется ли репертуар под нагрузкой: юмор → поиск виноватых → «все враги»;","в рассказе о трудностях чувства признаются или устраняются."],"tools":"DMRS, DMRS-Q, DMRS-SR-30 (стр. 735); домен защит в STIPO-R (стр. 735–736). Для подростков — DSQ, REM-71 (стр. 451).","quiz":{"q":"В спокойные месяцы директор шутит над своими промахами и первым признаёт ошибки. В кризис \"во всём виноваты регионы и рынок\", вчерашний любимый заместитель становится \"пустым местом\", а обсуждать свою роль директор отказывается. Через месяц после стабилизации снова иронизирует над собой».","a":9,"o":[5,6,12],"why":"под нагрузкой репертуар сдвигается от зрелых защит (юмор, самонаблюдение) к экстернализации и обесцениванию, а когда стресс спадает, возвращается (стр. 726)."}},{"n":10,"id":"adapt","name":"Адаптация и устойчивость","short":"Адаптация","line":"Приспосабливаться к переменам и выдерживать потери","en":"Capacity for Adaptation and Resiliency","domain":"защиты и совладание","pages":"стр. 727–728","what":"Умение приспосабливаться к неожиданному и меняющемуся (адаптация) и выдерживать тяжёлые, даже травматические события, сохраняя способность расти (устойчивость) (стр. 727). Это не конформизм: адаптация может быть необычной и творческой, а принятие неизбежного — не капитуляция (стр. 727).","s5":"В неопределённости и потерях человек сохраняет ясность мысли и отношения: переживает печаль и тревогу, но действует, опирается на свои сильные стороны и способен принять неудобную правду.","s3":"В обычной жизни справляется, но под стрессом мышление и отношения проседают; трудно принять, что неопределённость и потери — часть жизни, отсюда протест, пессимизм, пассивность или злость.","s1":"Даже без стресса нет ощущения благополучия, преобладают безнадёжность, пустота и внутренний хаос, а из трудностей невозможно извлечь опыт.","stress":"По определению это способность работать с нагрузкой. На уровне 3 неопределённость, утрата и стресс дают заметный спад общего функционирования (стр. 728). На уровне 1 неблагополучие есть даже без стрессоров (стр. 728). **Чувствительность: средняя (w = 0.55).** ◆ В симуляторе её удобнее использовать как буфер: чем выше балл 10, тем медленнее падают остальные способности (см. D3).","w":0.55,"wave":3,"rec":"slow","styles":"depend — дезорганизация, когда приходится опираться на собственные ресурсы (стр. 673); anxav — жизнь сужается ради избегания опасности (стр. 678); dep_r — утрата и отвержение как центральная тема (стр. 667) ◆; dysreg — катастрофизация (стр. 697) ◆.","age":"*Дети:* сама диагностика для ребёнка — стресс, и то, как он к ней приспосабливается, информативно; велика роль взрослых (стр. 193). *Подростки:* в 12–14 лет события кажутся неподконтрольными, часты уход и беспомощность; к 17–19 годам появляются открытость и любопытство к трудностям (стр. 442). *Пожилые:* переезд в учреждение — особый вызов. «Устойчивый ответ» может означать жизнь на более низком, но стабильном уровне (стр. 914).","signs":["на реорганизацию, слияние или смену правил отвечает поиском возможностей или «всё пропало»;","в кризисе использует или теряет свои сильные стороны;","есть ли вообще периоды благополучия."],"tools":"Пункты здорового функционирования SWAP — 24 из 200 (стр. 733). Для подростков — READ, RSCA, ER89-R (стр. 452).","quiz":{"q":"После слияния компаний начальник отдела, прежде эффективный, полгода повторяет: \"всё пропало\". На новые правила он отвечает то саботажем, то пассивным \"как скажете\", своими сильными сторонами не пользуется и новых возможностей не видит».","a":10,"o":[13,9,1],"why":"перемены и неопределённость не принимаются как часть жизни, отсюда протестный, пессимистичный или пассивный настрой (стр. 728)."},"buffer":true},{"n":11,"id":"ideals","name":"Внутренние стандарты и идеалы","short":"Идеалы","line":"Внутренняя мораль и ценности как ориентир","en":"Capacity to Construct and Use Internal Standards and Ideals","domain":"инсайт и самонаправленность","pages":"стр. 728–730","what":"Личная мораль: усвоенные ценности и идеалы, с которыми человек сверяет поступки, а вина и стыд служат сигналами расхождения (стр. 728). В психоаналитических терминах — суперэго и Я-идеал (стр. 728).","s5":"Ценности гибкие, реалистичные и свои; вина и стыд умеренные и служат поводом пересмотреть поведение, к себе и другим человек относится с сочетанием сострадания и критики.","s3":"Стандарты то жёсткие и буквальные, то меняются вместе с выгодой; вина переживается как парализующая самокритика или отрицается.","s1":"Мораль либо тираническая, либо отсутствует: агрессивная уверенность в своём превосходстве или лёгкое оправдание разрушительных поступков без раскаяния.","stress":"Моральное поведение может колебаться, особенно в стрессе и конфликте (стр. 729). **Чувствительность: низкая (w = 0.30).** ◆ Это черта, а не состояние. В остром стрессе видны двойные стандарты или усиление самобичевания, но сама система ценностей меняется медленно.","w":0.3,"wave":4,"rec":"chronic","styles":"psychop — нет морального «центра тяжести» и раскаяния (стр. 693); sadist — доминирование с азартом и без вины (стр. 695); obs — жёсткая карающая совесть (стр. 679); dep_r — недостижимые стандарты и самообвинение (стр. 667); narc — на низких уровнях нет внутренней морали (стр. 688); masoch — моральное превосходство через страдание (стр. 671) ◆. При злокачественном нарциссизме PDM-3 советует оценивать эту способность отдельно (стр. 722).","age":"*Дети:* оценивают, насколько суперэго жёсткое, ригидное или слабое: например, ребёнок рвёт готовую работу или берёт чужое без вины (стр. 194). *Подростки:* путь от морали «по последствиям» (12–14 лет) через давление сверстников (15–16) к собственному «моральному компасу» (17–19) (стр. 443–444). *Пожилые:* возможна моральная ригидность как защита от быстрых перемен или, наоборот, свобода от норм (стр. 915).","signs":["строг к другим и снисходителен к себе;","годами винит себя за мелкую ошибку или не чувствует вины после явного вреда;","ценности меняются вместе с выгодой."],"tools":"Домен ценностей в STIPO-R (стр. 736); PAI-ANT (стр. 736). Для подростков — DIT2, PCL:YV (стр. 452).","quiz":{"q":"Руководитель закупок спокойно говорит, что \"откаты — нормальная практика, все так делают\", и не смущается, когда это всплывает. При этом он публично отчитывает подчинённых за опоздания как за \"непорядочность\"».","a":11,"o":[7,9,6],"why":"ценности не интегрированы и подчинены выгоде, двойной стандарт не вызывает вины (стр. 729). Рационализация (9) здесь только форма, а мишень — сама моральная система."}},{"n":12,"id":"inner","name":"Исследование внутренней жизни","short":"Внутренняя жизнь","line":"Интерес к своим мыслям, чувствам и мотивам","en":"Capacity to Explore One's Inner Life","domain":"инсайт и самонаправленность","pages":"стр. 730–731","what":"Интерес и умение заглядывать в себя: замечать связи между чувствами, мотивами, мыслями и поступками, нынешними и прошлыми. Сюда входит психологическая проницательность, или «наблюдающее Я» (стр. 730). Это не чисто интеллектуальная способность: в ней есть живое чувство и любопытство, а материалом служат ассоциации и сны (стр. 730).","s5":"Видит повторяющиеся сюжеты своей жизни, может остановиться и подумать даже в разгар сильного переживания, открыт к фантазиям и снам.","s3":"Кое-что о себе понимает, но под стрессом эта способность колеблется и гаснет, а сны конкретные и бедные на символы.","s1":"Не видит связей между чувствами, мыслями и поступками и не интересуется ими; в сильном аффекте отыгрывает или диссоциирует, сны путает с реальностью.","stress":"На уровне 5 способность сохраняется даже под стрессом, на уровне 3 колеблется или ухудшается (стр. 730). После травматических и болезненных событий сны могут смешиваться с реальностью (стр. 730–731). На уровне 1 сильный аффект ведёт к примитивным защитам, отыгрыванию, диссоциации (стр. 731). **Чувствительность: средняя (w = 0.65).** ◆ Падает вслед за ментализацией, а возвращается медленнее: нужна не только безопасность, но и пауза.","w":0.65,"wave":2,"rec":"rel","styles":"psychop — нет психологического инсайта (стр. 693); somat — «оперативное мышление», бедная фантазия (стр. 684); cphob — страх не признаётся и проецируется (стр. 678) ◆; para — винит других и не видит своего вклада (стр. 691) ◆; obs — инсайт бывает чисто интеллектуальным, без чувства (ср. стр. 679, 730) ◆. **Сильная сторона:** высокофункциональный schiz бывает поразительно осведомлён о своей внутренней жизни (стр. 682).","age":"*Дети:* примерно до 10 лет внутренний мир исследуется через игру и фантазию; совсем простые стереотипные сюжеты — признак низкого уровня (стр. 197). *Подростки:* в 12–14 лет нужна помощь взрослых, в 15–16 происходит заметный скачок интроспекции (стр. 445). *Пожилые:* самонаблюдение может расти благодаря опыту; под давлением оно пропадает, но возвращается, когда стресс снижается (стр. 916).","signs":["на повторяющийся сценарий отвечает «просто не везёт с начальниками»;","нет любопытства к собственным реакциям;","не связывает сегодняшнюю реакцию с прошлым опытом."],"tools":"SWAP Insight Scale — 6 пунктов SWAP-200 (стр. 733). Для подростков — TAS-20, PMS, B-MAS-A (стр. 452).","quiz":{"q":"Сотрудник в третий раз увольняется через полгода после прихода нового руководителя. На вопрос коуча, что повторяется, отвечает: \"Просто не везёт с начальниками\", и говорить о своих реакциях ему неинтересно. При этом в текущих разговорах он хорошо понимает, что чувствуют коллеги».","a":12,"o":[3,10,13],"why":"нет интереса к сюжетам, которые во времени связывают чувства, мотивы и поведение (стр. 730–731). Ментализация «здесь и сейчас» (3) сохранна."}},{"n":13,"id":"agency","name":"Агентность и цель","short":"Агентность","line":"Авторство своей жизни, цели и самоэффективность","en":"Capacity for Agency and Purpose","domain":"инсайт и самонаправленность","pages":"стр. 731–732","what":"Чувство авторства своей жизни («это сделал я»), внутреннего контроля и самоэффективности и связная история о себе, которая придаёт выборам смысл (стр. 731). Сюда же относятся забота о следующих поколениях, способность к росту и система идеалов, в том числе духовных (стр. 731).","s5":"Ощущает себя автором своих решений, видит смысл и цель, смотрит шире сиюминутного и встраивает в историю роста и хорошее, и болезненное прошлое.","s3":"В спокойные периоды чувство авторства есть, но в стрессе, боли или конфликте теряется; смысл перемешан с сомнениями, а взгляд за пределы себя требует усилия.","s1":"Нет направления и цели, прошлое выглядит набором разрозненных эпизодов, жизнь будто управляется извне, и смысл иногда ищется в жёстких внешних системах.","stress":"На уровне 3 чувство агентности есть, кроме стрессовых, болезненных и конфликтных обстоятельств (стр. 732). **Чувствительность: низкая (w = 0.35).** ◆ В остром стрессе падает чувство контроля, при хроническом размывается смысл; сам нарратив меняется медленно.","w":0.35,"wave":4,"rec":"chronic","styles":"depend — благополучие держится на связи в ущерб собственной агентности (стр. 672); masoch — поведение против собственного блага (стр. 670) ◆; dep_r — ощущение бессмысленности жизни (Box 12.1, стр. 669) ◆; somat — бессилие перед внешними силами (стр. 685) ◆.","age":"*Дети:* агентность — это способность выбирать и направлять своё поведение. На низком уровне ребёнок либо пассивно следует чужим установкам, либо игнорирует советы взрослых (стр. 199, 201). *Подростки:* если развитие задерживается, появляются торможение, самосаботаж или некритичная приверженность идеологиям (стр. 447). *Пожилые:* важны «вовлечённость», принятие конечности, роль мудрого старшего. При утрате агентности — отчуждение и бессмысленность или маниакальное отрицание (стр. 916–917).","signs":["карьера описывается как «так получилось», без собственных выборов;","не может назвать свои цели на несколько лет вперёд;","чувствует, что всё решают другие, или некритично держится за «единственно верное учение»."],"tools":"В гл. 13 отдельный инструмент не назван. Для подростков — SWAP-II-A, FOS, ALGPS, DFS-2 (стр. 452–453).","quiz":{"q":"Талантливый продакт-менеджер говорит: \"Карьера просто случилась, меня всегда кто-то двигал\". Назвать цель на пять лет он не может, прошлые места работы описывает как не связанные эпизоды. Самооценка ровная, с людьми ладит, своё мнение по рабочим вопросам имеет».","a":13,"o":[5,10,6],"why":"нет чувства авторства и связной истории, которая придаёт выборам смысл (стр. 731–732). Своё мнение у него есть, так что идентичность (5) сохранна, а самооценка (6) в порядке."}}],"MLEVELS":[{"code":"M1","range":"58–65","name":"Здоровое, оптимальное функционирование","d":"Почти все способности работают гибко. Разница между ситуациями небольшая и понятная.","p":"здоровый"},{"code":"M2","range":"51–57","name":"Хорошее функционирование с отдельными трудностями","d":"Надёжная база. Трудности точечные (3–4 способности) и связаны с конкретным конфликтом или жизненным периодом.","p":"невротический"},{"code":"M3","range":"43–50","name":"Лёгкие нарушения","d":"Появляются негибкие зоны. Самооценка, импульсы, аффект, защиты или самонаблюдение работают узко и предсказуемо однообразно.","p":"невротический"},{"code":"M4","range":"36–42","name":"Умеренные нарушения","d":"Ограничения есть в большинстве областей. Страдают устойчивость отношений, чувство «я» и переносимость чувств. С этого уровня начинается пограничный диапазон.","p":"пограничный"},{"code":"M5","range":"28–35","name":"Выраженные нарушения","d":"Почти все функции заметно сужены. Есть склонность к распаду переживания и смешению себя с другим. Любовь, работа и игра переживаются бедно.","p":"пограничный"},{"code":"M6","range":"21–27","name":"Значительные дефекты базовых функций","d":"Дефициты в большинстве областей. Образы себя и других плохо организованы и плохо отделены друг от друга.","p":"пограничный"},{"code":"M7","range":"13–20","name":"Тяжёлые дефекты базовых функций","d":"Тяжёлые дефициты почти везде. Нарушено тестирование реальности, сбоят восприятие, память, суждение, регуляция мыслей и чувств.","p":"психотический"}],"M_INTRO":"- M-ось — это 13 базовых психических способностей. P-ось отвечает на вопрос «как устроена личность», M-ось — «насколько хорошо работают её отдельные функции» (стр. 709–710). У двух людей с одинаковой пограничной организацией профиль M может быть разным (стр. 710). M-ось связывает P-ось (личность) и S-ось (переживание симптомов) (стр. 710).\n- Для атласа это слой состояния ◆. P-ось задаёт черту (стиль и уровень), M-профиль показывает, что происходит под нагрузкой. Почти у всех 13 способностей описание балла 3 построено одинаково: способность есть, но проседает при стрессе, конфликте или сильном чувстве (стр. 714–732). На этом и строится механика симулятора.\n- 4 домена (стр. 711–712): **когнитивные и аффективные процессы** (1–3) · **идентичность и отношения** (4–7) · **защиты и совладание** (8–10) · **инсайт и самонаправленность** (11–13).\n- Каждая способность оценивается по шкале от 1 до 5. В главе 13 описаны опорные баллы 5, 3 и 1 (стр. 711). В бланке PDC-3 подписаны все пять: 5 — здоровое функционирование, 4 — лёгкие нарушения, 3 — умеренные, 2 — выраженные, 1 — тяжёлые дефициты (стр. 1027). Сумма даёт от 13 до 65 баллов и уровень M1–M7 (стр. 738).\n- Связь с уровнями P (стр. 738): здоровый = **M1**; невротический = **M2–M3**; пограничный = **M4–M6** (от умеренных нарушений к значительным дефектам); психотический = **M7**.\n\n> **Расхождение диапазонов в книге.** В Табл. 13.1B (стр. 739–740) стоит M3 42–50, M4 36–41, M5 22–35, и M5 перекрывается с M6 (21–27). В аналогичных таблицах для детей, подростков и пожилых (стр. 204, 454, 919) M3 43–50 и M4 36–42, но M5 там тоже 22–35. Только в бланке PDC-3 (стр. 1027) шкала непрерывна и без перекрытий: **M1 58–65 · M2 51–57 · M3 43–50 · M4 36–42 · M5 28–35 · M6 21–27 · M7 13–20**. **В атласе используем диапазоны бланка PDC-3.** В том же бланке есть ещё одна опечатка: написано «сумма 11 функций» вместо 13 (стр. 1027).\n\n---","DOMAINS":[["Когнитивные и аффективные процессы",[1,2,3]],["Идентичность и отношения",[4,5,6,7]],["Защиты и совладание",[8,9,10]],["Инсайт и самонаправленность",[11,12,13]]],"QUIZ":{"def":[{"q":"«Да, меня не взяли. Если честно, там и платят мало, и расти некуда».","a":"rationalization","o":["denial","intellectualization","devaluation"],"why":"Находится приемлемое объяснение, которое снимает боль отказа; настоящее чувство (обида) остаётся в тени."},{"q":"Получив разнос от собственника, директор весь день срывается на стажёрах.","a":"displacement","o":["projection","actingout","turning"],"why":"Гнев переадресован более безопасному объекту."},{"q":"Ровным голосом: «Отец умер, когда мне было двенадцать. Это просто факт биографии».","a":"isolation","o":["denial","repression","suppression"],"why":"Событие помнится, а чувство к нему отделено."},{"q":"Месяц назад новый директор был «гением, который всех спасёт», сегодня — «пустое место».","a":"devaluation","o":["rationalization","projection","reaction"],"why":"Идеализация сменилась обесцениванием: оттенков между «всё» и «ничто» нет."},{"q":"«Это не я на вас злюсь — это вы на меня злитесь».","a":"projection","o":["projid","denial","displacement"],"why":"Своё чувство приписано другому. Если бы другой и правда начал злиться под влиянием этого, речь шла бы о проективной идентификации."},{"q":"Клиент, ожидающий отвержения, держится так холодно, что консультант замечает у себя раздражение и желание поскорее закончить встречу.","a":"projid","o":["projection","devaluation","withdrawal"],"why":"Ожидание вызвано в другом: консультант начинает чувствовать и почти делать то, чего клиент боится."},{"q":"«Я пью как все. Никакой проблемы нет», — после третьего за месяц прогула.","a":"denial","o":["rationalization","suppression","repression"],"why":"Очевидная неприятная реальность не признаётся."},{"q":"Подчёркнуто сладкая любезность к коллеге, которого втайне терпеть не может.","a":"reaction","o":["suppression","isolation","undoing"],"why":"Неприемлемое чувство превращено в противоположное."},{"q":"После резкой ссоры — цветы, ужин и поведение, будто ничего не было.","a":"undoing","o":["reaction","denial","reversal"],"why":"Действие символически «отменяет» агрессию и вину за неё."},{"q":"«Отдел продаж — команда мечты, а бухгалтерия — сплошные враги».","a":"splitting","o":["projection","idealization","displacement"],"why":"Мир разделён на только хороших и только плохих."},{"q":"«Помню аварию, как будто смотрел на себя со стороны, всё было как в кино».","a":"dissociation","o":["isolation","repression","withdrawal"],"why":"Непереносимое переживание отщеплено: деперсонализация."},{"q":"Вместо разговора о разводе — увлечённая лекция о теории привязанности и стадиях горя.","a":"intellectualization","o":["rationalization","isolation","sublimation"],"why":"О чувствах говорят на языке понятий."},{"q":"Чувствуя гнев на мать, говорит: «Это я плохая дочь, не умею её порадовать».","a":"turning","o":["introjection","reaction","moralization"],"why":"Агрессия, адресованная другому, обращена на себя."},{"q":"Хирург после тяжёлой смены шутит о трудном случае с коллегами — и остаётся сочувствующим.","a":"humor","o":["denial","isolation","intellectualization"],"why":"Смешное найдено в тяжёлом без отрицания боли — зрелая защита."},{"q":"«Сейчас переговоры. Расстроюсь вечером, когда будет время».","a":"suppression","o":["repression","denial","isolation"],"why":"Переживание сознательно отложено, а не вытеснено."},{"q":"Перед встречей с инвестором проговорил самые неприятные вопросы и заранее прожил своё волнение.","a":"anticipation","o":["intellectualization","omnipotent","rationalization"],"why":"Трудное прожито заранее, вместе с чувствами."},{"q":"Вспыльчивость и соревновательность он направил в бокс и хирургию.","a":"sublimation","o":["displacement","actingout","reaction"],"why":"Импульс получил социально ценную форму."},{"q":"Вместо разговора об обиде — хлопает дверью и уходит в загул.","a":"actingout","o":["displacement","regression","passiveagg"],"why":"Чувство выражено действием, минуя осознание и слова."},{"q":"Руководитель уверен, что одним письмом «перевоспитает» весь коллектив, и злится, когда этого не происходит.","a":"omnipotent","o":["idealization","denial","projection"],"why":"Ощущение, что можно управлять всем, защищает от беспомощности."},{"q":"Не может вспомнить имя человека, который когда-то его унизил, хотя всех остальных из той компании помнит.","a":"repression","o":["suppression","denial","dissociation"],"why":"Болезненное удерживается вне сознания без сознательного усилия."},{"q":"Уверен, что соседи через розетки слушают его мысли.","a":"delproj","o":["projection","distortion","splitting"],"why":"Проекция стала непоколебимым убеждением, не поддающимся проверке."},{"q":"«Я обязан был так поступить — это вопрос принципа», — о решении, которое было ему очень выгодно.","a":"moralization","o":["rationalization","reaction","intellectualization"],"why":"Мотив переведён в категории долга. Рационализация искала бы «разумную» причину, морализация ищет «правильную»."},{"q":"Заболев, взрослый мужчина капризничает и требует, чтобы за ним ухаживали, как за маленьким.","a":"regression","o":["actingout","hrc","reversal"],"why":"Возврат к более ранним способам реагирования."},{"q":"На каждый совет: «Да, но…» — и снова жалобы.","a":"hrc","o":["passiveagg","denial","devaluation"],"why":"Просьба о помощи сочетается с отвержением любой помощи."},{"q":"На совещании соглашается со всеми решениями, а потом «не успевает» их выполнить.","a":"passiveagg","o":["undoing","suppression","hrc"],"why":"Несогласие выражено непрямо — через саботаж."},{"q":"Став руководителем, говорит с подчинёнными тем же унизительным тоном, каким когда-то говорил с ним его шеф.","a":"idaggressor","o":["identification","displacement","reversal"],"why":"Перенимает роль того, кто когда-то причинял боль и страх: это идентификация с агрессором, а не зрелая идентификация."},{"q":"«Этот срок мне не подходит. Предлагаю пятницу и вот почему», — спокойно говорит сотрудник на планёрке.","a":"selfassert","o":["passiveagg","rationalization","reaction"],"why":"Прямо и без атаки заявляет свой интерес (уровень 7)."},{"q":"«Кажется, я злюсь не на клиента, а на то, что не выспался», — говорит консультант и меняет тон.","a":"selfobs","o":["intellectualization","rationalization","isolation"],"why":"Замечает своё чувство и меняет поведение (уровень 7)."},{"q":"После мелкой опечатки в отчёте: «Я вообще ни на что не гожусь».","a":"devalself","o":["turning","devaluation","splitself"],"why":"Резкое принижение себя вместо признания других чувств (уровень 4)."},{"q":"«Если бы не я, компания давно бы закрылась», — говорит руководитель отдела из пяти человек.","a":"idealself","o":["omnipotent","idealization","denial"],"why":"Раздувание собственной значимости ради самооценки (уровень 4)."},{"q":"Утром менеджер считает себя лучшим в отделе, вечером — полным неудачником, и не замечает противоречия.","a":"splitself","o":["devalself","idealself","splitting"],"why":"Два несвязанных образа себя (уровень 2)."},{"q":"Перед каждым квартальным отчётом у финансиста начинается мигрень.","a":"somatization","o":["displacement","isolation","actingout"],"why":"Напряжение выражается через тело (вне DMRS)."},{"q":"Бывший новичок, которого в отделе «закаляли» жёсткими розыгрышами, через год сам первым устраивает новеньким «проверки на прочность».","a":"idaggressor","o":["identification","displacement","reversal"],"why":"Перенимает роль того, кто причинял боль."},{"q":"На фразу «давайте копнём глубже» сотрудник в остром состоянии берёт лопату.","a":"concretization","o":["denial","distortion","actingout"],"why":"Метафора понимается буквально (уровень 0)."},{"q":"Начинающий консультант перенимает у уважаемого наставника манеру задавать вопросы.","a":"identification","o":["idaggressor","introjection","sublimation"],"why":"Присвоение черт значимого другого; в PDM-3 — зрелая адаптация."},{"q":"Сотрудник, у которого раньше были психотические эпизоды, после реорганизации перестаёт реагировать на обращения: смотрит мимо, не отвечает, происходящее вокруг его будто не касается. Скорби или страха не видно.","a":"apwithdraw","o":["withdrawal","suppression","dissociation"],"why":"Полное отгораживание от контакта и реальности (уровень 0). Нужна помощь специалиста. Обычный «уход в себя» (withdrawal) контакт не обрывает."}],"lvl":[{"q":"Руководитель после провала проекта в первый день злится на себя и на команду, а через пару дней сам предлагает разбор и шутит: «Отличный материал для лекции о рисках».","a":"здоровый","o":["невротический","пограничный","психотический"],"why":"Чувство не отрицается, восстанавливается быстро, есть юмор и самонаблюдение."},{"q":"Сотрудница давно и хорошо работает, но каждый раз, когда нужно попросить повышения, «забывает» подготовить аргументы и потом ругает себя.","a":"невротический","o":["здоровый","пограничный","психотический"],"why":"Трудность ограничена одной сферой, есть внутренний конфликт и понимание своей роли (стр. 657)."},{"q":"Новый директор для менеджера за месяц прошёл путь от «спасителя» до «предателя». Сам менеджер то уверен в себе, то считает себя никем; дважды писал заявление и забирал его.","a":"пограничный","o":["невротический","психотический","здоровый"],"why":"Расщепление образов себя и других, нестабильные отношения, импульсивные действия (стр. 658–659)."},{"q":"Менеджер уверен, что бывшая коллега «на самом деле» его любит и подаёт тайные знаки. Её прямые отказы и письмо юриста он объясняет тем, что она «боится признаться», и продолжает её преследовать. Галлюцинаций нет.","a":"психотический","o":["пограничный","невротический","здоровый"],"why":"Дефицит тестирования реальности и неразличение себя и другого без явного психоза — пример самой PDM-3 (стр. 660)."},{"q":"Что, по PDM-3, отличает пограничный уровень от невротического, если невротики тоже используют примитивные защиты под стрессом?","a":"нехватка зрелых защит под стрессом","o":["наличие любых примитивных защит","сам факт сильных эмоций","наличие симптомов"],"why":"стр. 658."},{"q":"Какой домен НЕ входит в 4 домена уровня организации бланка PDC-3?","a":"регуляция самооценки","o":["идентичность","объектные отношения","тестирование реальности"],"why":"Четыре домена: идентичность, объектные отношения, уровень защит, тестирование реальности (стр. 1025)."},{"q":"Мигрант через два месяца после переезда кажется подозрительным и зависимым. Что сделать прежде, чем говорить о стиле?","a":"проверить роль ситуационного стресса и культуры","o":["поставить параноидный стиль","поставить пограничный уровень","оценить прототип зависимого"],"why":"стр. 654."},{"q":"Как PDM-3 сегодня объясняет происхождение уровня организации?","a":"сочетанием наследственности, темперамента, раннего опыта и привязанности","o":["фиксацией на стадии развития","только травмой","только воспитанием"],"why":"стр. 656."},{"q":"Шизоидный инженер функционирует на пограничном уровне, но спокоен и не хаотичен. Как называется такой вариант?","a":"«тихий пограничный»","o":["невротический шизоид","психотический уровень","эмоционально дисрегулированный"],"why":"стр. 656."},{"q":"Высокий пограничный уровень по сравнению с низким: что меняется в подходе?","a":"больше исследования и интерпретаций; на низком — больше поддержки и наращивания способностей","o":["одинаковый подход","на высоком только медикаменты","на низком только инсайт"],"why":"стр. 658."}],"sty":[{"q":"Руководитель проекта после провального запуска, в котором прежде всего виноват заказчик, неделю пишет «разбор моих ошибок», отказывается от бонуса и не может сформулировать ни одной претензии к заказчику; так было и после прошлых неудач","a":"dep_r","sub":"","o":["masoch","obs","depend"],"why":"Агрессия обращена на себя и не осознаётся; нет демонстрации страдания ради правоты или связи (masoch), борьбы за контроль и правила (obs), поиска опоры в сильном другом (depend)."},{"q":"Сильный методолог годами работал в паре с наставником. После ухода наставника из компании — апатия, пустота и «смысл пропал», хотя работа формально идёт; новые предложения встречает мыслью «без него это уже не то»","a":"dep_r","sub":"анаклитический","o":["depend","hypom","schiz"],"why":"Утрата переживается как безвозвратная потеря и пустота; зависимый искал бы нового покровителя и советов (стр. 484), гипоманиакальный ушёл бы в бурную активность, шизоидный держал бы дистанцию ещё до утраты."},{"q":"Через неделю после ухода основателя, своего многолетнего наставника, директор по развитию запускает три новых направления, спит по четыре часа, шутит на всех встречах и говорит, что «грустить некогда». Когда новый CEO предлагает ему стать ближайшим партнёром, он неожиданно объявляет об уходе в стартап","a":"hypom","sub":"","o":["narc","cphob","dysreg"],"why":"Подъём возникает в ответ на утрату и обрывается бегством от новой привязанности (стр. 670); нарциссический искал бы восхищения, контрфобический — опасности как вызова страху, дисрегулированный показал бы бури с яростью и самоповреждением. ◆ Короткий сон без усталости — повод исключить биполярный эпизод."},{"q":"Руководитель отдела продаж — душа компании, но за десять лет сменил семь работодателей и уходит каждый раз, когда «становится слишком по-семейному». На сессиях развлекает коуча историями, на вопрос о разводе отвечает анекдотом","a":"hypom","sub":"","o":["hyst","psychop","dep_r"],"why":"Обаяние и юмор защищают от печали и зависимости; у истерического в центре привлекательность и власть, психопатический использует других, депрессивный переживает печаль открыто."},{"q":"CEO на общем собрании хвалит менеджера проекта и объявляет о её повышении. Через неделю она «забывает» отправить ключевому клиенту договор, получает выговор — и, по словам коллег, впервые за месяц выглядит спокойной","a":"masoch","sub":"ищущий вреда","o":["dep_r","anxav","obs"],"why":"Облегчение после саморазрушительного поступка — маркер этого варианта (стр. 672); депрессивный винил бы себя без провокации, тревожно-избегающий отказался бы от повышения заранее, обсессивный изводил бы себя проверками, чтобы ошибки не случилось."},{"q":"Директор по персоналу берёт на себя все ночные дежурства в кризис, ежедневно напоминает, как мало спит, отказывается от предложенного помощника («справлюсь, как всегда») и публично стыдит тех, кто уходит в 18:00","a":"masoch","sub":"моральный","o":["obs","narc","depend"],"why":"Добродетель через страдание и скрытая жестокость к «нечистым» (стр. 671); обсессивный морализирует о правилах и порядке, нарциссический ищет восхищения не через жертву, зависимый держится за опору, а не за превосходство."},{"q":"Главный бухгалтер двенадцать лет работала с одним финансовым директором. После его ухода она не может утвердить ни одного платежа без нового руководителя, по нескольку раз в день пишет ему «правильно ли я поняла», приносит домашнюю выпечку; соглашается на сверхурочные, а потом «забывает» о сроках","a":"depend","sub":"","o":["dep_r","anxav","masoch"],"why":"Благополучие держится на фигуре руководителя, злость прорывается пассивно (стр. 673–674); анаклитически-депрессивный прятал бы тоску, а не искал советов открыто (стр. 484), тревожно-избегающий избегал бы контакта, мазохистический выставлял бы страдание напоказ."},{"q":"Операционный директор гордится тем, что «на мне всё держится», пять лет не был в отпуске и презирает коллег, которые просят помощи. При этом каждый вечер звонит бывшему наставнику обсудить решения, а дважды в год «срывает спину» и неделями лежит дома под опекой жены","a":"depend","sub":"контрзависимый","o":["schiz","cphob","narc"],"why":"Псевдонезависимость прикрывает скрытую зону зависимости и болезнь как «законный» повод получить заботу (стр. 675); шизоидный держит дистанцию, а не делает себя опорой для всех; контрфобический ищет опасности; нарциссический защищает величие, а не прячет потребность в заботе."},{"q":"Сильный аналитик отказывается возглавить отдел, потому что придётся раз в месяц выступать перед советом директоров. Перед каждой планёркой у неё болит живот, разговоры она часами прокручивает в голове; ей хочется дружить с командой, но на корпоративы она не ходит — «вдруг скажу глупость»","a":"anxav","sub":"","o":["schiz","depend","obs"],"why":"Хочет связи, но боится унижения — в отличие от шизоидного конфликта вокруг самой близости (стр. 935); не цепляется за опору (depend); сомнения связаны со стыдом, а не с борьбой за контроль (obs)."},{"q":"Руководитель логистики выстраивает работу команды так, чтобы ему не летать, объясняя это тем, что «в поезде продуктивнее»; отказывается от международного проекта; на вопрос коуча, что случится, если полететь, отвечает: «Просто не люблю»","a":"anxav","sub":"фобический","o":["cphob","obs","somat"],"why":"Тревога привязана к конкретной ситуации, избегание рационализировано (стр. 676, 936); контрфобический выбрал бы самый рискованный рейс, обсессивный спорил бы о регламентах, у соматизирующего тревога не осознаётся и выражается телом."},{"q":"Руководитель антикризисного штаба сам вызывается на каждую опасную площадку, смеётся над техникой безопасности, а после несчастного случая с коллегой говорит: «Со мной такого не будет». Команда постоянно за него тревожится; от коучинга он отказывается: «Мне помощь не нужна»","a":"cphob","sub":"","o":["psychop","hypom","narc"],"why":"Риск — способ отрицать страх, который «переселяется» в окружающих (стр. 678); психопатический использует других, гипоманиакальный бежит от печали, нарциссический — от стыда и за восхищением."},{"q":"Через месяц после серьёзной аварии основатель записывается в автоспорт и запускает самую рискованную продуктовую линию. К консультанту приходит по настоянию партнёра, держится иронично и снисходительно, говорить о страхе отказывается","a":"cphob","sub":"","o":["anxav","masoch","dysreg"],"why":"После травмы — движение навстречу опасности вместо избегания (anxav); мазохистический бессознательно провоцирует удар и испытывает облегчение после него (стр. 672), а контрфобический утверждает власть над страхом; нет аффективных бурь дисрегулированного."},{"q":"На стратегической сессии финансового директора спрашивают, что он чувствует по поводу сокращения своего отдела. Он отвечает двадцатью слайдами моделей затрат; на встречи с новым CEO стабильно опаздывает на пять минут и каждую реплику начинает с «да, но…»","a":"obs","sub":"","o":["schiz","para","narc"],"why":"Интеллектуализация вместо чувств и скрытое сопротивление авторитету (стр. 679–680); шизоидный ушёл бы в дистанцию, а не в спор, параноидный искал бы угрозу, нарциссический защищал бы самооценку."},{"q":"Менеджер по качеству ночами перепроверяет отчёты и не даёт команде закрыть релиз, пока всё не идеально. Когда руководитель ставит жёсткий срок, она внешне соглашается, а за час до дедлайна присылает сорок замечаний","a":"obs","sub":"компульсивный полюс","o":["anxav","masoch","depend"],"why":"Перфекционизм и конфликт подчинения и протеста (стр. 679–680); тревожно-избегающий избегал бы ситуации из страха унижения, мазохистический добивался бы страдания, у пассивно-агрессивного зависимого в центре враждебная зависимость, а не правильность и контроль."},{"q":"Ведущий архитектор данных отказывается руководить командой. На встречах один на один увлечённо рассказывает о средневековой картографии как метафоре своего проекта. После переезда в open space берёт долгий больничный; коллеги считают его холодным, но коучу он признаётся, что очень хочет быть кому-то нужным","a":"schiz","sub":"конфликтный","o":["anxav","obs","narc"],"why":"Близость опасна как вторжение и перегрузка, а не как унижение (anxav); внутренняя жизнь богата, чувства идут через метафору (стр. 682–683); нет борьбы за контроль (obs) и поддержания величия (narc)."},{"q":"Инженер лаборатории пишет отчёты с бесконечными отступлениями, описывает коллег только через их функции и не понимает, почему с ним конфликтуют; ровным голосом говорит, что «всю жизнь чужой», а иногда подозревает в письмах скрытый смысл","a":"schiz","sub":"дефицитарный шизоидно-шизотипический","o":["para","somat","anxav"],"why":"Устойчивая обеднённость связей и странности мышления (стр. 682); подозрительность вторична, а не организует личность (para); нужна поддерживающая структура, а не интерпретации (стр. 683)."},{"q":"Менеджер по логистике в третий раз за год уходит на больничный с мигренью — каждый раз за неделю до реорганизации; врачи ничего не находят. На вопрос HR, как она относится к переменам, отвечает: «Нормально, просто голова болит», а на фразу «может, это стресс?» резко обижается","a":"somat","sub":"","o":["anxav","depend","masoch"],"why":"Чувство не сформулировано и выражается телом (стр. 684); тревожно-избегающий осознаёт свою тревогу (стр. 676), зависимый искал бы опоры, мазохистический выставлял бы страдание ради правоты или связи."},{"q":"Немногословный главный инженер после смерти отца не взял ни одного дня отпуска. Через три недели — боли в груди, кардиолог патологии не находит. Консультант замечает, что разговоры с ним «мёртвые», сам он говорит: «Я не по чувствам, я по железу»","a":"somat","sub":"","o":["obs","schiz","dep_r"],"why":"Алекситимия и операциональное мышление, горе выражается телом (стр. 684); обсессивный интеллектуализирует и борется за контроль, у шизоидного богатая внутренняя жизнь (стр. 682), депрессивный переживал бы горе и вину осознанно. ◆ Соматическую причину исключают в первую очередь."},{"q":"Руководитель отдела продаж держится как герой голливудского фильма: эффектен, флиртует с влиятельными клиентками и с женщиной-директором, о сделках рассказывает как о драмах, путает цифры. Когда директор хвалит коллегу-мужчину, он раздавлен и старается «вернуть» её внимание; с давним другом по отделу у него тёплые ровные отношения.","a":"hyst","sub":"демонстративный","o":["narc","hypom","dysreg"],"why":"соревнование за внимание ограничено сферой пола и власти, а вне её он способен к тёплой устойчивой связи (стр. 686) — у нарциссического потребность в восхищении глобальна, у дисрегулированного нестабильны все отношения."},{"q":"Бухгалтер из консервативной семьи подчёркнуто скромна и «правильна», краснеет от любых разговоров о внешности, но копирует манеры харизматичного финдиректора и пересказывает о нём почти сказочные истории. Перед его визитами у неё немеют руки — врачи причины не находят; в отчётах «проваливаются» детали.","a":"hyst","sub":"сдержанный","o":["somat","anxav","depend"],"why":"за скромностью — тема пола и власти, идеализирующее подражание, мышление «по впечатлению» и конверсия (стр. 686–687); соматизирующего отличают алекситимия и бедность воображения (стр. 685)."},{"q":"Коммерческий директор требует отдельный кабинет и «особые» бонусы, при всех называет подчинённых бездарями, а на критику совета директоров отвечает стыдом и яростью и потом неделями ходит подавленный. Финансовых злоупотреблений нет, сделки чистые.","a":"narc","sub":"явный","o":["psychop","para","hypom"],"why":"мотив — удержать самооценку через восхищение и статус, с провалом в стыд и подавленность (стр. 688–690), а не власть ради власти и удовольствие от обмана, как у психопатического (стр. 692)."},{"q":"Тихий аналитик избегает выступлений и называет себя неудачником. На коуч-сессии выясняется: он уверен, что коллег повысили незаслуженно, а сам он «умнее всех в отделе»; просит научить его быть «как эти успешные».","a":"narc","sub":"скрытый","o":["dep_r","anxav","masoch"],"why":"за подавленностью — грандиозные фантазии о заслуженном статусе, который мир недодал (стр. 688–689); у депрессивного самокритика без скрытой грандиозности (стр. 667)."},{"q":"Начальник службы безопасности после реорганизации уверен, что закрытые встречи HR — заговор против него; объяснения воспринимает как попытку «держать его за дурака» и заранее пишет жалобы. В компании держится особняком и ни с кем не дружит.","a":"para","sub":"","o":["schiz","obs","narc"],"why":"дистанция — из ожидания злого умысла и с атакой на опережение (стр. 691), а не из амбивалентности к близости, как у шизоидного (стр. 946)."},{"q":"Финансовый контролёр годами одинаково подозрителен, держит обиды и объясняет любые сбои чужими интригами; эмоционально ровен, без качелей и самоповреждений. Когда новый руководитель начал подчёркнуто тепло его опекать, подозрительность резко выросла: «Зачем он так мил?»","a":"para","sub":"","o":["dysreg","psychop","obs"],"why":"стабильная проекция и рост подозрений в ответ на излишнее тепло (стр. 692); у дисрегулированного подозрительность вспыхивает ситуативно на фоне нестабильных отношений и аффекта (стр. 697)."},{"q":"Обаятельный менеджер по партнёрствам годами «занимает» у коллег деньги под трогательные истории и выдаёт чужие идеи за свои. Пойманный, спокойно меняет легенду и извиняется так убедительно, что ему снова верят; поражает, насколько точно он считывает настроение собеседника.","a":"psychop","sub":"пассивно-паразитический","o":["narc","hyst","hypom"],"why":"удовольствие от обмана, отсутствие раскаяния и точное чтение чужих состояний ради выгоды (стр. 692–693); нарциссическому нужно восхищение, а не выигрыш обманом."},{"q":"Директор по закупкам давит на поставщиков угрозами и запугивает подчинённых ради нужных условий. Когда сделка закрыта, интерес к людям у него пропадает: «добивать» проигравших он не возвращается и о них не вспоминает.","a":"psychop","sub":"агрессивный","o":["sadist","narc","para"],"why":"жестокость инструментальна — цель власть и выигрыш, люди интересны, пока полезны (стр. 692–693); садист унижает ради самого удовольствия от господства над слабым (стр. 694–695)."},{"q":"Старший смены без вспышек гнева, с улыбкой выстраивает для самой неопытной сотрудницы многоходовые «проверки», затем при всех разбирает её ошибки и заметно наслаждается её растерянностью. Выгоды ему это не приносит; с равными и начальством он безупречно корректен.","a":"sadist","sub":"","o":["psychop","para","obs"],"why":"холодное удовольствие от подчинения слабого, продуманный сценарий и выбор беззащитной мишени (стр. 694–695); выгоды нет (не психопатический), страха нападения нет (не параноидный)."},{"q":"Основатель семейной компании после инсульта формально отошёл от дел, но семья оставила за ним право вето. Он язвительно высмеивает ошибки младших родственников-сотрудников и сиделок, смакует их смущение и считает это нормальным «воспитанием»; такие сцены были всю его жизнь.","a":"sadist","sub":"","o":["narc","obs","para"],"why":"давнее удовольствие от унижения зависимых и уверенность в нормальности этого (стр. 948–949); у пожилого нарциссического — горечь, зависть и сожаления об утраченном (стр. 945)."},{"q":"Специалист по маркетингу после того, как руководительница перенесла встречу, ночью пишет ей десяток сообщений — от «вы единственная, кто меня понимает» до «вы такая же, как все». Утром говорит о пустоте и о том, что «не понимает, кто она»; в прошлом были самоповреждения.","a":"dysreg","sub":"","o":["hyst","depend","narc"],"why":"угроза привязанности запускает раскачку от идеализации к обесцениванию, пустоту и импульсивные действия (стр. 697–698); у истерического в центре тема пола и власти, а вне её возможны стабильные связи (стр. 686)."},{"q":"Новый сотрудник две недели восхищается командой, потом после нейтрального замечания коллеги решает, что его «выживают», и пишет заявление; на следующий день со слезами забирает. Говорит, что то хочет быть ближе к людям, то задыхается рядом с ними.","a":"dysreg","sub":"","o":["para","hypom","schiz"],"why":"подозрительность вспыхивает как неверное прочтение нейтрального сигнала на фоне дилеммы «близость — поглощение» (стр. 697); у параноидного недоверие стабильно и не сменяется восхищением (стр. 691)."},{"q":"Инженер после крика директора на планёрке будто «выключается»: смотрит в одну точку, позже не помнит, о чём договорились. В остальное время надёжен, без бурных отношений и самоповреждений.","a":"diss","o":["dysreg","hyst","schiz"],"why":"Эпизодический диссоциативный ответ на травматическое напоминание при стабильной личности — это защита или симптом (S5.2), а не стиль P-оси (стр. 735, 831).","sub":""}],"mcap":[{"q":"После двух бессонных ночей перед сдачей бюджета финансовый аналитик трижды открывает один и тот же файл, не может выбрать, с чего начать, и пропускает ошибку в формуле, которую обычно замечает сразу. Настроение ровное, ни с кем не конфликтует.","a":1,"o":[2,8,10],"why":"Страдают фокус, планирование и отсев лишнего, а аффект и поведение в норме. Усталость PDM-3 прямо называет причиной спада (стр. 714)."},{"q":"Руководительница направления на любой сбой отвечает одинаково громким раздражением, будь то сорванный срок, отказ подрядчика или опечатка в слайде. Через десять минут она удивляется, что «так завелась». Радость от побед команды почти не показывает. Решения при этом принимает взвешенно.","a":2,"o":[8,6,9],"why":"Сбой в силе и диапазоне самого чувства — аффект несоразмерен поводу и плохо осознаётся, позитивный спектр сужен. Импульсивных решений (8) нет, а самооценка (6) и защиты (9) здесь не главная мишень."},{"q":"Руководитель видит, что сотрудник час не отвечает в мессенджере, и заявляет: «Игнорирует — значит, уже ищет другую работу». Варианты «занят», «в дороге», «не заметил» он отвергает, а объяснению сотрудника не верит.","a":3,"o":[7,9,5],"why":"Одно жёсткое прочтение чужого ума без альтернатив и без пересмотра (стр. 717–718). Недоверие (7) здесь следствие, проекция (9) возможна, но сбой — в понимании чужого ума."},{"q":"Перед каждым советом директоров у главного инженера начинается мигрень и болит спина. О волнении он не говорит и уверен, что «организм такой»; обследования ничего не находят. Свои рабочие ошибки при этом разбирает спокойно и вдумчиво.","a":4,"o":[2,12,10],"why":"В ситуации угрозы переживание уходит в тело, и душевное не отделяется от телесного (стр. 720). Аффект не хаотичен (2), а самонаблюдение (12) в целом сохранно."},{"q":"Новый директор по развитию за два месяца трижды меняет позицию по стратегии, и каждый раз она совпадает с мнением того, с кем он говорил последним. На вопрос «а как видите вы?» теряется. Коллег описывает одним словом: «нормальный», «сложная».","a":5,"o":[13,6,7],"why":"Нет устойчивого «я», позиция заимствуется у собеседника, образы других бедные (стр. 720–721). С агентностью (13) это не главное: неясно не «как действовать», а «кто я в этом»."},{"q":"Опытный консультант после одного резкого отзыва клиента неделю называет себя «самозванцем» и отменяет встречи. После аплодисментов на конференции он говорит коллегам, что «в этой нише равных нет». В остальное время с людьми ровен, в работе последователен.","a":6,"o":[5,2,11],"why":"Ощущение своей ценности качается вслед за внешней оценкой (стр. 722). Идентичность (5) и ценности (11) устойчивы, а аффект сам по себе не хаотичен (2)."},{"q":"После конфликта с куратором руководительница филиала месяц общается с ним только письменно и отказывается от помощи: «сама разберусь». Когда куратор уходит в отпуск, она звонит ему по пять раз в день.","a":7,"o":[6,8,13],"why":"Под стрессом дистанция не регулируется — уход сменяется прилипанием, а поддержку невозможно принять (стр. 724)."},{"q":"Коммерческий директор, получив отказ крупного клиента, в тот же вечер без согласования снижает цены на 40% для всей базы и рассылает письмо партнёрам. Утром всё отменяет и не понимает, «зачем так сделал».","a":8,"o":[1,2,10],"why":"Поступок совершён вслед за побуждением, без учёта последствий (стр. 724–725). Планирование (1) в обычном режиме сохранно, и речь о действии, а не только о чувстве (2)."},{"q":"В спокойные месяцы директор шутит над своими промахами и первым признаёт ошибки. В кризис «во всём виноваты регионы и рынок», вчерашний любимый заместитель становится «пустым местом», а обсуждать свою роль директор отказывается. Через месяц после стабилизации снова иронизирует над собой.","a":9,"o":[5,6,12],"why":"Под нагрузкой репертуар сдвигается от зрелых защит (юмор, самонаблюдение) к экстернализации и обесцениванию, а когда стресс спадает, возвращается (стр. 726)."},{"q":"После слияния компаний начальник отдела, прежде эффективный, полгода повторяет: «всё пропало». На новые правила он отвечает то саботажем, то пассивным «как скажете», своими сильными сторонами не пользуется и новых возможностей не видит.","a":10,"o":[13,9,1],"why":"Перемены и неопределённость не принимаются как часть жизни, отсюда протестный, пессимистичный или пассивный настрой (стр. 728)."},{"q":"Руководитель закупок спокойно говорит, что «откаты — нормальная практика, все так делают», и не смущается, когда это всплывает. При этом он публично отчитывает подчинённых за опоздания как за «непорядочность».","a":11,"o":[7,9,6],"why":"Ценности не интегрированы и подчинены выгоде, двойной стандарт не вызывает вины (стр. 729). Рационализация (9) здесь только форма, а мишень — сама моральная система."},{"q":"Сотрудник в третий раз увольняется через полгода после прихода нового руководителя. На вопрос коуча, что повторяется, отвечает: «Просто не везёт с начальниками», и говорить о своих реакциях ему неинтересно. При этом в текущих разговорах он хорошо понимает, что чувствуют коллеги.","a":12,"o":[3,10,13],"why":"Нет интереса к сюжетам, которые во времени связывают чувства, мотивы и поведение (стр. 730–731). Ментализация «здесь и сейчас» (3) сохранна."},{"q":"Талантливый продакт-менеджер говорит: «Карьера просто случилась, меня всегда кто-то двигал». Назвать цель на пять лет он не может, прошлые места работы описывает как не связанные эпизоды. Самооценка ровная, с людьми ладит, своё мнение по рабочим вопросам имеет.","a":13,"o":[5,10,6],"why":"Нет чувства авторства и связной истории, которая придаёт выборам смысл (стр. 731–732). Своё мнение у него есть, так что идентичность (5) сохранна, а самооценка (6) в порядке."}],"age":[{"q":"Основатель семейной компании просит консультанта «понять, какой характер растёт» у сына 2,5 лет: вспышки гнева, упрямство, трудно успокоить.","a":"оценить по осям IEC II–IV: функциональный уровень, сенсорную регуляцию, отношения","o":["PC-паттерн «импульсивный»","P-стиль psychop","ничего не делать, «перерастёт»"],"why":"До 3 лет оси личности нет. Вспышки понимаются через регуляцию и отношения (стр. 22–25, 144).","age":"iec"},{"q":"Девочке 3 года 8 месяцев. Мама вышла на новую должность, девочка пошла в корпоративный детский сад. При расставании тревожится. При этом речь, моторика и игра по возрасту: она сочиняет истории про куклу.","a":"MC-ось, оценка через игру и диалог","o":["только ось IV IEC","PC-паттерн «тормозимый»","диагноз IEC03"],"why":"Рамка 3–4 года гибкая. Если ребёнок символизирует и рассказывает, подходит система 4–11 (стр. 144, 148).","age":"iec"},{"q":"Топ-менеджер встревожен: двухлетний сын выбирает платья и «девчачьи» игры. Он спрашивает, не признак ли это проблемы с личностью.","a":"прогноз невозможен, важнее, как реагирует среда","o":["ранний признак расстройства","формирующийся истерический паттерн","регуляторно-сенсорное расстройство"],"why":"Такие интересы могут появиться с 2 лет, а их устойчивость предсказать нельзя (стр. 26–27). Трудности создаёт прежде всего реакция среды (стр. 222).\n\n---","age":"iec"},{"q":"Дочь финансового директора, 9 лет. Отличница, учителя ставят её в пример. Перед домашним заданием раскладывает принадлежности по строгой схеме, при сбое начинает заново и тратит на это по часу. Злости не показывает, друзей мало.","a":"pc_obs","o":["pc_inhib","pc_depr","pc_high"],"why":"Школа поощряет эти черты, но ритуалы съедают время, злость подавлена (стр. 241–242).","age":"child"},{"q":"Мальчик 10 лет говорит психологу корпоративного летнего лагеря: «Родители ссорятся из-за меня, я плохой». Изо всех сил старается быть удобным, перед контрольными болит живот.","a":"pc_depr","o":["pc_inhib","pc_obs","pc_dysreg"],"why":"Беды объясняются собственной «плохостью», а не страхом; у тормозимого ядро — страх и избегание (стр. 239–240).","age":"child"},{"q":"Восьмилетний сын сотрудницы в ответ на отказ кричит и рыдает 40 минут, утешения не помогают. Учительница в его рассказах то «самая добрая», то «злая ведьма». На следующий день он может ударить одноклассника, не думая о последствиях.","a":"пограничный уровень","o":["здоровый уровень","невротический уровень","психотический уровень"],"why":"Ребёнка трудно успокоить, видение «всё хорошее / всё плохое», действие вместо слов. Тестирование реальности в целом сохранно (стр. 232–234).\n\n---","age":"child"},{"q":"Сын партнёра фирмы, 16 лет, на летней стажировке. Гоняет на мопеде, пробует экстремальные виды спорта. При этом учится, у него есть близкие друзья, после выговора может подумать, зачем ему этот риск.","a":"возрастная норма (стиль не диагностируется)","o":["cphob","psychop","hyst"],"why":"Риск характерен примерно для половины подростков. Стиль — когда риск чрезмерный и уязвимость непереносима (стр. 472, 489).","age":"teen"},{"q":"Подросток 15 лет в школьном проектном офисе компании. Сидит один, говорит, что ему «никто не нужен», живёт в своём фантастическом мире. Точно описывает, кто на кого обиделся. Мать спрашивает: «Это аутизм?»","a":"schiz","o":["anxav","РАС (не личностный стиль)","psychop"],"why":"Сигналы считываются, но отношения отвергаются по внутренним причинам. При РАС считывание действительно нарушено (стр. 491).","age":"teen"},{"q":"Девушка 17 лет после ухода из дебатного клуба говорит: «Не знаю, кто я и чего хочу». С подругами отношения стабильные, родителей описывает объёмно, с плюсами и минусами.","a":"нормативный кризис идентичности","o":["dysreg","пограничный уровень","психотический уровень"],"why":"Образы себя и других интегрированы, значит, это не диффузия (стр. 469).\n\n---","age":"teen"},{"q":"Младший аналитик, 23 года. За два года сменил три работы и два города, сейчас «пробует продакт-менеджмент». Рефлексивен, оптимистичен, с девушкой вместе три года.","a":"нормативная нестабильность перехода","o":["dysreg","hypom","psychop"],"why":"Это исследование идентичности при сохранных отношениях и рефлексии (стр. 646).","age":"emerg"},{"q":"Стажёр, 21 год. Живёт с родителями, все решения согласует с мамой, ориентирован на одобрение сверстников, о будущем почти не думает.","a":"PDC-3-A","o":["PDC-3","PDC-3-C","PDC-3-IEC"],"why":"При запаздывающем созревании подростковая карта уместнее (стр. 9, 647).","age":"emerg"},{"q":"Специалистка, 24 года. После разрыва нанесла себе порезы. Конфликты в команде вспыхивают и гаснут, говорит о чувстве пустоты. Руководитель считает, что «это возраст».","a":"dysreg","o":["нормативная нестабильность","hyst","depend"],"why":"Пограничные картины в переходе особенно часты, «возраст» их не объясняет (стр. 647).\n\n---","age":"emerg"},{"q":"Новый клиент, руководитель 42 лет, пришёл с жалобой на конфликты в команде. С чего начинать по PDM-3?","a":"P-ось (уровень и стиль), затем M","o":["M-ось, затем P","сразу S-ось","только жалоба"],"why":"(стр. 10, 1024).","age":"adult"},{"q":"Сотрудница 30 лет: бурные отношения, страх покинутости, самоповреждения. Коллега-консультант называет её «пограничным типом».","a":"dysreg","o":["«пограничный стиль»","hyst","depend"],"why":"В PDM-3 «пограничный» обозначает только уровень (стр. 12).","age":"adult"},{"q":"Финансовый директор, 57 лет, с ранними когнитивными проблемами. Новые черты характера: раздражительность, подозрительность.","a":"логика пожилого возраста (сначала M, адаптация к изменениям)","o":["стандартный P-first","PC","«это просто характер»"],"why":"Клиническая граница — 55 лет, возрастные рамки гибкие (стр. 9, 899, 901).\n\n---","age":"adult"},{"q":"Бывший генеральный директор, 71 год. После пенсии видится с двумя старыми друзьями, остальные связи отпустил, увлечён садом, доволен жизнью.","a":"нормативная избирательность","o":["schiz","anxav","dep_r"],"why":"Сужение круга ради эмоционально ценных контактов. Пожизненной темы «близость — дистанция» нет (стр. 928, 938).","age":"older"},{"q":"
